  gameState.player.tresorerie = CHANNEL_TYPES[gameState.player.type].baseBudget;
  // Le coût de grille de départ représente 30% de la trésorerie disponible en début de partie.
  // Le cumul ne contient que les coûts réellement arrêtés. Le coût de la saison en
  // cours est suivi séparément dans coutGrilleEngageSaison.
  gameState.player.coutGrilleCumul = 0;
  gameState.player.revenusPubCumul = 0;
  gameState.player.popularite = 50;

  initCompetitors();

  const targetDemo = gameState.player.target;
  const demoTotals = {};
  ['j1524', 'a2549', 's50', 'csp'].forEach(d => {
    demoTotals[d] = gameState.competitors.reduce((sum, c) => sum + Math.max(1, c.pda[d]), 0);
  });

  gameState.player.pda = { j1524: 0.2, a2549: 0.2, s50: 0.2, csp: 0.2 };
  gameState.player.pda[targetDemo] = demoTotals[targetDemo] * 0.0101;

  gameState.player.arcomHistory = [];
  gameState.player.arcomViolations = [];
  gameState.player.arcomSanctionsCount = 0;
  gameState.player.sportDisciplinesSeen = [];
  gameState.player.lastArcomResult = null;
  gameState.renewalDue = false;
  gameState.gameOverReason = null;
  resetSeasonEditoMix();

  const player = gameState.player;
  player.puissanceCommerciale = 1;
  player.budgetGrilleAnnuel = 0.30 * player.tresorerie;
  player.coutGrilleEngageSaison = player.budgetGrilleAnnuel;
  player.revenusPubPrevisionnels = 0;
  player.revenusPubFinals = 0;
  player.regieRecettesSaison = 0;
  player.resultatSaison = 0;
  player.rentabiliteGrille = 0;
  player.coutParPointPDA = 0;
  player.coutTalentsSaison = 0;
  player.slotAudienceDeltas = {};
  player.tresorerieDebutSaison = player.tresorerie;
  const seedPdaCible = getCalculatedPDAs().find(item => item.channel === player).pda[targetDemo];
  player.pdaHistorySeason = [seedPdaCible];
  player.pdaMoyenneSaison = seedPdaCible;
  player.pdaFinSaison = seedPdaCible;
}

function getAllChannels() {
  return [gameState.player, ...gameState.competitors];
}

// Mémorise la PDA (sur la cible du joueur) de chaque chaîne au début d'une saison,
// pour permettre d'afficher sa dynamique (vs début de saison 1, vs saison précédente
// ensuite) dans le bilan de fin de saison.
function captureSeasonBaseline() {
  const targetKey = gameState.player.target;
  getCalculatedPDAs().forEach(item => {
    const c = item.channel;
    c.pdaSeasonBaseline = item.pda[targetKey];
    c.slotBaseline = Object.fromEntries(TIME_SLOTS.map(({ key }) => [key, item.slots[key][targetKey]]));
    const own = c === gameState.player ? targetKey
      : (GAME_BALANCE.competitors.profiles[c.strategy]?.targetPriority || c.target);
    c.slotBaselineOwn = Object.fromEntries(TIME_SLOTS.map(({ key }) => [key, item.slots[key][own]]));
  });
}

const SLOT_GENRE_CACHE = new Map();
function cachedSlotGenre(channelType, slot, name) {
  const key = `${channelType}|${slot}|${name}`;
  if (!SLOT_GENRE_CACHE.has(key)) {
    SLOT_GENRE_CACHE.set(key, programEditorialProfile({ name: String(name || ''), channelType, slot, format: '' }).genre);
  }
  return SLOT_GENRE_CACHE.get(key);
}

// Niveau d'investissement (0 faible → 3 exceptionnel). Les contrats IA le portent
// explicitement ; pour le joueur, il découle de la production choisie.
function contractInvestLevel(contract) {
  if (Number.isInteger(contract?.investLevel)) return contract.investLevel;
  const talent = contract?.talentAnnual || 0;
  return talent >= 2 ? 3 : talent >= 0.5 ? 2 : 1;
}

function channelSlotProfile(channel, slot) {
  const contract = activeContract(channel, slot);
  if (contract) {
    return { genre: contract.editorial?.genre || cachedSlotGenre(channel.type, slot, contract.name),
      target: contract.target || channel.target, level: contractInvestLevel(contract), contract };
  }
  const name = channel.grilleOverrides?.[slot] || PROGRAM_GRID[channel.type]?.[slot] || '';
  return { genre: cachedSlotGenre(channel.type, slot, name), target: channel.target, level: 1, contract: null };
}

function genreOverlap(a, b) {
  if (a === b) return 1;
  return GAME_BALANCE.counterProgramming.genreOverlap[[a, b].sort().join('|')] ?? 0.1;
}

// Pression concurrentielle d'une chaîne sur un créneau et une cible : la confrontation
// dépend des genres, de l'affinité des programmes avec la cible et de l'investissement
// adverse. Saturation multiplicative : plusieurs concurrents ne se cumulent jamais
// au-delà du plafond.
function counterProgrammingFactor(profiles, index, target) {
  const cfg = GAME_BALANCE.counterProgramming;
  const affinity = p => p.target === target ? 1 : cfg.offTargetAffinity;
  const me = profiles[index];
  let keep = 1, bonus = 0;
  profiles.forEach((other, j) => {
    if (j === index) return;
    const overlap = genreOverlap(me.genre, other.genre);
    const clash = overlap * affinity(me) * affinity(other) * (0.6 + 0.25 * other.level);
    keep *= 1 - Math.min(1, clash * cfg.intensity / cfg.maxPenalty);
    if (other.level >= 2 && overlap <= 0.3 && affinity(other) === 1) bonus += cfg.alternativeBonus * affinity(me);
  });
  const penalty = cfg.maxPenalty * (1 - keep);
  bonus = Math.min(cfg.maxBonus, bonus);
  return { penalty, bonus, factor: (1 - penalty) * (1 + bonus) };
}

function channelTalentBoost(channel, genre) {
  return (channel.talents || [])
    .filter(t => t.specialty === genre && (t.until ?? Infinity) >= gameState.season)
    .reduce((sum, t) => sum + (t.bonus || 0), 0);
}

function getCalculatedPDAs() {
  const channels = getAllChannels();
  const demos = ['j1524', 'a2549', 's50', 'csp'];
  const results = channels.map(channel => ({channel, name:channel.name, pda:{}, slots:{}, expectedSlots:{}, intrinsicSlots:{}, leadIns:{}, pressure:{}, globalPda:0}));
  for (const {key:slot} of TIME_SLOTS) {
    results.forEach(r => { r.slots[slot] = {}; r.expectedSlots[slot] = {}; r.intrinsicSlots[slot] = {}; r.leadIns[slot] = {}; r.pressure[slot] = {}; });
    const profiles = channels.map(c => channelSlotProfile(c, slot));
    demos.forEach(target => {
      const pressures = profiles.map((_, i) => counterProgrammingFactor(profiles, i, target));
      const powers = channels.map((c, i) => {
        const contract = activeContract(c, slot);
        const boost = contract?.audienceDeltas
          ? (contract.audienceDeltas[target] || 0)
          : contract ? contract.power * (contract.target === target ? 1 : 0.2) : 0;
        const careerBoost = contract ? programCareerPower(contract) * (contract.target === target ? 1 : 0.25) : 0;
        const investment = c.slotInvestments?.[slot];
        const competitorBoost = investment && investment.expires >= gameState.season ? (investment.targets?.[target] || 0) : 0;
        const talentBoost = channelTalentBoost(c, profiles[i].genre) * (profiles[i].target === target ? 1 : 0.35);
        return Math.max(0.1, (c.pda[target] * SLOT_AFFINITY[c.type][slot] + boost + careerBoost + competitorBoost + talentBoost)
          * pressures[i].factor);
      });
      const total = powers.reduce((sum,v) => sum+v,0);
      results.forEach((r,i) => {
        r.pressure[slot][target] = pressures[i];
        const persistedImpact = r.channel.slotAudienceDeltas?.[slot]?.[target] || 0;
        const expected = powers[i]/total*100;
        r.expectedSlots[slot][target] = expected;
        r.intrinsicSlots[slot][target] = Math.max(0.1, Math.min(99.9, expected + persistedImpact));
      });
    });
  }
  // Une seule passe chronologique. Le bonus reçu n'entre jamais dans le calcul transmis,
  // qui repose exclusivement sur intrinsicSlots : aucune boucle ni cascade amplifiée.
  for (const [source, destination] of LEAD_IN_TRANSITIONS) {
    const coefficient = GAME_BALANCE.leadIn.transitions[`${source}_${destination}`];
    results.forEach(r => demos.forEach(target => {
      const gap = r.intrinsicSlots[source][target] - r.expectedSlots[source][target];
      r.leadIns[destination][target] = Math.max(-GAME_BALANCE.leadIn.maxBonus,
        Math.min(GAME_BALANCE.leadIn.maxBonus, gap * coefficient));
    }));
  }
  results.forEach(r => TIME_SLOTS.forEach(({key}) => demos.forEach(target => {
    r.slots[key][target] = Math.max(0.1, Math.min(99.9,
      r.intrinsicSlots[key][target] + (r.leadIns[key][target] || 0)));
  })));
  results.forEach(r => {
    demos.forEach(target => {
      r.pda[target] = TIME_SLOTS.reduce((sum,{key}) => sum+r.slots[key][target]*SLOT_AUDIENCE_WEIGHTS[key],0);
    });
    r.globalPda = demos.reduce((sum,d) => sum+r.pda[d],0)/demos.length;
  });
  return results;
}

function programCareerPower(contract) {
  if (!contract?.career) return 0;
  const c = contract.career;
  const recognition = c.awareness * GAME_BALANCE.programCareer.awarenessPower
    + c.loyalty * GAME_BALANCE.programCareer.loyaltyPower;
  const wear = c.wear * GAME_BALANCE.programCareer.wearPenalty;
  return Math.max(-1.5, recognition - wear + (c.potential - c.basePotential));
}

function getSlotBreakdown(channel, slot, target) {
  const row = getCalculatedPDAs().find(item => item.channel === channel);
  return { expected: row.expectedSlots[slot][target], intrinsic: row.intrinsicSlots[slot][target],
    leadIn: row.leadIns[slot][target] || 0, final: row.slots[slot][target] };
}

function normalizeAudienceText(value) {
  return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

// Ordre de resolution : programme reel de la grille, metadonnee explicite, puis sens
// editorial du dilemme. "global" est volontairement reserve aux sujets transversaux.
function resolveDilemmaAudienceImpacts(dilemma, choice) {
  if (Array.isArray(choice.audienceImpacts)) return choice.audienceImpacts.map(impact => ({ ...impact, explicit: true }));
  if (choice.audienceImpact) return [{ ...choice.audienceImpact, explicit: true }];
  if (choice.grille?.slot) return [{ slot: choice.grille.slot, targets: choice.pda }];

  const text = normalizeAudienceText(`${dilemma.titre} ${dilemma.desc} ${choice.l} ${choice.r}`);
  const contracts = Object.entries(gameState.player.contracts || {});
  const named = contracts.find(([, contract]) => {
    const name = normalizeAudienceText(contract.name);
    return name.length >= 5 && text.includes(name);
  });
  if (named) return [{ slot: named[0], targets: choice.pda, programId: named[1].id }];

  const editorialGenre = [
    [/talk|jeu|quiz|magazine|debat|entretien/, ['diverti', 'info']],
    [/fiction|serie|film|telefilm|cinema/, ['fiction']],
    [/documentaire|culture|patrimoine/, ['culture']],
    [/jeunesse|animation|enfant/, ['jeunesse']],
    [/sport|match|football|rugby|tennis|course|combat/, ['sport']],
    [/journal|\bjt\b|information|enquete|reportage/, ['info']]
  ].find(([pattern]) => pattern.test(text));
  const genreContract = editorialGenre && contracts.find(([, contract]) =>
    editorialGenre[1].includes(contract.editorial?.genre));

  let slots;
  if (/toute la soiree|soiree entiere|apres-match/.test(text)) slots = ['prime', 'nuit'];
  else if (/late.show|deuxieme partie|nocturne|de nuit|nuit|apres.match|23h/.test(text)) slots = ['nuit'];
  else if (/matinale|du matin|matin|petit.dejeuner|13h/.test(text)) slots = [/13h/.test(text) ? 'apresmidi' : 'matin'];
  else if (/apres.midi|journee|week.end|dominical|samedi|dimanche/.test(text)) slots = ['apresmidi'];
  else if (/access|avant le prime|fin de journee|18h|19h|20h|talk.show/.test(text)) slots = ['access'];
  else if (/prime|premiere partie|grand divertissement|tele.crochet|soiree|evenement|blockbuster/.test(text)) slots = ['prime'];
  else if (genreContract) slots = [genreContract[0]];
  else if (/identite de la chaine|toute la chaine|antenne entiere|crise d.image|marque|positionnement|diffusion generalisee/.test(text)) slots = ['global'];
  else slots = ['prime']; // Un impact editorial reste local par defaut.

  return slots.map((slot, index) => ({
    slot,
    targets: choice.pda,
    // Une prolongation de soiree produit un effet secondaire plus faible en nuit.
    multiplier: slots.length > 1 && index > 0 ? 0.35 : 1
  }));
}

function applyDilemmaAudienceImpacts(dilemma, choice, popularityBefore) {
  const player = gameState.player;
  player.slotAudienceDeltas ??= {};
  const resolved = resolveDilemmaAudienceImpacts(dilemma, choice);
  const applied = [];
  for (const impact of resolved) {
    const slots = impact.slot === 'global' ? TIME_SLOTS.map(s => s.key) : [impact.slot];
    for (const slot of slots) {
      if (!TIME_SLOTS.some(s => s.key === slot)) continue;
      player.slotAudienceDeltas[slot] ??= {};
      const targetValues = impact.targets || choice.pda || {};
      const targets = Object.keys(targetValues).length ? Object.keys(targetValues) : ['j1524', 'a2549', 's50', 'csp'];
      for (const target of targets) {
        let raw = Number(targetValues?.[target] ?? impact.value ?? 0);
        if (popularityBefore < 25 && raw < 0) raw *= 1.5;
        if (popularityBefore > 75 && raw > 0) raw *= 1.25;
        const delta = raw * (impact.explicit ? 1 : DILEMMA_SLOT_IMPACT_SCALE) * (impact.multiplier ?? 1);
        player.slotAudienceDeltas[slot][target] = (player.slotAudienceDeltas[slot][target] || 0) + delta;
      }
    }
    applied.push({ slot: impact.slot, value: (impact.targets?.[player.target] ?? impact.value ?? choice.pda?.[player.target] ?? 0)
      * (impact.explicit ? 1 : DILEMMA_SLOT_IMPACT_SCALE) * (impact.multiplier ?? 1), programId: impact.programId || dilemma.programId || null });
  }
  return applied;
}

// Tableau de controle exploitable depuis la console : auditAudienceDilemmas().
function auditAudienceDilemmas() {
  const rows = DILEMMA_BANK.flatMap(dilemma => dilemma.c
    .filter(choice => (choice.pda && Object.values(choice.pda).some(Number.isFinite)) || choice.audienceImpact || choice.audienceImpacts)
    .map(choice => ({
      dilemme: dilemma.titre,
      choix: choice.l,
      impactHistorique: JSON.stringify(choice.pda),
      nouveauCiblage: resolveDilemmaAudienceImpacts(dilemma, choice).map(i => i.slot).join(' + ')
    })));
  console.table(rows);
  return rows;
}

function resetSeasonEditoMix() {
  const base = EDITO_BASE[gameState.player.type];
  gameState.player.editoMix = { ...base };
  gameState.player.seasonCreationSpend = 0;
  gameState.player.seasonTotalSpend = 0;
}

function applyDilemmaEditoImpact(dilemma, choiceIndex, choice) {
  const player = gameState.player;
  const tags = DILEMMA_FLAVOR[dilemma.id];
  const impact = tags ? tags[choiceIndex] : null;
  if (impact) {
    EDITO_CATEGORIES.forEach(cat => {
      if (choice.grille && cat !== 'pluralisme' && cat !== 'protection') return;
      if (impact[cat]) {
        player.editoMix[cat] = Math.max(0, Math.min(100, player.editoMix[cat] + impact[cat]));
      }
    });
    if (!choice.grille && impact.discipline && !player.sportDisciplinesSeen.includes(impact.discipline)) {
      player.sportDisciplinesSeen.push(impact.discipline);
    }
  }
  const spend = choice.finance.purchase + Math.max(0, choice.finance.recurring);
  if (spend > 0 && !choice.grille) {
    player.seasonTotalSpend += spend;
    if (impact && impact.creation > 0) {
      player.seasonCreationSpend += spend;
    }
  }
}

function computeObligationActual(ob, editoMix, player) {
  const calc = ob.calc;
  if (calc.cat) {
    const val = editoMix[calc.cat] || 0;
    return calc.factor ? val * calc.factor : val;
  }
  if (calc.composite) {
    return editoMix[calc.composite.join('_')] ?? 0;
  }
  if (calc.special === 'investCreation') {
    const investment = gridCreationInvestment(player);
    return investment.total > 0 ? 100*investment.creation/investment.total : 0;
  }
  if (calc.special === 'sportDisciplines') {
    return new Set([...(player.sportDisciplinesSeen || []), ...TIME_SLOTS.flatMap(({key}) =>
      activeContract(player,key)?.editorial?.disciplines || [])]).size;
  }
  return 0;
}

function obligationScoreFromRate(rate) {
  if (rate >= 1) return 100;
  if (rate >= 0.9) return 80 + (rate - 0.9) / 0.1 * 20;
  if (rate >= 0.75) return 50 + (rate - 0.75) / 0.15 * 30;
  return Math.max(0, rate / 0.75 * 50);
}

function getArcomStatusMeta(score) {
  if (score >= 90) return { key: 'excellent', label: 'EXCELLENT', emoji: '🟢' };
  if (score >= 75) return { key: 'conforme', label: 'CONFORME', emoji: '🟢' };
  if (score >= 60) return { key: 'vigilance', label: 'VIGILANCE', emoji: '🟠' };
  if (score >= 40) return { key: 'manquements', label: 'MANQUEMENTS', emoji: '🔴' };
  return { key: 'nonconforme', label: 'NON-CONFORME', emoji: '⛔' };
}

function computeArcomCompliance() {
  const player = gameState.player;
  const convention = ARCOM_CONVENTIONS[player.type];
  const editoMix = gridEditorialMix(player);

  const rawValues = convention.obligations.map(ob => computeObligationActual(ob, editoMix, player));

  let weightedSum = 0, weightTotal = 0;
  const obligations = convention.obligations.map((ob, i) => {
    // Chaque obligation a son propre dénominateur (antenne, création, etc.).
    const actualValue = rawValues[i];
    const rate = ob.minimum > 0 ? actualValue / ob.minimum : 1;
    const score = obligationScoreFromRate(rate);
    weightedSum += score * ob.weight;
    weightTotal += ob.weight;
    return { ...ob, actualValue, rate, score, compliant: rate >= 1 };
  });
  const arcomScore = Math.round(weightTotal > 0 ? weightedSum / weightTotal : 100);
  return { obligations, arcomScore, status: getArcomStatusMeta(arcomScore) };
}

function pushArcomSeasonResult() {
  const player = gameState.player;
  const soldeAvant = player.tresorerie;
  const compliance = computeArcomCompliance();
  player.arcomHistory.push({
    season: gameState.season,
    score: compliance.arcomScore,
    status: compliance.status.key,
    violations: compliance.obligations.filter(o => o.rate < 1).length
  });
  compliance.obligations.forEach(ob => {
    if (ob.rate < 0.75) {
      player.arcomViolations.push({ season: gameState.season, obligation: ob.id, label: ob.label, severity: 'grave', penalty: 6, weight: ob.weight });
    } else if (ob.rate < 0.9) {
      player.arcomViolations.push({ season: gameState.season, obligation: ob.id, label: ob.label, severity: 'significatif', penalty: 3, weight: ob.weight });
    } else if (ob.rate < 1) {
      player.arcomViolations.push({ season: gameState.season, obligation: ob.id, label: ob.label, severity: 'leger', penalty: 1, weight: ob.weight });
    }
  });
  const tier = compliance.status.key;
  if (tier === 'excellent') {
    player.popularite = Math.min(100, player.popularite + 1);
    player.tresorerie += 1;
  } else if (tier === 'manquements') {
    player.tresorerie -= 3;
    player.popularite = Math.max(0, player.popularite - 2);
    player.arcomSanctionsCount++;
  } else if (tier === 'nonconforme') {
    player.tresorerie -= 8;
    player.popularite = Math.max(0, player.popularite - 5);
    player.arcomSanctionsCount++;
  }
  player.fluxArcomSaison = player.tresorerie - soldeAvant;
  player.lastArcomResult = compliance;
  return compliance;
}

function computeRenewalScore() {
  const player = gameState.player;
  const recent = player.arcomHistory.slice(-CONVENTION_DURATION);
  const complianceAverage = recent.length ? recent.reduce((s, h) => s + h.score, 0) / recent.length : 100;
  const graveWeightSum = player.arcomViolations
    .filter(v => v.severity === 'grave' && v.season > gameState.season - CONVENTION_DURATION)
    .reduce((sum, v) => sum + (v.weight || 5), 0);
  const graveWeightPerSeason = graveWeightSum / Math.max(1, recent.length);
  const violationScore = Math.max(0, 100 - graveWeightPerSeason * 8);
  const obligationsNow = player.lastArcomResult ? player.lastArcomResult.obligations : [];
  const diversityScore = obligationsNow.length ? Math.round(obligationsNow.reduce((s, o) => s + o.score, 0) / obligationsNow.length) : 100;
  const creationInvestmentScore = Math.min(100, Math.round((gridEditorialMix(player).creation || 0) / 12 * 100));
  const sanctionHistoryScore = Math.max(0, 100 - player.arcomSanctionsCount * 15);
  const renewalScore = Math.round(
    complianceAverage * 0.40 +
    violationScore * 0.25 +
    diversityScore * 0.15 +
    creationInvestmentScore * 0.10 +
    sanctionHistoryScore * 0.10
  );
  return { renewalScore, complianceAverage, violationScore, diversityScore, creationInvestmentScore, sanctionHistoryScore };
}

function getRenewalOutcome(score) {
  if (score >= 80) return { key: 'renewed', emoji: '🟢', title: 'CONVENTION RENOUVELÉE', message: "Votre chaîne respecte durablement les engagements de sa convention. L'autorisation est renouvelée." };
  if (score >= 65) return { key: 'conditional', emoji: '🟠', title: 'CONVENTION RENOUVELÉE SOUS CONDITIONS', message: "L'ARCOM renouvelle votre convention sous réserve d'un plan de redressement." };
  if (score >= 50) return { key: 'watch', emoji: '🟠', title: 'RENOUVELLEMENT SOUS SURVEILLANCE', message: "La chaîne conserve son autorisation mais fait l'objet d'un contrôle renforcé." };
  return { key: 'refused', emoji: '⛔', title: 'RENOUVELLEMENT REFUSÉ', message: "L'ARCOM refuse de renouveler votre autorisation d'émettre." };
}

function chooseDilemmaOption(choiceIndex) {
  if (gameState.step !== 6 || gameState.dilemmaPhase !== 'choosing') return;
  const dilemma = gameState.dilemmaQueue[gameState.currentDilemmaIndex];
  if (!dilemma || !Number.isInteger(choiceIndex) || !dilemma.c[choiceIndex]) return;
  const choice = dilemma.c[choiceIndex];
  ensureCampaign();
  // La grille du joueur se fige au premier dilemme : les intentions concurrentes
  // annoncées deviennent la programmation confirmée de la saison.
  if (gameState.currentDilemmaIndex === 0) confirmCompetitorPlans();
  const player = gameState.player;
  const popAvant = player.popularite;

  applyDilemmaEditoImpact(dilemma, choiceIndex, choice);

  const decisionQuote = choice.careerAction ? quoteCareerDilemma(choice) : quoteDilemma(choice);

  const calculatedAvant = getCalculatedPDAs().find(item => item.channel === player);
  const pdaCibleAvant = calculatedAvant.pda[player.target];
  const resolvedAudienceImpacts = applyDilemmaAudienceImpacts(dilemma, choice, popAvant);
  const calculatedApresImpact = getCalculatedPDAs().find(item => item.channel === player);
  const slotAudienceDeltas = resolvedAudienceImpacts.map(impact => {
    if (impact.slot === 'global') return { ...impact, value: pdaCibleAvant === calculatedApresImpact.pda[player.target]
      ? 0 : calculatedApresImpact.pda[player.target] - pdaCibleAvant };
    return { ...impact, value: calculatedApresImpact.slots[impact.slot][player.target]
      - calculatedAvant.slots[impact.slot][player.target] };
  });

  const competitorReactions = strategicCompetitors();

  // À partir de la saison 2, la grille est provisionnée à l'ouverture. Les choix
  // ajustent ensuite immédiatement la trésorerie ; en saison 1, seul le surcoût
  // ou l'économie lié au choix affecte le capital de lancement.
  // Les flux sont explicites. Les économies respectent les contrats actifs ;
  // un remplacement inclut l'indemnité et retire l'ancien engagement annuel.
  if (choice.grille && !choice.careerAction) delete player.contracts[choice.grille.slot];
  const coutGrilleDelta = applyFinance(decisionQuote.finance,
    choice.careerAction === 'stop' ? dilemma.careerSlot : null);
  // Arrêt / non-renouvellement : l'économie allège le coût de grille (donc la grille à
  // payer à la saison suivante), mais la saison en cours a déjà été réglée — aucun
  // remboursement n'est versé en trésorerie.
  const economieDifferee = choice.careerAction === 'stop' && coutGrilleDelta < 0;
  if (economieDifferee) player.tresorerie += coutGrilleDelta;
  // Les dilemmes de régie publicitaire (d_pub*) créditent l'indicateur Revenus pub plutôt
  // que le compteur générique de recettes commerciales : on annule ici le crédit générique
  // déjà appliqué par applyFinance pour le rediriger via revenusPubPrevisionnels ci-dessous.
  const regieCommercial = dilemma.id.startsWith('d_pub') ? decisionQuote.finance.commercial : 0;
  if (regieCommercial > 0) {
    player.commercialSaison -= regieCommercial;
    player.tresorerie -= regieCommercial;
  }
  // Certains dilemmes régie sont des investissements : leur choix gagnant reconduit son
  // bénéfice indéfiniment (chaque saison, chaque dilemme suivant) via un total permanent,
  // au lieu d'un crédit ponctuel valable uniquement pour ce dilemme.
  const isRegieInvestment = REGIE_INVESTMENT_IDS.includes(dilemma.id) && regieCommercial > 0;
  if (isRegieInvestment) {
    player.regieInvestissementsAnnuel = (player.regieInvestissementsAnnuel || 0) + regieCommercial;
  } else if (regieCommercial > 0) {
    // Une opération ponctuelle reste acquise jusqu'à la fin de la saison : elle rejoint le
    // total régie de la saison au lieu d'être annulée par la réestimation suivante.
    player.regieRecettesSaison = (player.regieRecettesSaison || 0) + regieCommercial;
  }
  if (choice.careerAction) {
    applyCareerDilemmaChoice(dilemma, choice);
  } else if (choice.gridRenewal) {
    applyGridRenewalChoice(dilemma, choice);
  } else if (choice.grille) {
    const slot=choice.grille.slot;
    const annual=Math.max(0,choice.finance.recurring);
    player.contracts[slot]={id:'editorial-'+dilemma.id+'-'+choiceIndex, name:choice.grille.programme,
      annual, talent:'Équipe du programme', talentAnnual:0, power:0,
      target:player.target, end:gameState.season, source:'dilemma', slot,
      audienceDeltas:{},
      career:createProgramCareer({power:0, format:'magazine'}, slot),
      editorial:programEditorialProfile({name:choice.grille.programme, channelType:player.type, slot})};
    player.coutTalentsSaison=Math.max(0,player.coutTalentsSaison-decisionQuote.replacedTalent);
    player.grilleOverrides[slot]=choice.grille.programme;
  }
  player.decisionHistory.push({id:dilemma.id, choice:choiceIndex, season:gameState.season, ...decisionQuote.finance});
  const talentCost = DILEMMA_TALENT_COST[dilemma.id];
  if (talentCost) {
    player.coutTalentsSaison += talentCost[choiceIndex];
  }
  player.popularite = Math.max(0, Math.min(100, player.popularite + choice.pop));
  // Renégociation régie : la puissance commerciale évolue avant la réestimation
  // unique des recettes ci-dessous (seul l'écart est crédité, jamais deux fois).
  const puissanceAvant = player.puissanceCommerciale;
  if (choice.regie) applyRegieDecision(choice.regie);

  const pdaCibleApres = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];
  player.pdaHistorySeason.push(pdaCibleApres);
  player.pdaMoyenneSaison = player.pdaHistorySeason.reduce((s, v) => s + v, 0) / player.pdaHistorySeason.length;
  player.pdaFinSaison = pdaCibleApres;

  // Les revenus publicitaires sont indexés sur la PDA globale courante (pas une moyenne de
  // saison) : la moindre variation, même infime, réestime immédiatement la valorisation
  // publicitaire. Seul l'écart avec l'estimation précédente est crédité/débité — la totalité
  // a déjà été créditée au lancement de la saison (creditInitialAdRevenue).
  const revenusPubAvant = player.revenusPubPrevisionnels;
  const revenusOrganiques = computeRevenusPub(pdaCibleApres, player.target, player.popularite, player.puissanceCommerciale);
  player.revenusPubPrevisionnels = revenusOrganiques + regieRevenueTotal(player);
  const revenusPubDelta = player.revenusPubPrevisionnels - revenusPubAvant;
  // Part due à la régie (nouvel accélérateur, opération ponctuelle, revalorisation des
  // tarifs) : affichée à part pour que l'évolution du CA publicitaire reflète uniquement
  // l'audience et la popularité, sans décalage lié aux accélérateurs.
  const effetTarifsRegie = revenusOrganiques
    - computeRevenusPub(pdaCibleApres, player.target, player.popularite, puissanceAvant);
  const regieGain = regieCommercial + effetTarifsRegie;
  const revenusPubHorsRegie = revenusPubDelta - regieGain;
  // Le flux net de trésorerie est bien la recette publicitaire moins la variation
  // de coût de grille : un surcoût (delta positif) réduit le solde, une économie
  // (delta négatif) l'augmente. La part régie est déjà comptée dans revenusPubDelta.
  const tresorerieDelta = revenusPubDelta - (economieDifferee ? 0 : coutGrilleDelta) - decisionQuote.finance.purchase + (decisionQuote.finance.commercial - regieCommercial);
  player.tresorerie += revenusPubDelta;

  // Rentabilité grille et coût/PDA sont recalculés en temps réel à chaque dilemme,
  // à partir des valeurs courantes de la saison (pas seulement au bilan de fin de saison).
  player.rentabiliteGrille = player.coutGrilleEngageSaison > 0 ? (player.revenusPubPrevisionnels / player.coutGrilleEngageSaison - 1) * 100 : 0;
  player.coutParPointPDA = player.pdaMoyenneSaison > 0 ? player.coutGrilleEngageSaison / player.pdaMoyenneSaison : 0;
  refreshEconomy();

  gameState.lastConsequence = {
    titre: dilemma.titre,
    choixLabel: choice.l,
    resultat: choice.r,
    deltas: {
      tresorerie: tresorerieDelta,
      pdaCible: pdaCibleApres - pdaCibleAvant,
      coutGrille: coutGrilleDelta,
      economieDifferee,
      achats: decisionQuote.finance.purchase,
      commercial: choice.finance.commercial - regieCommercial,
      revenusPub: revenusPubHorsRegie,
      regie: regieGain,
      regieRecurrente: isRegieInvestment,
      popularite: player.popularite - popAvant,
      slots: slotAudienceDeltas,
      competitors: competitorReactions
    },
    competitorEvent: competitorReactions[0] || null
  };

  gameState.logs.push({
    title: dilemma.titre,
    result: choice.r
  });

  gameState.currentDilemmaIndex++;

  if (player.tresorerie < TRESORERIE_CRITIQUE) {
    gameState.pendingNextStep = 8;
    gameState.gameOverReason = 'tresorerie';
  } else if (gameState.currentDilemmaIndex >= gameState.dilemmaQueue.length) {
    // Finalisation économique de la saison : les revenus pub et les ajustements de
    // grille ont déjà été comptabilisés en temps réel ; on fige les montants ici.
    player.revenusPubFinals = player.revenusPubPrevisionnels;
    // Les recettes sont déjà encaissées au fil des réestimations ; ce compteur
    // conserve en revanche le total historique des saisons clôturées.
    player.revenusPubCumul += player.revenusPubFinals;
    player.resultatSaison = player.revenusPubFinals - player.coutGrilleEngageSaison;
    player.coutGrilleCumul += player.coutGrilleEngageSaison;
    player.rentabiliteGrille = player.coutGrilleEngageSaison > 0 ? (player.revenusPubFinals / player.coutGrilleEngageSaison - 1) * 100 : 0;
    player.coutParPointPDA = player.pdaMoyenneSaison > 0 ? player.coutGrilleEngageSaison / player.pdaMoyenneSaison : 0;

    refreshEconomy();
    if (player.pdaFinSaison > player.pdaMoyenneSaison && player.popularite >= 60) {
      // Une revalorisation régie peut dépasser 1,15 : la dérive naturelle ne la rabote pas.
      player.puissanceCommerciale = Math.min(Math.max(1.15, player.puissanceCommerciale), player.puissanceCommerciale + 0.01);
    } else if ((player.pdaFinSaison < player.pdaMoyenneSaison * 0.9 || player.popularite < 40)
      && !(player.regieFloorUntil >= gameState.season)) {
      player.puissanceCommerciale = Math.max(0.85, player.puissanceCommerciale - 0.01);
    }

    gameState.history.push({
      season: gameState.season,
      tresorerie: player.tresorerie,
      pdaCible: pdaCibleApres,
      pdaDebut: player.pdaSeasonBaseline,
      coutGrille: player.coutGrilleEngageSaison,
      revenusPub: player.revenusPubFinals,
      popularite: player.popularite,
      tresorerieDebut: player.tresorerieDebutSaison,
      budgetGrille: player.budgetGrilleAnnuel,
      coutGrilleSaison: player.coutGrilleEngageSaison,
      pdaMoyenne: player.pdaMoyenneSaison,
      pdaFin: player.pdaFinSaison,
      revenusPubSaison: player.revenusPubFinals,
      resultatSaison: player.resultatSaison,
      tresorerieFin: player.tresorerie,
      rentabiliteGrille: player.rentabiliteGrille
    });
    evolveProgramCareers();
    pushArcomSeasonResult();
    // Les bonus/malus ARCOM sont des flux de clôture : l'historique doit refléter
    // le solde final après leur application.
    gameState.history[gameState.history.length - 1].tresorerie = player.tresorerie;
    gameState.history[gameState.history.length - 1].tresorerieFin = player.tresorerie;
    gameState.history[gameState.history.length - 1].fluxArcom = player.fluxArcomSaison;
    gameState.history[gameState.history.length - 1].popularite = player.popularite;
    gameState.lastConsequence.deltas.tresorerie += player.fluxArcomSaison;
    gameState.lastConsequence.deltas.popularite = player.popularite - popAvant;
    closeCampaignSeason();
    gameState.renewalDue = gameState.season % CONVENTION_DURATION === 0;
    if (player.tresorerie < TRESORERIE_CRITIQUE) {
      gameState.pendingNextStep = 8;
      gameState.gameOverReason = 'tresorerie';
    } else {
      gameState.pendingNextStep = 7;
    }
  } else {
    gameState.pendingNextStep = 6;
  }
  gameState.dilemmaPhase = 'result';

  render();
}

function continueAfterConsequence() {
  if (gameState.dilemmaPhase !== 'result' || gameState.pendingNextStep === null) return;
  gameState.step = gameState.pendingNextStep;
  gameState.pendingNextStep = null;
  gameState.dilemmaPhase = 'choosing';
  render();
}

function launchFirstSeason() {
  // Les chaînes installées arrêtent leur grille avant la rentrée : leurs programmes
  // pèsent dès l'ouverture sur les audiences et donc sur les recettes estimées.
  planCompetitorSeasons();
  captureSeasonBaseline();
  const player = gameState.player;
  const seed = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];
  player.pdaHistorySeason = [seed]; player.pdaMoyenneSaison = seed; player.pdaFinSaison = seed;
  gameState.dilemmaQueue = pickDilemmaQueue();
  gameState.currentDilemmaIndex = 0;
  // La première saison sert de lancement : son coût de grille est un apport
  // initial déjà couvert par le capital de départ, sans débit de trésorerie.
  gameState.step = 6;
  // Le crédit intégral intervient dès l'ouverture de la saison, avant même le choix de
  // programmation : la proposition ne fera plus qu'ajuster l'écart, comme un dilemme.
  creditInitialAdRevenue();
  gameState.seasonKickoffProposal = generateSeasonKickoffProposal();
  gameState.seasonKickoffPending = !!gameState.seasonKickoffProposal;
}

function startNewSeason() {
  if (!gameState.history.some(h => h.season === gameState.season)) return;
  captureSeasonBaseline();
  const player = gameState.player;
  gameState.season++;
  expireContracts();
  expireTalents();
  planCompetitorSeasons();
  gameState.currentDilemmaIndex = 0;
  gameState.dilemmaQueue = pickDilemmaQueue();
  gameState.dilemmaPhase = 'choosing';
  gameState.renewalDue = false;
  gameState.competitorEvents = [];

  // La nouvelle saison repart du coût de grille réellement arrêté à la fin de la
  // précédente ; il n'est donc pas recalculé ni remis à un budget théorique.
  player.budgetGrilleAnnuel = player.coutGrilleEngageSaison;
  player.tresorerieDebutSaison = player.tresorerie;
  // Le budget de grille est annuel : il revient chaque saison comme coût fixe de départ,
  // que les dilemmes de la saison viendront ensuite ajuster à la hausse ou à la baisse.
  // Il n'alimente le cumul qu'une fois la saison effectivement clôturée.
  player.coutGrilleEngageSaison = player.budgetGrilleAnnuel;
  player.tresorerie -= player.coutGrilleEngageSaison;
  player.revenusPubPrevisionnels = 0;
  player.revenusPubFinals = 0;
  player.regieRecettesSaison = 0;
  player.resultatSaison = 0;
  player.coutTalentsSaison = 0;
  player.fluxArcomSaison = 0;
  player.commercialSaison = 0;
  player.achatsSaison = 0;
  player.coutTalentsSaison = Object.values(player.contracts).reduce((sum,c)=>sum+c.talentAnnual,0)
    + (player.talents || []).filter(t => t.until >= gameState.season).reduce((sum, t) => sum + t.annual, 0);
  player.lastArcomResult = null;
  player.rentabiliteGrille = player.coutGrilleEngageSaison > 0 ? -100 : 0;
  const seedPdaCible = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];
  player.pdaHistorySeason = [seedPdaCible];
  player.pdaMoyenneSaison = seedPdaCible;
  player.pdaFinSaison = seedPdaCible;
  // Les cumuls historiques ne sont jamais remis à zéro ; seuls les prévisionnels
  // de la nouvelle saison repartent de zéro.
  resetSeasonEditoMix();
  player.coutParPointPDA = seedPdaCible > 0 ? player.coutGrilleEngageSaison / seedPdaCible : 0;
  gameState.step = player.tresorerie < TRESORERIE_CRITIQUE ? 8 : 6;
  if (gameState.step === 8) gameState.gameOverReason = 'tresorerie';
  if (gameState.step === 6) {
    // Le crédit intégral intervient dès l'ouverture de la saison, avant même le choix de
    // programmation : la proposition ne fera plus qu'ajuster l'écart, comme un dilemme.
    creditInitialAdRevenue();
    // Mercato des talents : une phase de décision unique, tous les deux ans.
    gameState.mercato = isMercatoSeason() ? generateMercato() : null;
    gameState.mercatoPending = !!gameState.mercato;
    // Une saison de mercato a déjà son arbitrage de rentrée (les talents) : la
    // conférence de rentrée n'est alors pas proposée, pour ne pas enchaîner deux phases.
    gameState.seasonKickoffProposal = gameState.mercato ? null : generateSeasonKickoffProposal();
    gameState.seasonKickoffPending = !!gameState.seasonKickoffProposal;
  }
  render();
}

function goHome() {
  if (gameState.step >= 2) {
    gameState.resumeStep = gameState.step;
  }
  gameState.step = 1;
  render();
}

function resetGame() {
  delete gameState.campaign;
  delete gameState.expiredPrograms;
  gameState.step = 1;
  gameState.resumeStep = null;
  gameState.player = {
    name: "",
    type: "generaliste",
    target: "a2549",
    tresorerie: 50,
    coutGrilleCumul: 0,
    revenusPubCumul: 0,
    popularite: 50,
    pda: { j1524: 0.3, a2549: 1.0, s50: 0.3, csp: 0.3 },
    editoMix: {},
    grilleOverrides: {},
    seasonCreationSpend: 0,
    seasonTotalSpend: 0,
    sportDisciplinesSeen: [],
    arcomHistory: [],
    arcomViolations: [],
    arcomSanctionsCount: 0,
    lastArcomResult: null,
    budgetGrilleAnnuel: 0,
    coutGrilleEngageSaison: 0,
    revenusPubPrevisionnels: 0,
    revenusPubFinals: 0,
    pdaMoyenneSaison: 0,
    pdaFinSaison: 0,
    pdaHistorySeason: [],
    puissanceCommerciale: 1,
    tresorerieDebutSaison: 50,
    resultatSaison: 0,
    rentabiliteGrille: 0,
    coutParPointPDA: 0,
    coutTalentsSaison: 0,
    regieInvestissementsAnnuel: 0,
    regieRecettesSaison: 0,
    slotAudienceDeltas: {}
};
  gameState.competitors = [];
  gameState.season = 1;
  gameState.currentDilemmaIndex = 0;
  gameState.dilemmaQueue = [];
  gameState.dilemmaPhase = 'choosing';
  gameState.logs = [];
  gameState.lastConsequence = null;
  gameState.pendingNextStep = null;
  gameState.hudExpanded = false;
  gameState.hudSlide = 0;
  gameState.talentFlipped = null;
  gameState.talentScouting = null;
  gameState.talentMarket = null;
  gameState.audienceShareTarget = null;
  gameState.seenDilemmaIds = [];
  gameState.history = [];
  gameState.renewalDue = false;
  gameState.gameOverReason = null;
  gameState.seasonKickoffPending = false;
  gameState.seasonKickoffProposal = null;
  gameState.competitorEvents = [];
  gameState.radar = { open: false, slot: 'prime', sheet: null };
  gameState.exclusivityNotice = null;
  gameState.mercato = null;
  gameState.mercatoPending = false;
  render();
}

function renderMasthead(sub, over) {
  return `
    <div class="masthead">
      <div class="over"><span class="header-brand"><span class="dot"></span>${over || `Audience Masters V2 — Saison ${gameState.season}`}</span></div>
      <h1 title="${esc(gameState.player.name || "Bienvenue dans l'arène")}">${esc(gameState.player.name || "Bienvenue dans l'arène")}</h1>
      <div class="under" title="${esc(sub)}">${sub}</div>
      ${renderMire(8)}
    </div>
  `;
}

function renderStepDots(active, total) {
  return `
    <div class="step-dots" aria-hidden="true">
      ${Array.from({ length: total }, (_, i) => `<span class="step-dot${i === active - 1 ? ' active' : ''}"></span>`).join('')}
    </div>
  `;
}

function renderTicker() {
  ensureCompetitorPlans();
  const p = gameState.player;
  const calculated = getCalculatedPDAs();
  const playerCalc = calculated.find(item => item.channel === p);
  const pdaCible = playerCalc.pda[p.target];
  const open = !!gameState.hudExpanded;

  // La trésorerie du HUD reflète le cash réellement disponible : à partir de la
  // saison 2, la grille est provisionnée à l'ouverture ; les ajustements et
  // revenus pub sont comptabilisés au fil des dilemmes.
  const tresorerieLive = p.tresorerie;

  const lastHistorySeason = gameState.history.length ? gameState.history[gameState.history.length - 1].season : null;
  const currentPoint = {
    season: gameState.season, tresorerie: p.tresorerie, pdaCible,
    coutGrille: p.coutGrilleEngageSaison, revenusPub: p.revenusPubPrevisionnels,
    popularite: p.popularite
  };
  const chartPoints = lastHistorySeason === gameState.season ? gameState.history : [...gameState.history, currentPoint];

  const programGridHtml = renderProgramGrid(p.type, pdaCible, p.grilleOverrides);
  const globalAudienceShareHtml = renderGlobalAudienceShare();
  const evolutionChartHtml = renderEvolutionChart(chartPoints);
  const compliance = computeArcomCompliance();
  const statStarsHtml = renderStatStars(p, pdaCible, compliance);
  const arcomSlideHtml = renderArcomSlide(compliance, ARCOM_CONVENTIONS[p.type]);
  const ecoBilanSlideHtml = renderEcoBilanSlide(p);
  const talentsSlideHtml = renderTalentsSlide();
  const slide = gameState.hudSlide || 0;

  return `
    <div class="hud-wrap">
      <div class="hud-panel">
        <div class="hud-panel-head">
          <span class="hud-panel-head-label"><span class="hud-live-dot"></span><span class="hud-panel-head-text">Tableau de bord</span></span>
          <div class="hud-panel-head-right">
            <span class="hud-type-badge">${CHANNEL_TYPES[p.type].label.replace(/\s*\/\s*Famille\b/, '')}</span>
            <span class="hud-type-badge hud-target-badge" title="Cible : ${esc(TARGET_STRATEGIES[p.target]?.nom || p.target)}">🎯 ${esc((TARGET_STRATEGIES[p.target]?.nom || p.target).replace(/\s*\([^)]*\)/, ''))}</span>
            <button class="hud-toggle${open ? ' open' : ''}" id="hud-toggle" aria-label="Détail des indicateurs" aria-expanded="${open}">
              <svg class="hud-toggle-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
          </div>
        </div>
        <div class="hud">
          <div class="hud-cell hero${tresorerieLive < 0 ? ' alert' : ''}">
            <div class="lab"><span class="ic">💰</span>Trésorerie</div>
            <div class="val">${nf1(tresorerieLive)} M€</div>
          </div>
          <div class="hud-cell hero">
            <div class="lab"><span class="ic">🎯</span>PDA Cible</div>
            <div class="val">${nf1(pdaCible)}%</div>
          </div>
          <div class="hud-cell">
            <div class="lab"><span class="ic">📋</span>Coût grille</div>
            <div class="val">${nf1(p.coutGrilleEngageSaison)} M€</div>
          </div>
          <div class="hud-cell">
            <div class="lab"><span class="ic">📺</span>Revenus pub</div>
            <div class="val">${nf1(p.revenusPubPrevisionnels)} M€</div>
          </div>
          <div class="hud-cell">
            <div class="lab"><span class="ic">⭐</span>Popularité</div>
            <div class="val">${Math.round(p.popularite)}%</div>
          </div>
        </div>
      </div>
      <div class="hud-details${open ? ' open' : ''}" id="hud-details">
        <div class="hud-details-inner">
          <div class="eh-slider" id="eh-slider">
            <div class="eh-slider-track" id="eh-slider-track" style="transform: translateX(-${slide * 100}%);">
              <div class="eh-slide programming-slide">${programGridHtml}</div>
              <div class="eh-slide">${ecoBilanSlideHtml}</div>
              <div class="eh-slide">${globalAudienceShareHtml}</div>
              <div class="eh-slide talents-slide">${talentsSlideHtml}</div>
              <div class="eh-slide">${evolutionChartHtml}</div>
              <div class="eh-slide">${statStarsHtml}</div>
              <div class="eh-slide arcom-slide-wrap">${arcomSlideHtml}</div>
            </div>
          </div>
          <div class="eh-slider-nav">
            <div class="eh-slider-dots" id="eh-slider-dots">
              ${Array.from({ length: HUD_SLIDE_COUNT }, (_, i) => `<button class="eh-dot${slide === i ? ' active' : ''}" data-slide="${i}" aria-label="Écran ${i + 1}"></button>`).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

const HUD_SLIDE_COUNT = 7;

// En mode Concurrence, le slider est figé sur la grille : on n'en sort
// qu'après être revenu sur « Ma grille ».
function isHudSliderLocked() {
  return !!(gameState.radar?.open && gameState.competitors?.length);
}

function syncHudSliderLock() {
  const locked = isHudSliderLocked();
  document.querySelector('.eh-slider-nav')?.classList.toggle('nav-locked', locked);
  document.querySelectorAll('.eh-dot').forEach(d => {
    d.disabled = locked;
    if (locked) d.setAttribute('aria-disabled', 'true'); else d.removeAttribute('aria-disabled');
  });
}

function bindTickerInteractions(app) {
  fitRadarToGridHeight();
  fitTalentCards();
  syncHudSliderLock();
  bindCampaignPanel(app);
  document.getElementById('hud-toggle').onclick = () => {
    const isOpen = document.getElementById('hud-details').classList.toggle('open');
    document.getElementById('hud-toggle').classList.toggle('open', isOpen);
    document.getElementById('hud-toggle').setAttribute('aria-expanded', isOpen);
    gameState.hudExpanded = isOpen;
  };
  const goToHudSlide = idx => {
    if (isHudSliderLocked()) idx = 0;
    const clamped = Math.max(0, Math.min(HUD_SLIDE_COUNT - 1, idx));
    gameState.hudSlide = clamped;
    document.getElementById('eh-slider-track').style.transform = `translateX(-${clamped * 100}%)`;
    document.querySelectorAll('.eh-dot').forEach(d => d.classList.toggle('active', parseInt(d.dataset.slide, 10) === clamped));
  };
  document.querySelectorAll('.eh-dot').forEach(dot => {
    dot.onclick = () => goToHudSlide(parseInt(dot.dataset.slide, 10));
  });
  const ehSlider = document.getElementById('eh-slider');
  const ehTrack = document.getElementById('eh-slider-track');
  let dragStartX = 0;
  let dragDeltaX = 0;
  let isDragging = false;
  // Avec la capture du pointeur, le clic est reçu par le slider : on garde
  // l'élément réellement pressé (cartes talents).
  let pressTarget = null;
  ehSlider.addEventListener('pointerdown', e => {
    pressTarget = e.target;
    if (e.target.closest('button, select, input, label, summary, .program-manager')) return;
    if (isHudSliderLocked()) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragDeltaX = 0;
    ehTrack.style.transition = 'none';
    ehSlider.setPointerCapture(e.pointerId);
  });
  ehSlider.addEventListener('click', e => {
    const radarBtn = e.target.closest('[data-radar-action]');
    if (radarBtn) {
      handleRadarAction(radarBtn);
      return;
    }
    const slotBtn = e.target.closest('[data-talent-slot]');
    if (slotBtn) {
      if (openTalentScouting(parseInt(slotBtn.dataset.talentSlot, 10))) refreshTalentsPanel();
      return;
    }
    const offerBtn = e.target.closest('[data-scout-offer]');
    if (offerBtn) {
      makeTalentOffer(parseInt(offerBtn.dataset.scoutOffer, 10));
      return;
    }
    if (e.target.closest('[data-scout-cancel]')) {
      if (closeTalentScouting()) refreshTalentsPanel();
      return;
    }
    const fireBtn = e.target.closest('[data-talent-fire]');
    if (fireBtn) {
      openTalentDismissal(fireBtn.dataset.talentFire);
      return;
    }
    const extendBtn = e.target.closest('[data-talent-extend]');
    if (extendBtn) {
      const id = extendBtn.dataset.talentExtend;
      if (!extendTalent(id)) return;
      // La carte est redessinée côté verso, puis se retourne sur son recto à jour.
      gameState.talentFlipped = id;
      refreshTalentsPanel();
      const card = document.querySelector(`.tl-card[data-talent-id="${CSS.escape(id)}"]`);
      requestAnimationFrame(() => requestAnimationFrame(() => card && setTalentCardFlipped(card, false)));
      return;
    }
    const talentCard = (e.target === ehSlider ? pressTarget : e.target)?.closest?.('.tl-card[data-talent-id]');
    if (talentCard) {
      // Un glissement du slider ne retourne pas la carte.
      if (Math.abs(dragDeltaX) > 6) return;
      const toBack = !talentCard.classList.contains('flipped');
      if (toBack) document.querySelectorAll('.tl-card.flipped').forEach(c => c !== talentCard && setTalentCardFlipped(c, false));
      setTalentCardFlipped(talentCard, toBack);
      return;
    }
    const arcomBtn = e.target.closest('.arcom-view-btn');
    if (arcomBtn) {
      gameState.step = 9;
      render();
      return;
    }
    const btn = e.target.closest('.ga-target-btn');
    if (!btn) return;
    gameState.audienceShareTarget = btn.dataset.audienceTarget;
    const panel = document.getElementById('ga-panel');
    if (panel) panel.outerHTML = renderGlobalAudienceShare();
  });
  ehSlider.addEventListener('keydown', e => {
    if (e.key === 'Escape' && e.target.closest('.tl-panel.scouting')) {
      if (closeTalentScouting()) refreshTalentsPanel();
      return;
    }
    const card = e.target.closest('.tl-card[data-talent-id]');
    if (!card) return;
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('tl-front')) {
      e.preventDefault();
      setTalentCardFlipped(card, true);
    } else if (e.key === 'Escape' && card.classList.contains('flipped')) {
      setTalentCardFlipped(card, false);
    }
  });
  ehSlider.addEventListener('pointermove', e => {
    if (!isDragging) return;
    dragDeltaX = e.clientX - dragStartX;
    const deltaPercent = (dragDeltaX / ehSlider.clientWidth) * 100;
    const base = -(gameState.hudSlide || 0) * 100;
    ehTrack.style.transform = `translateX(${base + deltaPercent}%)`;
  });
  const endDrag = () => {
    if (!isDragging) return;
    isDragging = false;
    ehTrack.style.transition = '';
    const threshold = ehSlider.clientWidth * 0.15;
    let target = gameState.hudSlide || 0;
    if (dragDeltaX > threshold) target -= 1;
    else if (dragDeltaX < -threshold) target += 1;
    goToHudSlide(target);
  };
  ehSlider.addEventListener('pointerup', endDrag);
  ehSlider.addEventListener('pointercancel', endDrag);
  ehSlider.addEventListener('pointerleave', endDrag);
}

function goToStepAnimated(mutate) {
  const app = document.getElementById('app');
  const isMobile = window.matchMedia('(max-width: 540px)').matches;
  if (!isMobile) { mutate(); render(); return; }

  const prevMasthead = app.querySelector('.masthead');
  const prevHudWrap = app.querySelector('.hud-wrap');
  const prevBodyNodesLive = Array.from(app.children).filter(el => el !== prevMasthead && el !== prevHudWrap);
  const oldHeight = prevBodyNodesLive.length
    ? prevBodyNodesLive[prevBodyNodesLive.length - 1].getBoundingClientRect().bottom - prevBodyNodesLive[0].getBoundingClientRect().top
    : 0;
  const prevBodyHTML = prevBodyNodesLive.map(el => el.outerHTML).join('');

  mutate();
  render();

  // Le header (bandeau + ligne mire) ET le HUD (tableau de bord) restent en
  // place, rendus instantanément par le render() ci-dessus ; seul le contenu
  // sous la mire (dilemme / conférence de rentrée) glisse.
  const newMasthead = app.querySelector('.masthead');
  const newHudWrap = app.querySelector('.hud-wrap');
  const newBodyNodes = Array.from(app.children).filter(el => el !== newMasthead && el !== newHudWrap);

  const newWrap = document.createElement('div');
  newWrap.className = 'step-slide-new';
  newBodyNodes.forEach(n => newWrap.appendChild(n));

  const oldWrap = document.createElement('div');
  oldWrap.className = 'step-slide-old';
  oldWrap.innerHTML = prevBodyHTML;

  const bodyContainer = document.createElement('div');
  bodyContainer.className = 'step-body-container';
  bodyContainer.style.height = oldHeight + 'px';
  bodyContainer.appendChild(oldWrap);
  bodyContainer.appendChild(newWrap);
  app.appendChild(bodyContainer);

  // Hauteur naturelle du nouvel écran, mesurée pendant qu'il est encore hors
  // champ (position absolute), pour animer le conteneur vers cette hauteur
  // en même temps que le glissement et éviter tout saut de mise en page.
  const newHeight = newWrap.offsetHeight;

  void oldWrap.offsetWidth;

  requestAnimationFrame(() => {
    bodyContainer.classList.add('resizing');
    bodyContainer.style.height = newHeight + 'px';
    oldWrap.classList.add('leaving');
    newWrap.classList.add('entering');
  });

  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    while (newWrap.firstChild) app.appendChild(newWrap.firstChild);
    bodyContainer.remove();
  };
  newWrap.addEventListener('transitionend', finish, { once: true });
  setTimeout(finish, 450);
}

        { icon: '🚀', label: 'Accélérateur régie', val: d.regie || 0, decimals: 1, suffix: d.regieRecurrente ? ' M€ / saison' : ' M€', invert: false },
        { icon: '⭐', label: 'Popularité', val: d.popularite, decimals: 0, suffix: ' pts', invert: false }
      ];
      // Seuls les indicateurs qui bougent réellement (valeur affichée non nulle) sont montrés.
      const changed = r => Number.isFinite(r.val) && Math.round(Math.abs(r.val) * 10 ** r.decimals) !== 0;
      const badgesHtml = rows.filter(changed).map(r => {
        const signal = r.invert ? -r.val : r.val;
        const cls = signal > 0.05 ? 'up' : signal < -0.05 ? 'down' : 'flat';
        return `<span class="impact-badge ${cls}"><span class="ic">${r.icon}</span>${r.label} ${fmtDelta(r.val, r.decimals, r.suffix)}</span>`;
      }).join('');

      zoneHtml = `
        <div class="slide-in-up consequence-wrap">
          <div class="dilemma-card consequence-card">
            <div class="dc-body">
              <p>${esc(cq.resultat)}</p>
              ${cq.competitorEvent ? `<div class="program-manager-note"><b>🚨 LA CONCURRENCE RÉAGIT</b><br>${esc(cq.competitorEvent.channel)} lance une ${esc(cq.competitorEvent.action)} sur le créneau ${esc(TIME_SLOTS.find(s=>s.key===cq.competitorEvent.slot)?.label || cq.competitorEvent.slot)}.</div>` : ''}

            <span class="welcome-cta-shine"></span>
            <span>Continuer</span>

    } else {
      zoneHtml = `
        <div class="choices">

            const accent = i % 2 === 0 ? 'accent' : 'neutral';

            const badgeCls = choice.finance.purchase || choice.finance.recurring > 0 ? 'cost' : 'save';

            return `
            <button class="choice" data-idx="${i}">
              <div class="choice-row">

              </div>
            </button>
          `; }).join('')}
        </div>
      `;

    app.innerHTML = `
      ${renderMasthead("Saison " + gameState.season, "Audience Masters")}
      ${renderTicker()}
      ${renderCampaignPanel()}
      <div class="dilemma-container${phase === 'choosing' ? ' slide-in' : ''}">
        <div class="dilemma-card dilemma-hero${phase === 'result' ? ' is-result' : ''}">
          <div class="dc-head">
            <span class="dc-live-pill"><span class="dc-live-dot"></span>Événement</span>
            <span class="dc-season-pill">Saison ${gameState.season}</span>
          </div>
          <div class="dc-body">
            <h2>${dilemma.titre}</h2>
            <p>${dilemma.desc}</p>
            ${dilemma.isCareerDilemma ? `
            <div class="career-stats-badges">
              <span class="pg-pda-badge pg-badge-gold">Notoriété ${dilemma.careerStats.awareness}/100</span>
              <span class="pg-pda-badge pg-badge-vert">Fidélité ${dilemma.careerStats.loyalty}/100</span>
              <span class="pg-pda-badge pg-badge-rouge">Usure ${dilemma.careerStats.wear}/100</span>

            <div class="grid-renewal-list">${dilemma.gridPrograms.map(g => `

                <span class="grid-renewal-name">${g.historic ? '⭐ ' : ''}${esc(g.name)}</span>

  if (gameState.step === 7) {
    const targetKey = gameState.player.target;
    const calculated = getCalculatedPDAs();
    const standings = calculated.map(item => {
      const pdaValue = item.pda[targetKey];
      const baseline = item.channel.pdaSeasonBaseline;

      return {
        name: item.channel === gameState.player ? item.name + " (Vous)" : item.name,

    const compliance = gameState.player.lastArcomResult || computeArcomCompliance();
    const careerPending = gameState.pendingCareerDecision;

    const careerDecisionHtml = careerContract ? `<div class="card bilan-card">
      <div class="kicker-badge">AVENIR D’UN PROGRAMME</div>

        <button class="choice" data-career-action="relaunch"><span class="cl">Relancer · ${nf1(careerContract.annual*GAME_BALANCE.programCareer.relaunchCostRate)} M€</span><span class="choice-caption">Nouvelle formule, potentiel accru mais fidélité à reconquérir.</span></button>
        <button class="choice" data-career-action="stop"><span class="cl">Arrêter</span><span class="choice-caption">Libérer la case${career.historic?' avec un risque d’image':''}.</span></button>
      </div>
    </div>` : '';

    app.innerHTML = `
      ${renderMasthead("Fin de saison", "Audience Masters")}
      <div class="card bilan-card">
        <div class="kicker-row bilan-kicker-row">
          <div class="kicker-badge">BILAN DE LA SAISON ${gameState.season}</div>
          <div class="arcom-status-pill arcom-status-${compliance.status.key}" title="ARCOM ${compliance.status.label} — ${compliance.arcomScore}/100">${compliance.status.emoji} ARCOM<span class="arcom-pill-label"> ${compliance.status.label} —</span> ${compliance.arcomScore}/100</div>

                dynHtml = `<span style="color: ${color}; font-weight: 700;">${arrow} ${st.delta > 0 ? '+' : ''}${st.delta.toFixed(1)} pt</span>`;
              }
              return `
              <tr style="${st.isPlayer ? 'font-weight: bold; background: rgba(37,99,235,0.08);' : ''}">
                <td>#${idx + 1}</td>

                <td>${dynHtml}</td>

        </table>

        <h3>DERNIÈRES DÉCISIONS</h3>
        <ul style="margin: 6px 0 12px 18px; font-size: 13px;">

      </div>
      <button class="welcome-cta" id="btn-next-season" style="margin-top: 2px;" ${careerContract?'disabled title="Décidez d’abord de l’avenir du programme"':''}>
        <span class="welcome-cta-shine"></span>
        <span>${careerContract ? 'Choisissez l’avenir du programme ci-dessus' : gameState.renewalDue ? 'Voir le renouvellement de convention' : `Lancer la Saison ${gameState.season + 1}`}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    `;

    document.getElementById('btn-next-season').onclick = () => {
      if (gameState.renewalDue) {
        gameState.step = 10;
        render();
      } else {
        startNewSeason();
      }

    app.querySelectorAll('[data-career-action]').forEach(button => {
      button.onclick = () => applyCareerDecision(button.dataset.careerAction);
    });
    app.querySelector('.masthead').onclick = goHome;
    return;
  }

  if (gameState.step === 8) {
    const isArcom = gameState.gameOverReason === 'arcom';
    const p = gameState.player;
    const arcomScore = p.lastArcomResult?.arcomScore ?? computeArcomCompliance().arcomScore;
    const pdaCibleFinale = getCalculatedPDAs().find(item => item.channel === p).pda[p.target];
    const targetShort = TARGET_STRATEGIES[p.target].nom.replace(/\s*\([^)]*\)/, '');
    const stats = isArcom
      ? [
          { value: `${arcomScore}/100`, label: 'Score ARCOM', alert: true },
          { value: `S${gameState.season}`, label: 'Saison atteinte' },
          { value: `${Math.round(p.popularite)}/100`, label: 'Popularité finale' },
          { value: `${nf1(p.tresorerie)} M€`, label: 'Trésorerie', alert: p.tresorerie < 0 }
        ]
      : [
          { value: `${nf1(p.tresorerie)} M€`, label: 'Trésorerie', alert: true },
          { value: `${nf1(pdaCibleFinale)} %`, label: `PDA ${targetShort}` },
          { value: `S${gameState.season}`, label: 'Saison atteinte' },
          { value: `${Math.round(p.popularite)}/100`, label: 'Popularité finale' }
        ];
    app.innerHTML = `
      ${renderMasthead("Fin de partie", "Audience Masters")}
      <div class="card bilan-card sanction-card">
        <div class="kicker-row sanction-kicker-row">
          <span class="dc-live-pill sanction-pill"><span class="dc-live-dot"></span>${isArcom ? 'Autorisation retirée' : 'Mise sous tutelle'}</span>
          <span class="dc-season-pill">Saison ${gameState.season}</span>
        </div>
        <h2>${esc(p.name)} ${isArcom ? "perd son autorisation d'émettre" : 'dépose le bilan'}</h2>
        <p class="sanction-lead">${isArcom
          ? "L'ARCOM a refusé le renouvellement de votre convention : les manquements répétés à vos obligations éditoriales ont eu raison de votre autorisation d'émettre."
          : `La trésorerie de la chaîne est tombée à ${nf1(p.tresorerie)} M€, sous le seuil critique de ${nf1(TRESORERIE_CRITIQUE)} M€.`}</p>
        <div class="sanction-stats">
          ${stats.map(st => `<div class="sanction-stat${st.alert ? ' alert' : ''}">
            <div class="sanction-stat-value">${st.value}</div>
            <div class="sanction-stat-label">${st.label}</div>
          </div>`).join('')}
        </div>
        <div class="sanction-note">
          <span class="sanction-note-title">⚖️ Décision de l'ARCOM</span>
          <span>${isArcom
            ? "Fréquence retirée : la chaîne cesse d'émettre à l'issue de la saison."
            : "La chaîne est placée sous administration provisoire : la direction est suspendue et la grille gelée."}</span>
        </div>
      </div>
      <button class="welcome-cta" id="btn-restart">
        <span class="welcome-cta-shine"></span>
        <span>Recommencer une chaîne</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    `;
    document.getElementById('btn-restart').onclick = () => {
      resetGame();
    };
    return;
  }

  if (gameState.step === 9) {
    const player = gameState.player;
    const compliance = player.lastArcomResult || computeArcomCompliance();
    const convention = ARCOM_CONVENTIONS[player.type];
    const nextEcheance = (Math.floor(gameState.season / CONVENTION_DURATION) + 1) * CONVENTION_DURATION;
    const renewal = computeRenewalScore();
    const renewalOutcome = getRenewalOutcome(renewal.renewalScore);

    // Présentation dans les codes du jeu (cartes bilan, jauge et tuiles de la convention).
    const statusKey = compliance.status.key;
    const tone = statusKey === 'excellent' || statusKey === 'conforme' ? 'renewed' : statusKey === 'vigilance' ? 'watch' : 'refused';
    const score = Math.max(0, Math.min(100, compliance.arcomScore));
    const met = compliance.obligations.filter(ob => ob.rate >= 1).length;
    const levelOf = ob => ob.rate >= 1 ? 'ok' : ob.rate >= 0.75 ? 'warn' : 'bad';
    const unitOf = ob => ob.unit === '%' ? '%' : ' ' + ob.unit;
    const renewalTone = renewalOutcome.key === 'refused' ? 'alert' : '';
    const renewalLabel = { renewed: 'Favorable', conditional: 'Sous conditions', watch: 'Sous surveillance', refused: 'Refus' }[renewalOutcome.key];
    const stats = [
      { value: `${met}/${compliance.obligations.length}`, label: 'Obligations tenues', alert: met < compliance.obligations.length },
      { value: `${player.arcomSanctionsCount}`, label: 'Sanctions cumulées', alert: player.arcomSanctionsCount > 0 },
      { value: `Saison ${nextEcheance}`, label: 'Prochaine échéance' },
      { value: renewalLabel, label: 'Renouvellement', alert: !!renewalTone }
    ];

    app.innerHTML = `
      ${renderMasthead("Détails de votre convention", "Audience Masters")}
      <div class="card bilan-card renewal-card renewal-${tone} arcom-card">
        <div class="kicker-row renewal-kicker-row">
          <span class="kicker-badge">⚖️ Convention ARCOM</span>
          <span class="dc-season-pill">Saison ${gameState.season}</span>
        </div>
        <h2>${esc(convention.label)}</h2>
        <p class="renewal-lead">Les engagements éditoriaux de votre chaîne et leur niveau de respect sur la saison en cours.</p>
        <div class="renewal-score">
          <div class="renewal-score-head">
            <span class="renewal-score-value">${score}<span>/100</span></span>
            <span class="renewal-score-pill renewal-pill-${tone}">${compliance.status.emoji} ${esc(compliance.status.label)}</span>
          </div>
          <div class="renewal-gauge" role="img" aria-label="Score ARCOM : ${score} sur 100">
            <div class="renewal-gauge-fill" style="width:${score}%"></div>
            <span class="renewal-gauge-mark" style="left:60%" title="Vigilance : 60"></span>
            <span class="renewal-gauge-mark" style="left:75%" title="Conforme : 75"></span>
          </div>
          <div class="arcom-gauge-legend"><span style="left:0">0</span><span style="left:60%">60</span><span style="left:75%">75</span><span style="right:0">100</span></div>
        </div>
        <div class="renewal-stats arcom-stats">
          ${stats.map(st => `<div class="renewal-stat${st.alert ? ' alert' : ''}">
            <div class="renewal-stat-value">${st.value}</div>
            <div class="renewal-stat-label">${st.label}</div>
          </div>`).join('')}
        </div>
      </div>

                <span class="arcom-mini-dot ${levelOf(ob)}"></span>
                <span class="arcom-oblig-name">${esc(ob.label)}</span>

        <span>Retour au jeu</span>
      </button>
    `;
    document.getElementById('btn-arcom-back').onclick = () => {
      gameState.step = 6;
      render();
    };
    app.querySelector('.masthead').onclick = () => { gameState.step = 1; render(); };
    return;
  }

  if (gameState.step === 10) {
    const player = gameState.player;
    const renewal = computeRenewalScore();
    const outcome = getRenewalOutcome(renewal.renewalScore);
    const calculated = getCalculatedPDAs();
    const playerCalc = calculated.find(c => c.channel === player);
    const pdaMoyenne = playerCalc.globalPda;
    const gravesRecents = player.arcomViolations.filter(v => v.severity === 'grave' && v.season > gameState.season - CONVENTION_DURATION).length;

    const tone = outcome.key === 'refused' ? 'refused' : outcome.key === 'renewed' ? 'renewed' : 'watch';
    const score = Math.max(0, Math.min(100, renewal.renewalScore));
    const stats = [
      { value: `${nf1(pdaMoyenne)} %`, label: 'PDA moyenne' },
      { value: `${nf1(player.revenusPubCumul)} M€`, label: 'Revenus cumulés' },
      { value: `${nf1(renewal.complianceAverage)}/100`, label: 'Score ARCOM moyen', alert: renewal.complianceAverage < 60 },
      { value: `${gravesRecents}`, label: 'Manquements graves', alert: gravesRecents > 0 },
      { value: `${player.arcomSanctionsCount}`, label: 'Sanctions cumulées', alert: player.arcomSanctionsCount > 0 }
    ];

    app.innerHTML = `
      ${renderMasthead("Renouvellement de convention", "Audience Masters")}
      <div class="card bilan-card renewal-card renewal-${tone}">
        <div class="kicker-row renewal-kicker-row">
          <span class="kicker-badge">⚖️ Renouvellement<span class="renewal-xs-hide">&nbsp;de convention</span></span>
          <span class="dc-season-pill">Saison ${gameState.season}</span>
        </div>
        <h2>${esc(outcome.title)}</h2>
        <p class="renewal-lead">${esc(outcome.message)}</p>
        <div class="renewal-score">

            <span class="renewal-score-value">${score}<span>/100</span></span>
            <span class="renewal-score-pill renewal-pill-${tone}">${outcome.emoji} Score de renouvellement</span>
          </div>
          <div class="renewal-gauge" role="img" aria-label="Score de renouvellement : ${score} sur 100">
            <div class="renewal-gauge-fill" style="width:${score}%"></div>
            <span class="renewal-gauge-mark" style="left:50%" title="Seuil de refus : 50"></span>
            <span class="renewal-gauge-mark" style="left:80%" title="Renouvellement plein : 80"></span>

        <div class="renewal-stats">
          ${stats.map(st => `<div class="renewal-stat${st.alert ? ' alert' : ''}">

      </button>

    document.getElementById('btn-renewal-continue').onclick = () => {
      if (outcome.key === 'refused') {

const PROGRAM_CATALOG = PROGRAM_CATALOG_DATA.map(([id,channelType,slot,format,name,target,annual,rights,years,power]) => ({
  id, channelType, slot, format, name, target, annual, rights, years, power,
  preferredSlot:slot, editorial:programEditorialProfile({name,channelType,slot,format})
}));

function activeContract(channel, slot) {
  const contract = channel.contracts?.[slot];
  return contract && contract.end >= gameState.season ? contract : null;
}

function createProgramCareer(program, slot) {
  const basePotential = Number(program.power || 0);
  return { seasonsCount: 0, awareness: 18, loyalty: 12, wear: 0,
    basePotential, potential: basePotential, longevity: null, status: 'lancement',
    historic: false, lastDecision: 'lancement', history: [], slot };
}

function programLifeStage(career) {
  if (career.historic) return 'franchise historique';
  if (career.seasonsCount <= 1) return 'lancement';
  if (career.seasonsCount <= 3) return 'croissance';
  if (career.wear < 55) return 'maturité';
  return 'usure';
}

function migrateProgramCareer(contract, slot) {
  contract.career ??= createProgramCareer(contract, slot);
  const c = contract.career;
  c.seasonsCount ??= 0; c.awareness ??= 18; c.loyalty ??= 12; c.wear ??= 0;
  c.basePotential ??= Number(contract.power || 0); c.potential ??= c.basePotential;
  c.history ??= []; c.slot ??= slot; c.historic ??= false; c.status = programLifeStage(c);
  return c;
}

function evolveProgramCareers() {
  const p = gameState.player;
  const calc = getCalculatedPDAs().find(row => row.channel === p);
  for (const [slot, contract] of Object.entries(p.contracts || {})) {
    const career = migrateProgramCareer(contract, slot);
    const performance = calc.slots[slot][p.target];
    const expected = calc.expectedSlots[slot][p.target];
    const success = Math.max(-4, Math.min(4, performance - expected));
    const genre = contract.editorial?.genre || 'diverti';
    const longevity = GAME_BALANCE.programCareer.longevityByGenre[genre] || 1;
    career.seasonsCount++;
    career.awareness = Math.max(0, Math.min(100, career.awareness + GAME_BALANCE.programCareer.awarenessGrowth + success * 1.2));
    career.loyalty = Math.max(0, Math.min(100, career.loyalty + GAME_BALANCE.programCareer.loyaltyGrowth + success));
    career.wear = Math.max(0, Math.min(100, career.wear + GAME_BALANCE.programCareer.wearGrowth / longevity + Math.max(0, career.seasonsCount - 4) * 1.5));
    career.potential = Math.max(0, career.basePotential + Math.min(0.8, career.seasonsCount * 0.15) - Math.max(0, career.wear - 35) * 0.012);
    career.historic = career.seasonsCount >= GAME_BALANCE.programCareer.cultSeasons
      && career.awareness >= GAME_BALANCE.programCareer.cultAwareness
      && career.loyalty >= GAME_BALANCE.programCareer.cultLoyalty;
    career.status = programLifeStage(career);
    career.history.push({ season: gameState.season, performance, expected, awareness: career.awareness,
      loyalty: career.loyalty, wear: career.wear, potential: career.potential });
    if (career.historic && !career.historicRewarded) {
      p.popularite = Math.min(100, p.popularite + 2);
      career.historicRewarded = true;
    }
  }
}

function selectCareerDecisions() {
  const candidates = Object.entries(gameState.player.contracts || {}).map(([slot, contract]) => {
    const c = migrateProgramCareer(contract, slot);
    const urgency = (contract.end <= gameState.season ? 40 : 0) + c.wear + (c.historic ? 20 : 0) + c.seasonsCount * 3;
    return { slot, contract, urgency };
  }).filter(item => !item.contract.stopped
    && (item.contract.end <= gameState.season || item.contract.career.wear >= 40 || item.contract.career.historic));
  candidates.sort((a,b) => b.urgency - a.urgency);
  return candidates.map(item => ({ slot: item.slot, programId: item.contract.id }));
}

function createCareerRenewalDilemma(pending) {
  if (!pending) return null;
  const p = gameState.player;
  const contract = pending && p.contracts?.[pending.slot];
  if (!contract || contract.id !== pending.programId) return null;
  const c = migrateProgramCareer(contract, pending.slot);
  const slotMeta = TIME_SLOTS.find(s=>s.key===pending.slot);
  const slotDaypart = slotMeta?.daypart || pending.slot;
  const zeroPda = { j1524:0, a2549:0, s50:0, csp:0 };
  // Un programme devenu culte ouvre, une seule fois, l'arbitrage de franchise.
  if (c.historic && !c.franchiseOffered) {
    const spinSlot = franchiseSpinoffSlot(pending.slot);
    if (spinSlot) return createFranchiseDilemma(contract, c, pending.slot, spinSlot);
  }
  return {
    id:`career-${gameState.season}-${pending.slot}-${contract.id}`,
    titre:`Quel avenir pour « ${contract.name} » ?`,
    desc:`Dernier arbitrage de la saison : le programme du créneau ${slotDaypart} est en phase de ${c.status} après ${c.seasonsCount} saison(s).`,
    isCareerDilemma:true, careerSlot:pending.slot, programId:contract.id,
    careerStats:{ awareness:Math.round(c.awareness), loyalty:Math.round(c.loyalty), wear:Math.round(c.wear) },
    c:[
      { l:'Renouveler à l’identique', careerAction:'renew', pda:{...zeroPda}, audienceImpact:{slot:pending.slot,value:0}, pop:0,

function applyCareerDilemmaChoice(dilemma, choice) {
  const p = gameState.player;
  const contract = p.contracts?.[dilemma.careerSlot];
  if (!contract || contract.id !== dilemma.programId) return false;
  const c = migrateProgramCareer(contract, dilemma.careerSlot);
  const action = choice.careerAction;
  if (action === 'stop') {
    // Arrêt en fin de saison : le programme termine la saison à l'antenne (son audience
    // et les recettes publicitaires associées restent acquises). Son coût annuel est déjà
    // retiré du coût de grille, ce qui allège la grille de la saison suivante ; il quitte
    // la grille à l'ouverture de celle-ci (expireContracts), sans être facturé à nouveau.
    contract.annual = 0;
    contract.talentAnnual = 0;
    contract.end = Math.min(contract.end, gameState.season);
    contract.stopped = true;
  } else {
    contract.end = Math.max(contract.end, gameState.season) + 1;
    if (action === 'renew') c.wear = Math.min(100, c.wear + 4);
    if (action === 'modify') { c.wear = Math.max(0, c.wear - 16); c.potential += 0.25; c.loyalty = Math.max(0, c.loyalty - 3); }
    if (action === 'relaunch') { c.wear = Math.max(0, c.wear - 38); c.potential += 0.65; c.loyalty = Math.max(0, c.loyalty - 10); c.awareness = Math.max(0, c.awareness - 4); }
    if (action === 'consolidate') { c.wear = Math.max(0, c.wear - 10); c.potential += 0.35; c.loyalty = Math.min(100, c.loyalty + 4); c.franchiseOffered = true; }
    if (action === 'franchise') {
      c.franchiseOffered = true;
      const spin = choice.spinoff;
      if (spin && !activeContract(p, spin.slot)) {
        const power = c.basePotential * GAME_BALANCE.franchise.spinoffPowerRate;
        const career = createProgramCareer({ power }, spin.slot);
        career.awareness = Math.round(c.awareness * 0.5); career.loyalty = Math.round(c.loyalty * 0.4);
        p.contracts[spin.slot] = { id: `spinoff-${contract.id}`, name: spin.name, annual: spin.annual,
          talent: 'Équipe de la franchise', talentAnnual: 0, power, target: contract.target, format: contract.format,
          end: gameState.season + 2, source: 'franchise', parentId: contract.id, slot: spin.slot,
          editorial: contract.editorial ? { ...contract.editorial, mix: { ...contract.editorial.mix } }
            : programEditorialProfile({ name: spin.name, channelType: p.type, slot: spin.slot }),
          career };
        p.grilleOverrides[spin.slot] = spin.name;
      }
    }
    c.lastDecision = action;
  }
  return true;
}
