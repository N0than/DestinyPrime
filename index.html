<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUDIENCE MASTERS V2 — Devenez le Roi de l'Audimat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #16130e;
  --paper: #efeade;
  --paper-dark: #e4ddcc;
  --rouge: #c8102e;
  --bleu: #1f3a93;
  --gris: #8a8378;
  --vert: #2e6b3a;
  --gold: #d4af37;
  --danger: #c8102e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  background-image: repeating-linear-gradient(0deg, rgba(22, 19, 14, 0.025) 0 1px, transparent 1px 3px);
  color: var(--ink);
  font-family: 'Spectral', Georgia, serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

#app {
  max-width: 680px;
  margin: 0 auto;
  padding: 12px 14px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1, h2, h3, .display {
  font-family: 'Anton', Impact, sans-serif;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  line-height: 1.05;
}

button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }

/* ---- MASTHEAD ---- */
.masthead { text-align: center; padding: 10px 0 8px; margin-bottom: 14px; cursor: pointer; transition: opacity 0.15s; }
.masthead:hover { opacity: 0.75; }
.masthead .over { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gris); }
.header-brand { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
.header-brand .dot {
  flex-shrink: 0;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 8px var(--danger);
  animation: blink 2.2s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
.masthead h1 { font-size: clamp(32px, 8vw, 50px); }
.masthead .under { font-style: italic; font-size: 13px; margin-top: 2px; color: #4a443b; margin-bottom: 10px; }

/* ---- HUD (5 INDICATEURS) ---- */
.hud-wrap { margin: 0 0 16px; }
.hud {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  border-top: 2px solid var(--ink);
  padding: 0; background: rgba(255,255,255,0.4);
  align-items: stretch;
}
.hud-cell { position: relative; text-align: center; min-width: 0; padding: 8px 3px; }
.hud-cell .lab {
  font-family: 'Anton', sans-serif; font-size: 8.5px; letter-spacing: 0.5px; text-transform: uppercase;
  color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; justify-content: center; gap: 3px;
}
.hud-cell .ic { font-size: 10px; }
.hud-cell .val {
  font-family: 'Anton', sans-serif; font-size: 15px; white-space: nowrap;
  font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.hud-cell.alert .val { color: var(--rouge); }
.hud-cell.alert { animation: alertPulse 1.4s ease-in-out infinite; }
@keyframes alertPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

.hud-toggle {
  display: flex; align-items: flex-start; gap: 4px;
  width: 100%; box-sizing: border-box; padding: 0; margin: 0; border: none;
  background: transparent; cursor: pointer;
}
.hud-toggle-line { flex: 1; height: 2px; background: var(--ink); }
.hud-toggle-chevron {
  position: relative; flex-shrink: 0; width: 12px; height: 12px;
  opacity: 0.4;
  transition: opacity 0.15s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.hud-toggle-chevron::before,
.hud-toggle-chevron::after {
  content: ''; position: absolute; left: 50%; top: 1px; width: 6px; height: 6px;
  border-right: 1.3px solid var(--ink); border-bottom: 1.3px solid var(--ink);
  transform: translateX(-50%) rotate(45deg);
}
.hud-toggle-chevron::after { top: 5px; }
.hud-toggle:hover .hud-toggle-chevron { opacity: 1; }
.hud-toggle.open .hud-toggle-chevron { transform: rotate(180deg); }

.hud-details {
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
}
.hud-details.open { max-height: 800px; opacity: 1; }
.hud-details-inner {
  background: #f7f3e8; border: 1.5px solid var(--ink); box-shadow: 4px 4px 0 rgba(22,19,14,0.85);
  padding: 12px 14px; margin-top: 8px;
}
.eh-title {
  font-family: 'Anton', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--ink); margin: 0 0 2px;
}
.eh-subtitle { font-size: 11px; font-style: italic; color: var(--gris); margin: 0 0 10px; }
.eh-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
.eh-legend-item {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Anton', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
}
.eh-legend-item i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.eh-bar-svg { display: block; width: 100%; height: 178px; }
.spark-empty { font-size: 12px; color: var(--gris); font-style: italic; margin-top: 3px; }

.eh-slider { overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; }
.eh-slider:active { cursor: grabbing; }
.eh-slider-track { display: flex; transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1); }
.eh-slide { flex: 0 0 100%; min-width: 0; }
.eh-slider-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; }
.eh-slider-dots { display: flex; gap: 6px; }
.eh-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(22,19,14,0.22); border: none; padding: 0; cursor: pointer; }
.eh-dot.active { background: var(--ink); }

.pg-header, .pg-row {
  display: grid; grid-template-columns: 72px 1fr 42px 46px; gap: 6px; align-items: center;
}
.pg-header {
  font-family: 'Anton', sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--gris); padding-bottom: 4px; border-bottom: 1px solid rgba(22,19,14,0.15); margin-bottom: 2px;
}
.pg-row { padding: 6px 0; border-bottom: 1px dashed rgba(22,19,14,0.12); font-size: 12px; }
.pg-row:last-child { border-bottom: none; }
.pg-slot {
  display: flex; align-items: center; gap: 4px;
  font-family: 'Anton', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
}
.pg-program-cell { display: flex; align-items: center; gap: 5px; }
.pg-program {
  flex: 1 1 auto; min-width: 0; box-sizing: border-box;
  font-style: normal; font-family: 'Spectral', serif; font-size: 10.5px;
  line-height: 1.2; color: var(--ink); background: var(--paper);
  border: 1px solid rgba(22,19,14,0.3); border-left: 3px solid var(--rouge); border-radius: 3px;
  padding: 3px 7px;
}
.pg-pda { text-align: right; font-family: 'Anton', sans-serif; font-size: 13px; color: var(--rouge); }
.pg-header .pg-pda { font-size: 9px; color: var(--gris); }
.pg-row.pg-leader { background: rgba(212,175,55,0.12); }
.pg-row.pg-leader .pg-pda { color: var(--gold); }
.pg-crown { font-size: 11px; width: 14px; flex-shrink: 0; text-align: center; }
.pg-crown-hidden { visibility: hidden; }
.pg-rank-col { text-align: center; font-family: 'Anton', sans-serif; font-size: 11px; color: var(--gris); }
.pg-header .pg-rank-col { font-size: 9px; color: var(--gris); }
.pg-rank-col.pg-rank-leader { color: var(--gold); }

.ga-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ga-header .eh-title { margin-bottom: 0; flex-shrink: 0; }
.ga-target-switcher {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
  max-width: 60%;
}
.ga-target-switcher::-webkit-scrollbar { display: none; }
.ga-target-btn {
  flex-shrink: 0; background: transparent; border: 1px solid rgba(22,19,14,0.3); color: var(--gris);
  font-family: 'Anton', sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3px;
  padding: 4px 7px; border-radius: 3px; cursor: pointer; white-space: nowrap;
  transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
}
.ga-target-btn:hover { border-color: var(--ink); color: var(--ink); }
.ga-target-btn.active { background: var(--rouge); border-color: var(--rouge); color: #fff; }
.ga-headline { margin: 8px 0 10px; }
.ga-headline-value { font-family: 'Anton', sans-serif; font-size: 26px; color: var(--ink); line-height: 1; }
.ga-headline-label { font-size: 11px; color: var(--gris); font-style: italic; margin-top: 2px; }

.ga-row { display: flex; align-items: center; gap: 6px; padding: 3.5px 0; border-bottom: 1px dashed rgba(22,19,14,0.12); }
.ga-row:last-child { border-bottom: none; }
.ga-rank { font-family: 'Anton', sans-serif; font-size: 10px; color: var(--gris); width: 16px; flex-shrink: 0; }
.ga-info { flex: 1; min-width: 0; }
.ga-name {
  font-family: 'Anton', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
  margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ga-bar-track { height: 4px; background: rgba(22,19,14,0.08); border-radius: 2px; overflow: hidden; }
.ga-bar-fill { height: 100%; background: var(--gris); border-radius: 2px; }
.ga-pct { font-family: 'Anton', sans-serif; font-size: 11px; width: 38px; text-align: right; flex-shrink: 0; }
.ga-row.ga-player .ga-name { color: var(--rouge); }
.ga-row.ga-player .ga-bar-fill { background: var(--rouge); }
.ga-row.ga-player .ga-pct { color: var(--rouge); }

.stat-list { display: flex; flex-direction: column; }
.stat-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed rgba(22,19,14,0.12); }
.stat-row:last-child { border-bottom: none; }
.stat-row-label {
  display: flex; align-items: center; gap: 5px; flex: 0 0 100px; min-width: 0;
  font-family: 'Anton', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; color: var(--ink);
}
.stat-row-stars { flex: 1; font-size: 16px; letter-spacing: 1.5px; }
.stat-row-stars .star-filled { color: var(--gold); }
.stat-row-stars .star-empty { color: rgba(22,19,14,0.2); }
.stat-row-value { font-family: 'Anton', sans-serif; font-size: 10.5px; flex-shrink: 0; width: 56px; text-align: right; color: var(--gris); }
.stat-row-value.good { color: var(--vert); }
.stat-row-value.warn { color: #8a6d1a; }
.stat-row-value.bad { color: var(--rouge); }

/* ---- CONVENTION ARCOM ---- */
.arcom-score-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0 12px; flex-wrap: wrap; }
.arcom-score-value { font-family: 'Anton', sans-serif; font-size: 28px; color: var(--ink); line-height: 1; }
.arcom-status-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Anton', sans-serif; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px;
  padding: 5px 10px; border-radius: 3px; border: 1.5px solid var(--ink);
}
.arcom-status-excellent, .arcom-status-conforme { background: rgba(46,107,58,0.12); color: var(--vert); border-color: var(--vert); }
.arcom-status-vigilance { background: rgba(212,175,55,0.16); color: #8a6d1a; border-color: var(--gold); }
.arcom-status-manquements, .arcom-status-nonconforme { background: rgba(200,16,46,0.1); color: var(--rouge); border-color: var(--rouge); }
.arcom-obligations-mini { margin-top: 4px; }
.arcom-mini-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px; border-bottom: 1px dashed rgba(22,19,14,0.1); }
.arcom-mini-row:last-child { border-bottom: none; }
.arcom-mini-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.arcom-mini-dot.ok { background: var(--vert); }
.arcom-mini-dot.warn { background: var(--gold); }
.arcom-mini-dot.bad { background: var(--rouge); }
.arcom-mini-label { flex: 1; min-width: 0; font-family: 'Spectral', serif; }
.arcom-mini-value { font-family: 'Anton', sans-serif; font-size: 10.5px; color: var(--gris); white-space: nowrap; }
.arcom-obligations-list { display: flex; flex-direction: column; gap: 9px; margin-top: 8px; }
.arcom-oblig-row { display: flex; align-items: center; gap: 8px; }
.arcom-oblig-info { flex: 1; min-width: 0; }
.arcom-oblig-label { font-size: 12.5px; margin-bottom: 3px; }
.arcom-oblig-bar-track { height: 5px; background: rgba(22,19,14,0.08); border-radius: 3px; overflow: hidden; }
.arcom-oblig-bar-fill { height: 100%; border-radius: 3px; }
.arcom-oblig-bar-fill.ok { background: var(--vert); }
.arcom-oblig-bar-fill.warn { background: var(--gold); }
.arcom-oblig-bar-fill.bad { background: var(--rouge); }
.arcom-oblig-value { font-family: 'Anton', sans-serif; font-size: 10.5px; color: var(--gris); white-space: nowrap; flex-shrink: 0; }
.arcom-violations-list { margin: 6px 0 0 0; padding-left: 18px; font-size: 13px; }
.arcom-violations-list li { margin-bottom: 4px; }
.arcom-severity-leger { color: #8a6d1a; font-weight: bold; }
.arcom-severity-significatif { color: #c07a1f; font-weight: bold; }
.arcom-severity-grave { color: var(--rouge); font-weight: bold; }
.arcom-hist-chart { display: flex; align-items: flex-end; gap: 8px; height: 130px; margin-top: 12px; padding-top: 18px; }
.arcom-hist-bar-wrap { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.arcom-hist-bar { width: 100%; max-width: 30px; border-radius: 3px 3px 0 0; position: relative; }
.arcom-hist-val { font-family: 'Anton', sans-serif; font-size: 9px; color: var(--ink); position: absolute; top: -14px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.arcom-hist-season { font-size: 9px; font-style: italic; color: var(--gris); margin-top: 4px; }
.arcom-hist-excellent, .arcom-hist-conforme { background: var(--vert); }
.arcom-hist-vigilance { background: var(--gold); }
.arcom-hist-manquements, .arcom-hist-nonconforme { background: var(--rouge); }
.arcom-view-btn {
  display: block; width: 100%; box-sizing: border-box; text-align: center; margin-top: 10px;
  background: transparent; border: 1.5px solid var(--ink); color: var(--ink);
  font-family: 'Anton', sans-serif; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 8px; border-radius: 3px; cursor: pointer;
}
.arcom-view-btn:hover { background: var(--ink); color: var(--paper); }
.bilan-title-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 4px;
}
.bilan-title-row h2 { margin: 0; }

/* ---- BILAN ÉCONOMIQUE DE SAISON ---- */
.eco-pos { color: var(--vert); }
.eco-neg { color: var(--rouge); }
.eco-hero {
  text-align: center; padding: 14px 0 18px; margin-bottom: 4px;
  border-bottom: 1px dashed rgba(22,19,14,0.15);
}
.eco-hero-value { font-family: 'Anton', sans-serif; font-size: 42px; line-height: 1; }
.eco-hero-label {
  font-size: 11px; font-style: italic; color: var(--gris); margin-top: 4px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.eco-flow { display: flex; flex-direction: column; gap: 14px; margin: 18px 0; }
.eco-flow-row { display: flex; align-items: center; gap: 10px; }
.eco-flow-label {
  flex: 0 0 96px; display: flex; align-items: center; gap: 5px;
  font-family: 'Anton', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
  color: var(--ink);
}
.eco-flow-bar-track { flex: 1; display: flex; height: 10px; background: rgba(22,19,14,0.08); border-radius: 5px; overflow: hidden; }
.eco-flow-bar-fill { height: 100%; transition: width 0.3s ease; }
.eco-flow-bar-fill.eco-flow-programmes { background: var(--rouge); }
.eco-flow-bar-fill.eco-flow-talents { background: var(--bleu); }
.eco-flow-bar-fill.eco-flow-revenu { background: var(--vert); }
.eco-flow-value {
  flex: 0 0 74px; text-align: right;
  font-family: 'Anton', sans-serif; font-size: 13px;
}
.eco-bilan-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 12px;
  margin-top: 18px; padding-top: 16px; border-top: 1px dashed rgba(22,19,14,0.15);
}
.eco-bilan-item { display: flex; flex-direction: column; gap: 3px; text-align: center; }
.eco-bilan-label {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  font-family: 'Anton', sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3px;
  color: var(--gris);
}
.eco-bilan-value { font-family: 'Anton', sans-serif; font-size: 15px; color: var(--ink); }

/* ---- ÉCRAN DE CONSÉQUENCES ---- */
.impact-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.impact-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: 'Anton', sans-serif; font-size: 11px; letter-spacing: 0.2px; white-space: nowrap;
  padding: 3px 8px; border-radius: 3px; background: var(--paper); border: 1px solid var(--ink);
}
.impact-badge.up { color: var(--vert); border-color: var(--vert); }
.impact-badge.down { color: var(--rouge); border-color: var(--rouge); }
.impact-badge.flat { color: var(--gris); border-color: var(--gris); }

@media (max-width: 520px) {
  .hud { gap: 3px; }
  .hud-cell { padding: 6px 1px; }
  .hud-cell .lab { font-size: 7.5px; gap: 2px; }
  .hud-cell .val { font-size: 20px; }
}

/* ---- ONBOARDING & CARDS ---- */
.kicker { font-family: 'Anton', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--rouge); margin-bottom: 6px; }
.kicker-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.kicker-row .kicker { margin-bottom: 0; }
.btn-dice {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer; overflow: hidden; white-space: nowrap; margin-bottom: 6px;
  background: var(--ink); color: var(--paper);
  font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px;
  padding: 7px 12px;
  border: 2px solid var(--paper); outline: 2px solid var(--ink);
  box-shadow: 3px 3px 0 var(--rouge);
  transition: transform 0.1s ease-out, box-shadow 0.1s ease-out, background 0.1s, color 0.1s, border-color 0.1s;
}
.btn-dice::before {
  content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  opacity: 0;
}
.btn-dice:hover::before { opacity: 1; animation: btnDiceShine 1.3s infinite; }
@keyframes btnDiceShine { 0% { left: -100%; } 100% { left: 100%; } }
.btn-dice .dice-icon { display: inline-block; position: relative; z-index: 1; transition: transform 0.15s ease-out; }
.btn-dice .dice-label { position: relative; z-index: 1; }
.btn-dice:hover { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--ink); }
.btn-dice:hover .dice-icon { transform: rotate(-14deg) scale(1.15); }
.btn-dice:active {
  transform: translate(3px, 3px); box-shadow: 0 0 0 var(--rouge);
  background: var(--paper); color: var(--ink); border-color: var(--ink);
}
.btn-dice:active .dice-icon { transform: rotate(14deg) scale(0.9); }
.card {
  background: #f7f3e8; border: 1.5px solid var(--ink);
  box-shadow: 4px 4px 0 rgba(22,19,14,0.85);
  padding: 16px; margin-bottom: 16px; position: relative;
}
.tape { position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-1.5deg); width: 80px; height: 20px; background: rgba(31,58,147,0.18); border: 1px dashed rgba(31,58,147,0.4); }

.optgrid { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 12px 0 20px; }
@media(min-width: 520px) { .optgrid { grid-template-columns: 1fr 1fr; } }

.opt {
  text-align: left; background: #f7f3e8; border: 1.5px solid var(--ink); padding: 12px;
  font-family: 'Spectral', serif; font-size: 14px; box-shadow: 3px 3px 0 var(--ink);
  transition: transform 0.1s, background 0.1s;
}
.opt:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.opt .ol { font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: 16px; display: block; margin-bottom: 2px; color: var(--rouge); }
.opt .od { font-style: italic; color: #5c564a; font-size: 13px; display: block; }
.opt.sel { background: var(--ink); color: var(--paper); }
.opt.sel .ol { color: #ffffff; }
.opt.sel .od { color: #cfc8b6; }

input[type=text] {
  width: 100%; font-family: 'Anton', sans-serif; font-size: 20px; text-transform: uppercase;
  padding: 10px; border: 2px solid var(--ink); background: #fff; letter-spacing: 1px;
}
label { font-family: 'Anton', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; display: block; margin: 14px 0 6px; }

.namebar { display: flex; gap: 8px; margin-bottom: 16px; }
.namebar .btn { padding: 8px 14px; font-size: 13px; white-space: nowrap; }

.btn {
  display: inline-block; background: var(--ink); color: var(--paper); border: none;
  font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 1.5px;
  font-size: 15px; padding: 12px 22px; box-shadow: 4px 4px 0 var(--rouge);
  transition: transform 0.08s, box-shadow 0.08s;
}
.btn:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--rouge); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); box-shadow: none; }
.btn.block { display: block; width: 100%; text-align: center; }

/* ---- FULLSCREEN DILEMMA VIEW & ANIMATIONS ---- */
.dilemma-container {
  flex: 1; display: flex; flex-direction: column; gap: 14px;
  will-change: transform, opacity;
}

.dilemma-container.slide-in {
  animation: slideInRight 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.dilemma-container.slide-out {
  animation: slideOutLeft 0.22s cubic-bezier(0.7, 0, 0.84, 0) forwards;
  pointer-events: none;
}

@keyframes slideInRight {
  0% { opacity: 0; transform: translateX(25px); }
  100% { opacity: 1; transform: translateX(0); }
}

@keyframes slideOutLeft {
  0% { opacity: 1; transform: translateX(0); }
  100% { opacity: 0; transform: translateX(-25px); }
}

.slide-out-up {
  animation: slideOutUp 0.22s cubic-bezier(0.7, 0, 0.84, 0) forwards;
  pointer-events: none;
}
.slide-in-up {
  animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes slideOutUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-30px); }
}
@keyframes slideInUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

.dilemma-card {
  background: #fdfbf7; border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  padding: 20px; position: relative; margin-bottom: 0;
}
.dilemma-card h2 { font-size: clamp(22px, 5.5vw, 30px); margin-bottom: 10px; color: var(--ink); }
.dilemma-card p { font-size: 16px; line-height: 1.45; }

.choices{display:flex;flex-direction:column;gap:10px}.choice{ text-align:left;background:var(--paper);border:1.5px solid var(--ink); padding:12px 14px;font-size:16px;font-family:'Spectral',serif; box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;}.choice:nth-child(odd){transform:rotate(-.4deg)}.choice:nth-child(even){transform:rotate(.4deg)}.choice:hover{transform:translate(1px,1px) rotate(0);box-shadow:1px 1px 0 var(--ink);background:#fff}.choice .cl{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:15px;letter-spacing:.5px;display:block;color:var(--ink)}

.choice.selected {
  background: var(--bleu);
  color: #fff;
  border-color: var(--ink);
  transform: translate(2px, 2px);
  box-shadow: 0px 0px 0 var(--ink);
}
.choice.selected .cl { color: #fff; }
.choice.selected span { color: rgba(255,255,255,0.85) !important; }

/* ---- TABLE & AUDIENCE RESULTS ---- */
.grid-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
.grid-table th, .grid-table td { border: 1px solid var(--ink); padding: 6px 8px; text-align: left; }
.grid-table th { background: var(--paper-dark); font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; }
.grid-table tr:nth-child(even) { background: rgba(255,255,255,0.5); }

.badge { background: var(--gold); color: var(--ink); font-family: 'Anton', sans-serif; padding: 2px 8px; font-size: 12px; text-transform: uppercase; border: 1px solid var(--ink); }

@media (prefers-reduced-motion: reduce) { 
  * { transition: none !important; animation: none !important; } 
  .dilemma-container.slide-in, .dilemma-container.slide-out,
  .slide-in-up, .slide-out-up { animation: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

const BARS = ["#EAEAEA", "#F2E33B", "#3EC6C6", "#4CBB4C", "#D648C8", "#E8392F", "#2C3BD6"];

function renderMire(h = 8) {
  return `
    <div style="display: flex; height: ${h}px; border-radius: 2px; overflow: hidden;" aria-hidden="true">
      ${BARS.map(b => `<div style="flex: 1; background: ${b};"></div>`).join('')}
    </div>
  `;
}

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const GRP_COST = { j1524: 0.8, a2549: 1.2, s50: 0.7, csp: 1.5 };
const VOLUME_PUB = 2; // M€ par point de PDA moyenne de saison (base annuelle, calibrée pour que les revenus restent proportionnés au budget de grille)
const TRESORERIE_CRITIQUE = -60; // seuil de mise sous tutelle (M€)

const nf1 = n => n.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

function fmtDelta(val, decimals, suffix) {
  const sign = val > 0 ? '+' : (val < 0 ? '' : '±');
  const formatted = val.toLocaleString('fr-FR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return `${sign}${formatted}${suffix}`;
}

function renderEvolutionChart(points) {
  if (points.length < 2) {
    return `
      <div class="eh-title">Évolution de votre chaîne</div>
      <div class="eh-subtitle">Performance des principaux indicateurs sur les 5 dernières saisons</div>
      <div class="spark-empty">Graphique disponible après la saison 1</div>
    `;
  }
  const series = [
    { key: 'coutGrille', color: 'var(--gris)', icon: '📋', label: 'Coût de grille', suffix: ' M€' },
    { key: 'revenusPub', color: 'var(--vert)', icon: '📺', label: 'Revenus pub', suffix: ' M€' }
  ];
  const recentPoints = points.slice(-5);
  const w = 280, h = 178, padTop = 16, padSide = 6;
  const baseline = h - 20;
  const chartH = baseline - padTop;
  const n = recentPoints.length;
  const groupGap = 10;
  const barGap = 3;
  const groupW = (w - padSide * 2 - groupGap * (n - 1)) / n;
  const barW = (groupW - barGap) / 2;
  const max = Math.max(...recentPoints.flatMap(pt => series.map(s => pt[s.key])), 1);

  const barsHtml = recentPoints.map((pt, i) => {
    const groupX = padSide + i * (groupW + groupGap);
    const groupBars = series.map((s, si) => {
      const v = pt[s.key];
      const x = groupX + si * (barW + barGap);
      const barH = Math.max((v / max) * chartH, 2);
      const y = baseline - barH;
      return `
        <text x="${(x + barW / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="middle" font-family="'Anton', sans-serif" font-size="7.5" fill="var(--ink)">${nf1(v)}</text>
        <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${s.color}">
          <title>Saison ${pt.season} — ${s.label} : ${nf1(v)}${s.suffix}</title>
        </rect>
      `;
    }).join('');
    const seasonLabel = `<text x="${(groupX + groupW / 2).toFixed(1)}" y="${(baseline + 12).toFixed(1)}" text-anchor="middle" font-size="9" font-style="italic" fill="var(--gris)">Saison ${pt.season}</text>`;
    return groupBars + seasonLabel;
  }).join('');

  return `
    <div class="eh-title">Évolution de votre chaîne</div>
    <div class="eh-subtitle">Performance des principaux indicateurs sur les 5 dernières saisons</div>
    <div class="eh-legend">
      ${series.map(s => `<span class="eh-legend-item"><i style="background:${s.color}"></i>${s.icon} ${s.label}</span>`).join('')}
    </div>
    <svg class="eh-bar-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">${barsHtml}</svg>
  `;
}

function renderProgramGrid(type, pdaCible) {
  const grid = PROGRAM_GRID[type];
  const targetKey = gameState.player.target;
  const calculated = getCalculatedPDAs();

  const rows = TIME_SLOTS.map(slot => {
    const slotValue = pdaCible * SLOT_AFFINITY[type][slot.key];
    const competitorValues = calculated
      .filter(c => c.channel !== gameState.player)
      .map(c => c.pda[targetKey] * SLOT_AFFINITY[c.channel.type][slot.key]);
    const rank = 1 + competitorValues.filter(v => v > slotValue + 1e-9).length;
    const isLeaderSlot = rank === 1;
    return `
      <div class="pg-row${isLeaderSlot ? ' pg-leader' : ''}">
        <div class="pg-slot"><span class="ic">${slot.icon}</span>${slot.label}</div>
        <div class="pg-program-cell">
          <div class="pg-program">${grid[slot.key]}</div>
          <span class="pg-crown${isLeaderSlot ? '' : ' pg-crown-hidden'}" title="Leader sur ce créneau">👑</span>
        </div>
        <div class="pg-rank-col${isLeaderSlot ? ' pg-rank-leader' : ''}">#${rank}</div>
        <div class="pg-pda">${nf1(slotValue)}%</div>
      </div>
    `;
  }).join('');
  return `
    <div class="eh-title">Grille de la chaîne</div>
    <div class="eh-subtitle">PDA cible par créneau horaire</div>
    <div class="pg-header">
      <div>Créneau</div>
      <div>Programme</div>
      <div class="pg-rank-col">Ranking</div>
      <div class="pg-pda">PDA cible</div>
    </div>
    ${rows}
  `;
}

function renderGlobalAudienceShare() {
  const activeKey = gameState.audienceShareTarget || gameState.player.target;
  const activeTarget = AUDIENCE_TARGETS.find(t => t.key === activeKey) || AUDIENCE_TARGETS[0];

  const calculated = getCalculatedPDAs();
  const playerCalc = calculated.find(item => item.channel === gameState.player);
  const playerValue = playerCalc.pda[activeTarget.key];

  const standings = calculated.map(item => ({
    name: item.channel === gameState.player ? item.name + ' (Vous)' : item.name,
    pda: item.pda[activeTarget.key],
    isPlayer: item.channel === gameState.player
  })).sort((a, b) => b.pda - a.pda);
  const max = Math.max(...standings.map(s => s.pda), 1);

  const strategicKey = gameState.player.target;
  const orderedTargets = [
    ...AUDIENCE_TARGETS.filter(t => t.key === strategicKey),
    ...AUDIENCE_TARGETS.filter(t => t.key !== strategicKey)
  ];
  const switcherHtml = orderedTargets.map(t => `
    <button class="ga-target-btn${t.key === activeTarget.key ? ' active' : ''}" data-audience-target="${t.key}">${t.short}</button>
  `).join('');

  const rows = standings.map((s, idx) => `
    <div class="ga-row${s.isPlayer ? ' ga-player' : ''}">
      <div class="ga-rank">#${idx + 1}</div>
      <div class="ga-info">
        <div class="ga-name">${esc(s.name)}</div>
        <div class="ga-bar-track"><div class="ga-bar-fill" style="width:${(s.pda / max * 100).toFixed(1)}%"></div></div>
      </div>
      <div class="ga-pct">${nf1(s.pda)}%</div>
    </div>
  `).join('');

  return `
    <div class="ga-panel" id="ga-panel">
      <div class="ga-header">
        <div class="eh-title">Part d'audience</div>
        <div class="ga-target-switcher">${switcherHtml}</div>
      </div>
      <div class="ga-headline">
        <div class="ga-headline-value">${nf1(playerValue)}%</div>
        <div class="ga-headline-label">${activeTarget.full}</div>
      </div>
      ${rows}
    </div>
  `;
}

function starRowHtml(filled) {
  return Array.from({ length: 5 }, (_, i) => `<span class="${i < filled ? 'star-filled' : 'star-empty'}">★</span>`).join('');
}

function renderStatStars(player, pdaCible, compliance) {
  const popFilled = Math.round((player.popularite / 100) * 5);
  const popClass = player.popularite >= 60 ? 'good' : (player.popularite >= 40 ? 'warn' : 'bad');

  const lower = 50;
  const upper = Math.max(player.coutGrilleCumul * 5, lower + 1);
  let tresoFilled;
  if (player.tresorerie <= lower) tresoFilled = 1;
  else if (player.tresorerie >= upper) tresoFilled = 5;
  else tresoFilled = 1 + Math.round(((player.tresorerie - lower) / (upper - lower)) * 4);
  const tresoClass = player.tresorerie < 0 ? 'bad' : (tresoFilled >= 4 ? 'good' : 'warn');

  const perfLower = 0.05, perfUpper = 0.30;
  const efficacite = pdaCible / Math.max(player.coutGrilleCumul, 0.01);
  let perfFilled;
  if (efficacite <= perfLower) perfFilled = 1;
  else if (efficacite >= perfUpper) perfFilled = 5;
  else perfFilled = 1 + Math.round(((efficacite - perfLower) / (perfUpper - perfLower)) * 4);
  const perfClass = perfFilled >= 4 ? 'good' : (perfFilled >= 2 ? 'warn' : 'bad');

  const arcomFilled = Math.round((compliance.arcomScore / 100) * 5);
  const arcomClass = compliance.arcomScore >= 75 ? 'good' : (compliance.arcomScore >= 60 ? 'warn' : 'bad');

  return `
    <div class="eh-title">Indicateurs de performance</div>
    <div class="eh-subtitle">Popularité, trésorerie, efficacité et conformité éditoriale</div>
    <div class="stat-list">
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">⭐</span>Popularité</div>
        <div class="stat-row-stars">${starRowHtml(popFilled)}</div>
        <div class="stat-row-value ${popClass}">${Math.round(player.popularite)}%</div>
      </div>
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">💰</span>Trésorerie</div>
        <div class="stat-row-stars">${starRowHtml(tresoFilled)}</div>
        <div class="stat-row-value ${tresoClass}">${nf1(player.tresorerie)} M€</div>
      </div>
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">📈</span>Performance</div>
        <div class="stat-row-stars">${starRowHtml(perfFilled)}</div>
        <div class="stat-row-value ${perfClass}">${Math.round(efficacite * 100)}%</div>
      </div>
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">⚖️</span>Conformité</div>
        <div class="stat-row-stars">${starRowHtml(arcomFilled)}</div>
        <div class="stat-row-value ${arcomClass}">${compliance.arcomScore}/100</div>
      </div>
    </div>
  `;
}

function renderArcomSlide(compliance, convention) {
  const rows = compliance.obligations.map(ob => `
    <div class="arcom-mini-row">
      <span class="arcom-mini-dot ${ob.rate >= 1 ? 'ok' : (ob.rate >= 0.75 ? 'warn' : 'bad')}"></span>
      <span class="arcom-mini-label">${esc(ob.label)}</span>
      <span class="arcom-mini-value">${nf1(ob.actualValue)}${ob.unit === '%' ? '%' : ' ' + ob.unit} / ${ob.minimum}${ob.unit === '%' ? '%' : ' ' + ob.unit}</span>
    </div>
  `).join('');
  return `
    <div class="eh-title">Convention ARCOM</div>
    <div class="eh-subtitle">${esc(convention.label)} — obligations éditoriales</div>
    <div class="arcom-score-row">
      <div class="arcom-score-value">${compliance.arcomScore} / 100</div>
      <div class="arcom-status-pill arcom-status-${compliance.status.key}">${compliance.status.emoji} ${compliance.status.label}</div>
    </div>
    <div class="arcom-obligations-mini">${rows}</div>
    <button class="arcom-view-btn" type="button">Voir la convention complète →</button>
  `;
}

function renderEcoBilanSlide(player) {
  const depenses = player.coutGrilleEngageSaison;
  const coutTalents = player.coutTalentsSaison;
  const coutProgrammes = Math.max(0, depenses - coutTalents);
  const revenus = player.revenusPubPrevisionnels;
  const maxFlow = Math.max(depenses, revenus, 1);
  const rentabPos = player.rentabiliteGrille >= 0;

  const secondaryItems = [
    { icon: '💰', label: 'Trésorerie début', value: `${nf1(player.tresorerieDebutSaison)} M€` },
    { icon: '🎤', label: 'Coût des talents', value: `-${nf1(player.coutTalentsSaison)} M€` },
    { icon: '📊', label: 'Coût / pt PDA', value: `${nf1(player.coutParPointPDA)} M€` }
  ];

  return `
    <div class="ga-header">
      <div class="eh-title">Bilan économique</div>
      <div class="eh-legend" style="margin: 0; gap: 8px;">
        <span class="eh-legend-item"><i style="background:var(--rouge)"></i>Progr.</span>
        <span class="eh-legend-item"><i style="background:var(--bleu)"></i>Talents</span>
        <span class="eh-legend-item"><i style="background:var(--vert)"></i>Revenus</span>
      </div>
    </div>
    <div class="eh-subtitle">Saison ${gameState.season} — flux financiers en temps réel</div>

    <div class="eco-hero">
      <div class="eco-hero-value ${rentabPos ? 'eco-pos' : 'eco-neg'}">${fmtDelta(player.rentabiliteGrille, 1, '%')}</div>
      <div class="eco-hero-label">Rentabilité de la grille</div>
    </div>

    <div class="eco-flow">
      <div class="eco-flow-row">
        <div class="eco-flow-label"><span class="ic">📋</span>Dépenses</div>
        <div class="eco-flow-bar-track">
          <div class="eco-flow-bar-fill eco-flow-programmes" style="width:${(coutProgrammes / maxFlow * 100).toFixed(1)}%"></div>
          <div class="eco-flow-bar-fill eco-flow-talents" style="width:${(coutTalents / maxFlow * 100).toFixed(1)}%"></div>
        </div>
        <div class="eco-flow-value eco-neg">-${nf1(depenses)} M€</div>
      </div>
      <div class="eco-flow-row">
        <div class="eco-flow-label"><span class="ic">📺</span>Revenus pub</div>
        <div class="eco-flow-bar-track"><div class="eco-flow-bar-fill eco-flow-revenu" style="width:${(revenus / maxFlow * 100).toFixed(1)}%"></div></div>
        <div class="eco-flow-value eco-pos">+${nf1(revenus)} M€</div>
      </div>
    </div>

    <div class="eco-bilan-grid">
      ${secondaryItems.map(it => `
        <div class="eco-bilan-item">
          <div class="eco-bilan-label"><span class="ic">${it.icon}</span>${it.label}</div>
          <div class="eco-bilan-value">${it.value}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function computeAttractivite(popularite) {
  return 1 + (popularite - 50) / 200;
}

function computeRevenusPubSaison(pdaMoyenneSaison, cible, popularite, puissanceCommerciale) {
  return pdaMoyenneSaison * GRP_COST[cible] * VOLUME_PUB * computeAttractivite(popularite) * puissanceCommerciale;
}

function computeNextBudgetGrille(player) {
  const base = CHANNEL_TYPES[player.type].baseBudget;
  const bonusTresorerie = Math.max(0, (player.tresorerie - base) * 0.12);
  const bonusPerformance = Math.max(0, player.rentabiliteGrille * 0.08);
  const raw = base + bonusTresorerie + bonusPerformance;
  return Math.max(base * 0.5, Math.min(raw, base * 2.5));
}

const CHANNEL_TYPES = {
  generaliste: {
    label: "📺 Généraliste",
    objectif: "Toucher le plus grand nombre.",
    forces: "Audience globale, événementiel.",
    faiblesses: "Coûts élevés, concurrence forte.",
    baseBudget: 50,
    pdaMods: { j1524: 10, a2549: 15, s50: 20, csp: 12 }
  },
  cinema: {
    label: "🎬 Cinéma / Séries",
    objectif: "Devenir la référence fiction.",
    forces: "Fidélisation, catalogue.",
    faiblesses: "Coûts des droits.",
    baseBudget: 40,
    pdaMods: { j1524: 12, a2549: 22, s50: 18, csp: 10 }
  },
  culture: {
    label: "🧠 Culture / Documentaire",
    objectif: "Construire une image qualitative.",
    forces: "CSP+, fidélité.",
    faiblesses: "Audience de masse plus difficile.",
    baseBudget: 25,
    pdaMods: { j1524: 5, a2549: 10, s50: 18, csp: 30 }
  },
  jeunesse: {
    label: "👶 Jeunesse / Famille",
    objectif: "Conquérir les familles et les jeunes.",
    forces: "Fidélité, consommation régulière.",
    faiblesses: "Cible plus spécifique.",
    baseBudget: 25,
    pdaMods: { j1524: 25, a2549: 18, s50: 5, csp: 8 }
  },
  sport: {
    label: "⚽ Sport",
    objectif: "Devenir la chaîne des grands événements.",
    forces: "Pics d'audience, forte valeur publicitaire.",
    faiblesses: "Droits extrêmement coûteux.",
    baseBudget: 35,
    pdaMods: { j1524: 15, a2549: 25, s50: 12, csp: 18 }
  },
  info: {
    label: "📰 Information en continu",
    objectif: "Devenir la chaîne réflexe d'information.",
    forces: "Consommation quotidienne, actualité.",
    faiblesses: "Dépendance à l'actualité et forte volatilité.",
    baseBudget: 25,
    pdaMods: { j1524: 5, a2549: 18, s50: 22, csp: 25 }
  }
};

const TIME_SLOTS = [
  { key: 'matin', icon: '🌅', label: 'Matin' },
  { key: 'apresmidi', icon: '☀️', label: 'Après-midi' },
  { key: 'access', icon: '🌇', label: 'Access' },
  { key: 'prime', icon: '🌙', label: 'Prime' },
  { key: 'nuit', icon: '🌃', label: 'Nuit' }

function getEligibleDilemmas() {
  const type = gameState.player.type;
  return DILEMMA_BANK.filter(d => !d.types || d.types.includes(type));
}

function pickDilemmaQueue() {
  const pool = getEligibleDilemmas();
  const available = pool.filter(d => !gameState.seenDilemmaIds.includes(d.id));
  let queue = shuffle(available).slice(0, 4);
  if (queue.length < 4) {
    gameState.seenDilemmaIds = [];
    const usedIds = new Set(queue.map(d => d.id));
    const remainingPool = pool.filter(d => !usedIds.has(d.id));
    queue = queue.concat(shuffle(remainingPool).slice(0, 4 - queue.length));
  }
  gameState.seenDilemmaIds.push(...queue.map(d => d.id));
  return queue;
}

function initCompetitors() {
  const availableNames = FICTIONAL_CHANNEL_NAMES.filter(n => n.toLowerCase() !== gameState.player.name.toLowerCase());
  const names = shuffle(availableNames).slice(0, 5);
  const types = Object.keys(CHANNEL_TYPES);
  const targets = Object.keys(TARGET_STRATEGIES);

  gameState.competitors = names.map((name, i) => {
    const cType = types[i % types.length];
    let cTarget = (i < 2) ? gameState.player.target : targets[(i + 1) % targets.length];
    const basePda = { ...CHANNEL_TYPES[cType].pdaMods };

    return {
      name,
      type: cType,
      target: cTarget,
      budget: CHANNEL_TYPES[cType].baseBudget,
      pda: basePda
    };
  });
}

function finalizeChannelSetup() {
  gameState.player.tresorerie = CHANNEL_TYPES[gameState.player.type].baseBudget;
  // Le coût de grille de départ représente 30% de la trésorerie disponible en début de partie.
  gameState.player.coutGrilleCumul = 0.30 * gameState.player.tresorerie;
  gameState.player.revenusPubCumul = 0;
  gameState.player.popularite = 50;

  initCompetitors();

  const targetDemo = gameState.player.target;
  const demoTotals = {};
  ['j1524', 'a2549', 's50', 'csp'].forEach(d => {
    demoTotals[d] = gameState.competitors.reduce((sum, c) => sum + Math.max(1, c.pda[d]), 0);
  });

  gameState.player.pda = { j1524: 0.2, a2549: 0.2, s50: 0.2, csp: 0.2 };
  gameState.player.pda[targetDemo] = demoTotals[targetDemo] * 0.0101;

  gameState.player.arcomHistory = [];
  gameState.player.arcomViolations = [];
  gameState.player.arcomSanctionsCount = 0;
  gameState.player.sportDisciplinesSeen = [];
  gameState.player.lastArcomResult = null;
  gameState.renewalDue = false;
  gameState.gameOverReason = null;
  resetSeasonEditoMix();

  const player = gameState.player;
  player.puissanceCommerciale = 1;
  player.budgetGrilleAnnuel = 0.30 * player.tresorerie;
  player.coutGrilleEngageSaison = player.budgetGrilleAnnuel;
  player.revenusPubPrevisionnels = 0;
  player.revenusPubFinals = 0;
  player.resultatSaison = 0;
  player.rentabiliteGrille = 0;
  player.coutParPointPDA = 0;
  player.coutTalentsSaison = 0;
  player.tresorerieDebutSaison = player.tresorerie;
  const seedPdaCible = getCalculatedPDAs().find(item => item.channel === player).pda[targetDemo];
  player.pdaHistorySeason = [seedPdaCible];
  player.pdaMoyenneSaison = seedPdaCible;
  player.pdaFinSaison = seedPdaCible;
}

function getAllChannels() {
  return [gameState.player, ...gameState.competitors];
}

function getCalculatedPDAs() {
  const channels = getAllChannels();
  const demos = ['j1524', 'a2549', 's50', 'csp'];
  
  const demoTotals = {};
  demos.forEach(d => {
    demoTotals[d] = channels.reduce((sum, c) => sum + Math.max(0.1, c.pda[d]), 0);
  });

  return channels.map(c => {
    const normPda = {};
    let sumNorm = 0;
    demos.forEach(d => {
      normPda[d] = (Math.max(0.1, c.pda[d]) / demoTotals[d]) * 100;
      sumNorm += normPda[d];
    });
    
    return {
      channel: c,
      name: c.name,
      pda: normPda,
      globalPda: sumNorm / 4
    };
  });
}

function resetSeasonEditoMix() {
  const base = EDITO_BASE[gameState.player.type];
  gameState.player.editoMix = { ...base };
  gameState.player.seasonCreationSpend = 0;
  gameState.player.seasonTotalSpend = 0;
}

function applyDilemmaEditoImpact(dilemma, choiceIndex, choice) {
  const player = gameState.player;
  const tags = DILEMMA_FLAVOR[dilemma.id];
  const impact = tags ? tags[choiceIndex] : null;
  if (impact) {
    EDITO_CATEGORIES.forEach(cat => {
      if (impact[cat]) {
        player.editoMix[cat] = Math.max(0, Math.min(100, player.editoMix[cat] + impact[cat]));
      }
    });
    if (impact.discipline && !player.sportDisciplinesSeen.includes(impact.discipline)) {
      player.sportDisciplinesSeen.push(impact.discipline);
    }
  }
  if (choice.b < 0) {
    player.seasonTotalSpend += Math.abs(choice.b);
    if (impact && impact.creation > 0) {
      player.seasonCreationSpend += Math.abs(choice.b);
    }
  }
}

function computeObligationActual(ob, editoMix, player) {
  const calc = ob.calc;
  if (calc.cat) {
    const val = editoMix[calc.cat] || 0;
    return calc.factor ? val * calc.factor : val;
  }
  if (calc.composite) {
    const sum = calc.composite.reduce((s, c) => s + (editoMix[c] || 0), 0);
    return sum / calc.composite.length;
  }
  if (calc.special === 'investCreation') {
    return player.seasonTotalSpend > 0 ? (player.seasonCreationSpend / player.seasonTotalSpend) * 100 : 0;
  }
  if (calc.special === 'sportDisciplines') {
    return player.sportDisciplinesSeen.length;
  }
  return 0;
}

function obligationScoreFromRate(rate) {
  if (rate >= 1) return 100;
  if (rate >= 0.9) return 80 + (rate - 0.9) / 0.1 * 20;
  if (rate >= 0.75) return 50 + (rate - 0.75) / 0.15 * 30;
  return Math.max(0, rate / 0.75 * 50);
}

function getArcomStatusMeta(score) {
  if (score >= 90) return { key: 'excellent', label: 'EXCELLENT', emoji: '🟢' };
  if (score >= 75) return { key: 'conforme', label: 'CONFORME', emoji: '🟢' };
  if (score >= 60) return { key: 'vigilance', label: 'VIGILANCE', emoji: '🟠' };
  if (score >= 40) return { key: 'manquements', label: 'MANQUEMENTS', emoji: '🔴' };
  return { key: 'nonconforme', label: 'NON-CONFORME', emoji: '⛔' };
}

function computeArcomCompliance() {
  const player = gameState.player;
  const convention = ARCOM_CONVENTIONS[player.type];
  const editoMix = player.editoMix;

  const rawValues = convention.obligations.map(ob => computeObligationActual(ob, editoMix, player));
  const pctRawSum = convention.obligations.reduce((sum, ob, i) => ob.unit === '%' ? sum + rawValues[i] : sum, 0);
  const pctScale = pctRawSum > 0 ? 100 / pctRawSum : 1;

  let weightedSum = 0, weightTotal = 0;
  const obligations = convention.obligations.map((ob, i) => {
    const actualValue = ob.unit === '%' ? rawValues[i] * pctScale : rawValues[i];
    const rate = ob.minimum > 0 ? actualValue / ob.minimum : 1;
    const score = obligationScoreFromRate(rate);
    weightedSum += score * ob.weight;
    weightTotal += ob.weight;
    return { ...ob, actualValue, rate, score, compliant: rate >= 1 };
  });
  const arcomScore = Math.round(weightTotal > 0 ? weightedSum / weightTotal : 100);
  return { obligations, arcomScore, status: getArcomStatusMeta(arcomScore) };
}

function pushArcomSeasonResult() {
  const player = gameState.player;
  const compliance = computeArcomCompliance();
  player.arcomHistory.push({
    season: gameState.season,
    score: compliance.arcomScore,
    status: compliance.status.key,
    violations: compliance.obligations.filter(o => o.rate < 1).length
  });
  compliance.obligations.forEach(ob => {
    if (ob.rate < 0.75) {
      player.arcomViolations.push({ season: gameState.season, obligation: ob.id, label: ob.label, severity: 'grave', penalty: 6, weight: ob.weight });
    } else if (ob.rate < 0.9) {
      player.arcomViolations.push({ season: gameState.season, obligation: ob.id, label: ob.label, severity: 'significatif', penalty: 3, weight: ob.weight });
    } else if (ob.rate < 1) {
      player.arcomViolations.push({ season: gameState.season, obligation: ob.id, label: ob.label, severity: 'leger', penalty: 1, weight: ob.weight });
    }
  });
  const tier = compliance.status.key;
  if (tier === 'excellent') {
    player.popularite = Math.min(100, player.popularite + 1);
    player.tresorerie += 1;
  } else if (tier === 'manquements') {
    player.tresorerie -= 3;
    player.popularite = Math.max(0, player.popularite - 2);
    player.arcomSanctionsCount++;
  } else if (tier === 'nonconforme') {
    player.tresorerie -= 8;
    player.popularite = Math.max(0, player.popularite - 5);
    player.arcomSanctionsCount++;
  }
  player.lastArcomResult = compliance;
  return compliance;
}

function computeRenewalScore() {
  const player = gameState.player;
  const recent = player.arcomHistory.slice(-CONVENTION_DURATION);
  const complianceAverage = recent.length ? recent.reduce((s, h) => s + h.score, 0) / recent.length : 100;
  const graveWeightSum = player.arcomViolations
    .filter(v => v.severity === 'grave' && v.season > gameState.season - CONVENTION_DURATION)
    .reduce((sum, v) => sum + (v.weight || 5), 0);
  const graveWeightPerSeason = graveWeightSum / Math.max(1, recent.length);
  const violationScore = Math.max(0, 100 - graveWeightPerSeason * 8);
  const obligationsNow = player.lastArcomResult ? player.lastArcomResult.obligations : [];
  const diversityScore = obligationsNow.length ? Math.round(obligationsNow.reduce((s, o) => s + o.score, 0) / obligationsNow.length) : 100;
  const creationInvestmentScore = Math.min(100, Math.round((player.editoMix.creation || 0) / 12 * 100));
  const sanctionHistoryScore = Math.max(0, 100 - player.arcomSanctionsCount * 15);
  const renewalScore = Math.round(
    complianceAverage * 0.40 +
    violationScore * 0.25 +
    diversityScore * 0.15 +
    creationInvestmentScore * 0.10 +
    sanctionHistoryScore * 0.10
  );
  return { renewalScore, complianceAverage, violationScore, diversityScore, creationInvestmentScore, sanctionHistoryScore };
}

function getRenewalOutcome(score) {
  if (score >= 80) return { key: 'renewed', emoji: '🟢', title: 'CONVENTION RENOUVELÉE', message: "Votre chaîne respecte durablement les engagements de sa convention. L'autorisation est renouvelée." };
  if (score >= 65) return { key: 'conditional', emoji: '🟠', title: 'CONVENTION RENOUVELÉE SOUS CONDITIONS', message: "L'ARCOM renouvelle votre convention sous réserve d'un plan de redressement." };
  if (score >= 50) return { key: 'watch', emoji: '🟠', title: 'RENOUVELLEMENT SOUS SURVEILLANCE', message: "La chaîne conserve son autorisation mais fait l'objet d'un contrôle renforcé." };
  return { key: 'refused', emoji: '⛔', title: 'RENOUVELLEMENT REFUSÉ', message: "L'ARCOM refuse de renouveler votre autorisation d'émettre." };
}

function chooseDilemmaOption(choiceIndex) {
  const dilemma = gameState.dilemmaQueue[gameState.currentDilemmaIndex];
  const choice = dilemma.c[choiceIndex];
  const player = gameState.player;
  const popAvant = player.popularite;

  applyDilemmaEditoImpact(dilemma, choiceIndex, choice);

  const pdaCibleAvant = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];

  for (const t in choice.pda) {
    let delta = choice.pda[t];
    if (popAvant < 25 && delta < 0) delta *= 1.5;
    if (popAvant > 75 && delta > 0) delta *= 1.25;
    player.pda[t] = Math.max(0.1, player.pda[t] + delta);
  }

  gameState.competitors.forEach(comp => {
    if (comp.target === player.target) {
      comp.pda[comp.target] = Math.max(1, comp.pda[comp.target] + (choice.b > 0 ? -0.5 : 1));
    } else {
      comp.pda[comp.target] = Math.max(1, comp.pda[comp.target] + (Math.random() * 1.5 - 0.5));
    }
  });

  // Le coût de grille est un budget annuel qui revient chaque saison (cf. startNewSeason /
  // finalizeChannelSetup) : les choix de dilemme ne débitent plus la trésorerie au fil de l'eau,
  // ils font évoluer ce budget engagé (à la hausse pour un coût, à la baisse pour une économie).
  // Comme les revenus pub, le coût de grille n'est réglé sur la trésorerie qu'au bilan de fin
  // de saison (cf. finalisation ci-dessous).
  const coutGrilleDelta = choice.b < 0 ? Math.abs(choice.b) : 0;
  if (coutGrilleDelta > 0) {
    player.coutGrilleCumul += coutGrilleDelta;
  }
  player.coutGrilleEngageSaison = Math.max(0, player.coutGrilleEngageSaison - choice.b);
  const talentCost = DILEMMA_TALENT_COST[dilemma.id];
  if (talentCost) {
    player.coutTalentsSaison += talentCost[choiceIndex];
  }
  player.popularite = Math.max(0, Math.min(100, player.popularite + choice.pop));

  const pdaCibleApres = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];
  player.pdaHistorySeason.push(pdaCibleApres);
  player.pdaMoyenneSaison = player.pdaHistorySeason.reduce((s, v) => s + v, 0) / player.pdaHistorySeason.length;
  player.pdaFinSaison = pdaCibleApres;

  // Les revenus publicitaires ne sont que prévisionnels pendant la saison : ils ne sont
  // crédités à la trésorerie qu'au bilan de fin de saison (cf. finalisation ci-dessous).
  const revenusPubAvant = player.revenusPubPrevisionnels;
  player.revenusPubPrevisionnels = computeRevenusPubSaison(player.pdaMoyenneSaison, player.target, player.popularite, player.puissanceCommerciale);
  player.revenusPubCumul = player.revenusPubPrevisionnels;
  const revenusPubDelta = player.revenusPubPrevisionnels - revenusPubAvant;

  // Rentabilité grille et coût/PDA sont recalculés en temps réel à chaque dilemme,
  // à partir des valeurs courantes de la saison (pas seulement au bilan de fin de saison).
  player.rentabiliteGrille = player.coutGrilleEngageSaison > 0 ? (player.revenusPubPrevisionnels / player.coutGrilleEngageSaison - 1) * 100 : 0;
  player.coutParPointPDA = player.pdaMoyenneSaison > 0 ? player.coutGrilleEngageSaison / player.pdaMoyenneSaison : 0;

  gameState.lastConsequence = {
    titre: dilemma.titre,
    choixLabel: choice.l,
    resultat: choice.r,
    deltas: {
      tresorerie: choice.b,
      pdaCible: pdaCibleApres - pdaCibleAvant,
      coutGrille: coutGrilleDelta,
      revenusPub: revenusPubDelta,
      popularite: choice.pop
    }
  };

  gameState.logs.push({
    title: dilemma.titre,
    result: choice.r
  });

  gameState.currentDilemmaIndex++;

  if (player.tresorerie < TRESORERIE_CRITIQUE) {
    gameState.pendingNextStep = 8;
    gameState.gameOverReason = 'tresorerie';
  } else if (gameState.currentDilemmaIndex >= gameState.dilemmaQueue.length) {
    // Finalisation économique de la saison : les revenus pub définitifs (calculés sur la
    // PDA moyenne de la saison) ne sont crédités qu'ici, une seule fois.
    player.revenusPubFinals = computeRevenusPubSaison(player.pdaMoyenneSaison, player.target, player.popularite, player.puissanceCommerciale);
    player.revenusPubCumul = player.revenusPubFinals;
    player.resultatSaison = player.revenusPubFinals - player.coutGrilleEngageSaison;
    // Règlement unique de fin de saison : revenus pub crédités et coût de grille débité en même temps.
    player.tresorerie += player.resultatSaison;
    player.rentabiliteGrille = player.coutGrilleEngageSaison > 0 ? (player.revenusPubFinals / player.coutGrilleEngageSaison - 1) * 100 : 0;
    player.coutParPointPDA = player.pdaMoyenneSaison > 0 ? player.coutGrilleEngageSaison / player.pdaMoyenneSaison : 0;

    if (player.pdaFinSaison > player.pdaMoyenneSaison && player.popularite >= 60) {
      player.puissanceCommerciale = Math.min(1.15, player.puissanceCommerciale + 0.01);
    } else if (player.pdaFinSaison < player.pdaMoyenneSaison * 0.9 || player.popularite < 40) {
      player.puissanceCommerciale = Math.max(0.85, player.puissanceCommerciale - 0.01);
    }

    gameState.history.push({
      season: gameState.season,
      tresorerie: player.tresorerie,
      pdaCible: pdaCibleApres,
      coutGrille: player.coutGrilleCumul,
      revenusPub: player.revenusPubCumul,
      popularite: player.popularite,
      tresorerieDebut: player.tresorerieDebutSaison,
      budgetGrille: player.budgetGrilleAnnuel,
      coutGrilleSaison: player.coutGrilleEngageSaison,
      pdaMoyenne: player.pdaMoyenneSaison,
      pdaFin: player.pdaFinSaison,
      revenusPubSaison: player.revenusPubFinals,
      resultatSaison: player.resultatSaison,
      tresorerieFin: player.tresorerie,
      rentabiliteGrille: player.rentabiliteGrille
    });
    pushArcomSeasonResult();
    gameState.renewalDue = gameState.season % CONVENTION_DURATION === 0;
    if (player.tresorerie < TRESORERIE_CRITIQUE) {
      gameState.pendingNextStep = 8;
      gameState.gameOverReason = 'tresorerie';
    } else {
      gameState.pendingNextStep = 7;
    }
  } else {
    gameState.pendingNextStep = 6;
  }
  gameState.dilemmaPhase = 'result';

  render();
}

function continueAfterConsequence() {
  gameState.step = gameState.pendingNextStep;
  gameState.pendingNextStep = null;
  gameState.dilemmaPhase = 'choosing';
  render();
}

function startNewSeason() {
  const player = gameState.player;
  gameState.season++;
  gameState.currentDilemmaIndex = 0;
  gameState.dilemmaQueue = pickDilemmaQueue();
  gameState.dilemmaPhase = 'choosing';
  gameState.renewalDue = false;

  player.budgetGrilleAnnuel = computeNextBudgetGrille(player);
  player.tresorerieDebutSaison = player.tresorerie;
  // Le budget de grille est annuel : il revient chaque saison comme coût fixe de départ,
  // que les dilemmes de la saison viendront ensuite ajuster à la hausse ou à la baisse.
  player.coutGrilleCumul += player.budgetGrilleAnnuel;
  player.coutGrilleEngageSaison = player.budgetGrilleAnnuel;
  player.revenusPubPrevisionnels = 0;
  player.revenusPubFinals = 0;
  player.resultatSaison = 0;
  player.coutTalentsSaison = 0;
  const seedPdaCible = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];
  player.pdaHistorySeason = [seedPdaCible];
  player.pdaMoyenneSaison = seedPdaCible;
  player.pdaFinSaison = seedPdaCible;
  // Le coût de grille cumulé (historique) de la saison écoulée est répercuté sur la
  // nouvelle saison (pas de remise à zéro) ; seul le coût engagé de la saison repart à 0.
  player.revenusPubCumul = 0;
  resetSeasonEditoMix();
  gameState.step = 6;
  render();
}

function goHome() {
  if (gameState.step === 6 || gameState.step === 7) {
    gameState.resumeStep = gameState.step;
  }
  gameState.step = 1;
  render();
}

  return `

    </div>
  `;
}

function renderTicker() {
  const p = gameState.player;
  const calculated = getCalculatedPDAs();
  const playerCalc = calculated.find(item => item.channel === p);
  const pdaCible = playerCalc.pda[p.target];
  const open = !!gameState.hudExpanded;

  // Trésorerie affichée au HUD : projection en temps réel (trésorerie de début de saison +
  // résultat prévisionnel courant), même si le règlement réel ne tombe qu'au bilan de fin de
  // saison. Se comporte ainsi comme "Revenus pub", déjà affiché en prévisionnel live.
  // Le budget de grille annuel (déjà intégré à coutGrilleEngageSaison dès le début de saison)
  // n'est pas déduit ici : seuls les ajustements des dilemmes le sont, pour que la trésorerie
  // affichée en tout début de saison corresponde exactement au capital de départ annoncé.
  const coutDilemmesSeulement = p.coutGrilleEngageSaison - p.budgetGrilleAnnuel;
  const tresorerieLive = p.tresorerieDebutSaison + (p.revenusPubPrevisionnels - coutDilemmesSeulement);

  const lastHistorySeason = gameState.history.length ? gameState.history[gameState.history.length - 1].season : null;
  const currentPoint = {
    season: gameState.season, tresorerie: p.tresorerie, pdaCible, coutGrille: p.coutGrilleCumul,
    revenusPub: p.revenusPubCumul, popularite: p.popularite
  };
  const chartPoints = lastHistorySeason === gameState.season ? gameState.history : [...gameState.history, currentPoint];

  const programGridHtml = renderProgramGrid(p.type, pdaCible);
  const globalAudienceShareHtml = renderGlobalAudienceShare();
  const evolutionChartHtml = renderEvolutionChart(chartPoints);
  const compliance = p.lastArcomResult || computeArcomCompliance();
  const statStarsHtml = renderStatStars(p, pdaCible, compliance);
  const arcomSlideHtml = renderArcomSlide(compliance, ARCOM_CONVENTIONS[p.type]);
  const ecoBilanSlideHtml = renderEcoBilanSlide(p);
  const slide = gameState.hudSlide || 0;

  return `
    <div class="hud-wrap">
      <div class="hud">
        <div class="hud-cell hero${tresorerieLive < 0 ? ' alert' : ''}">
          <div class="lab"><span class="ic">💰</span>Trésorerie</div>
          <div class="val">${nf1(tresorerieLive)} M€</div>
        </div>
        <div class="hud-cell hero">
          <div class="lab"><span class="ic">🎯</span>PDA Cible</div>
          <div class="val">${nf1(pdaCible)}%</div>
        </div>
        <div class="hud-cell">
          <div class="lab"><span class="ic">📋</span>Coût grille</div>
          <div class="val">${nf1(p.coutGrilleCumul)} M€</div>
        </div>
        <div class="hud-cell">
          <div class="lab"><span class="ic">📺</span>Revenus pub</div>
          <div class="val">${nf1(p.revenusPubCumul)} M€</div>
        </div>
        <div class="hud-cell">
          <div class="lab"><span class="ic">⭐</span>Popularité</div>
          <div class="val">${Math.round(p.popularite)}%</div>
        </div>
      </div>
      <button class="hud-toggle${open ? ' open' : ''}" id="hud-toggle" aria-label="Détail des indicateurs" aria-expanded="${open}">
        <span class="hud-toggle-line"></span>
        <span class="hud-toggle-chevron"></span>
        <span class="hud-toggle-line"></span>
      </button>
      <div class="hud-details${open ? ' open' : ''}" id="hud-details">
        <div class="hud-details-inner">
          <div class="eh-slider" id="eh-slider">
            <div class="eh-slider-track" id="eh-slider-track" style="transform: translateX(-${slide * 100}%);">
              <div class="eh-slide">${programGridHtml}</div>
              <div class="eh-slide">${ecoBilanSlideHtml}</div>
              <div class="eh-slide">${globalAudienceShareHtml}</div>
              <div class="eh-slide">${evolutionChartHtml}</div>
              <div class="eh-slide">${statStarsHtml}</div>
              <div class="eh-slide">${arcomSlideHtml}</div>
            </div>
          </div>
          <div class="eh-slider-nav">
            <div class="eh-slider-dots" id="eh-slider-dots">
              <button class="eh-dot${slide === 0 ? ' active' : ''}" data-slide="0" aria-label="Écran 1"></button>
              <button class="eh-dot${slide === 1 ? ' active' : ''}" data-slide="1" aria-label="Écran 2"></button>
              <button class="eh-dot${slide === 2 ? ' active' : ''}" data-slide="2" aria-label="Écran 3"></button>
              <button class="eh-dot${slide === 3 ? ' active' : ''}" data-slide="3" aria-label="Écran 4"></button>
              <button class="eh-dot${slide === 4 ? ' active' : ''}" data-slide="4" aria-label="Écran 5"></button>
              <button class="eh-dot${slide === 5 ? ' active' : ''}" data-slide="5" aria-label="Écran 6"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}
