    document.getElementById('btn-rand').onclick = () => {
      const randomName = pick(GENERATED_NAMES[gameState.player.type]);
      document.getElementById('chain-name').value = randomName;
    };
    document.getElementById('btn-next-4').onclick = () => {
      const val = document.getElementById('chain-name').value.trim();
      gameState.player.name = val || GENERATED_NAMES[gameState.player.type][0];

      finalizeChannelSetup();

      gameState.resumeStep = null;
      gameState.step = 5;
      render();
    };
    app.querySelector('.masthead').onclick = goHome;
    return;
  }

  if (gameState.step === 5) {
    const typeObj = CHANNEL_TYPES[gameState.player.type];
    const targetObj = TARGET_STRATEGIES[gameState.player.target];

    app.innerHTML = `
      ${renderMasthead("Étape 4/4 : Fiche Nouveau Entrant", "Audience Masters")}
      <div class="card">
        <div class="tape"></div>
        <div class="kicker">ÉTAPE 5 — PARAMÈTRES ANNÉE 1</div>
        <h2 style="color: var(--bleu);">${esc(gameState.player.name)}</h2>
        <p><b>Format :</b> ${typeObj.label} | <b>Cible prioritaire :</b> ${targetObj.nom}</p>
        
        <hr style="margin: 10px 0; border: none; border-top: 1px dashed var(--ink);">
        
        <h3>CONDITIONS DE DÉPART</h3>
        <ul style="margin: 8px 0 14px 18px; font-size: 14px;">
          <li><b>Capital de départ :</b> ${nf1(gameState.player.tresorerie)} M€</li>
          <li><b>Audience sur cible :</b> 1,0 % (Nouveau entrant)</li>
          <li><b>Adversaires :</b> 5 chaînes établies avec de gros budgets.</li>
        </ul>

        <div class="badge">Objectif Année 1 : Passer le cap des 3% PDA</div>
      </div>
      <button class="btn block" id="btn-launch" style="font-size: 17px; padding: 14px;">🚀 DÉMARRER LA SAISON 1</button>
    `;
    document.getElementById('btn-launch').onclick = () => {
      gameState.dilemmaQueue = pickDilemmaQueue();
      gameState.currentDilemmaIndex = 0;
      gameState.step = 6;
      render();
    };
    app.querySelector('.masthead').onclick = goHome;
    return;
  }

  if (gameState.step === 6) {
    const phase = gameState.dilemmaPhase;
    // En phase "résultat", le dilemme vient d'être résolu : l'index a déjà avancé,
    // on réaffiche donc celui qui vient d'être répondu, pas le suivant.
    const dilemmaIndex = phase === 'result' ? gameState.currentDilemmaIndex - 1 : gameState.currentDilemmaIndex;
    const dilemma = gameState.dilemmaQueue[dilemmaIndex];

    let zoneHtml;
    if (phase === 'result') {
      const cq = gameState.lastConsequence;
      const d = cq.deltas;
      const rows = [
        { icon: '💰', label: 'Trésorerie', val: d.tresorerie, decimals: 1, suffix: ' M€', invert: false },
        { icon: '🎯', label: 'PDA Cible', val: d.pdaCible, decimals: 1, suffix: ' pts', invert: false },
        { icon: '📋', label: 'Coût de grille', val: d.coutGrille, decimals: 1, suffix: ' M€', invert: true },
        { icon: '📺', label: 'Revenus pub', val: d.revenusPub, decimals: 1, suffix: ' M€', invert: false },
        { icon: '⭐', label: 'Popularité', val: d.popularite, decimals: 0, suffix: ' pts', invert: false }
      ];
      const badgesHtml = rows.map(r => {
        const signal = r.invert ? -r.val : r.val;
        const cls = signal > 0.05 ? 'up' : signal < -0.05 ? 'down' : 'flat';
        return `<span class="impact-badge ${cls}"><span class="ic">${r.icon}</span>${r.label} ${fmtDelta(r.val, r.decimals, r.suffix)}</span>`;
      }).join('');

      zoneHtml = `
        <div class="slide-in-up">
          <div class="dilemma-card">
            <p>${esc(cq.resultat)}</p>
            <div class="impact-badges">${badgesHtml}</div>
          </div>
          <button class="btn block" id="btn-continue" style="font-size: 17px; padding: 14px; margin-top: 14px;">Continuer →</button>
        </div>
      `;
    } else {
      zoneHtml = `
        <div class="choices">
          ${dilemma.c.map((choice, i) => `
            <button class="choice" data-idx="${i}">
              <span class="cl">${choice.l}</span>
              <span style="font-size: 12px; color: var(--gris);">Impact estimé : Budget ${choice.b >= 0 ? '+' : ''}${choice.b} M€</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    app.innerHTML = `
      ${renderMasthead("Saison " + gameState.season, "Audience Masters")}
      ${renderTicker()}
      <div class="dilemma-container${phase === 'choosing' ? ' slide-in' : ''}">
        <div class="dilemma-card">
          <div class="kicker">SAISON ${gameState.season}</div>
          <h2>${dilemma.titre}</h2>
          <p>${dilemma.desc}</p>
        </div>
        <div id="choice-zone">${zoneHtml}</div>
      </div>
    `;

    if (phase === 'choosing') {
      app.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => {
          const choicesEl = document.querySelector('#choice-zone .choices');
          btn.classList.add('selected');

          if (choicesEl) {
            choicesEl.classList.add('slide-out-up');
          }

          const choiceIdx = parseInt(btn.dataset.idx, 10);
          setTimeout(() => {
            chooseDilemmaOption(choiceIdx);
          }, 220);
        };
      });
    } else {
      document.getElementById('btn-continue').onclick = () => {
        continueAfterConsequence();
      };
    }
    document.getElementById('hud-toggle').onclick = () => {
      const isOpen = document.getElementById('hud-details').classList.toggle('open');
      document.getElementById('hud-toggle').classList.toggle('open', isOpen);
      gameState.hudExpanded = isOpen;
    };
    const goToHudSlide = idx => {
      const clamped = Math.max(0, Math.min(5, idx));
      gameState.hudSlide = clamped;
      document.getElementById('eh-slider-track').style.transform = `translateX(-${clamped * 100}%)`;
      document.querySelectorAll('.eh-dot').forEach(d => d.classList.toggle('active', parseInt(d.dataset.slide, 10) === clamped));
    };
    document.querySelectorAll('.eh-dot').forEach(dot => {
      dot.onclick = () => goToHudSlide(parseInt(dot.dataset.slide, 10));
    });
    const ehSlider = document.getElementById('eh-slider');
    const ehTrack = document.getElementById('eh-slider-track');
    let dragStartX = 0;
    let dragDeltaX = 0;
    let isDragging = false;
    ehSlider.addEventListener('pointerdown', e => {
      if (e.target.closest('.ga-target-btn') || e.target.closest('.arcom-view-btn')) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragDeltaX = 0;
      ehTrack.style.transition = 'none';
      ehSlider.setPointerCapture(e.pointerId);
    });
    ehSlider.addEventListener('click', e => {
      const arcomBtn = e.target.closest('.arcom-view-btn');
      if (arcomBtn) {
        gameState.step = 9;
        render();
        return;
      }
      const btn = e.target.closest('.ga-target-btn');
      if (!btn) return;
      gameState.audienceShareTarget = btn.dataset.audienceTarget;
      const panel = document.getElementById('ga-panel');
      if (panel) panel.outerHTML = renderGlobalAudienceShare();
    });
    ehSlider.addEventListener('pointermove', e => {
      if (!isDragging) return;
      dragDeltaX = e.clientX - dragStartX;
      const deltaPercent = (dragDeltaX / ehSlider.clientWidth) * 100;
      const base = -(gameState.hudSlide || 0) * 100;
      ehTrack.style.transform = `translateX(${base + deltaPercent}%)`;
    });
    const endDrag = () => {
      if (!isDragging) return;
      isDragging = false;
      ehTrack.style.transition = '';
      const threshold = ehSlider.clientWidth * 0.15;
      let target = gameState.hudSlide || 0;
      if (dragDeltaX > threshold) target -= 1;
      else if (dragDeltaX < -threshold) target += 1;
      goToHudSlide(target);
    };
    ehSlider.addEventListener('pointerup', endDrag);
    ehSlider.addEventListener('pointercancel', endDrag);
    ehSlider.addEventListener('pointerleave', endDrag);
    app.querySelector('.masthead').onclick = goHome;
    return;
  }

  if (gameState.step === 7) {
    const targetKey = gameState.player.target;
    const targetLabel = TARGET_STRATEGIES[targetKey].nom;
    const calculated = getCalculatedPDAs();
    const standings = calculated.map(item => ({
      name: item.channel === gameState.player ? item.name + " (Vous)" : item.name,
      pda: item.pda[targetKey].toFixed(1),
      isPlayer: item.channel === gameState.player
    })).sort((a, b) => b.pda - a.pda);
    const compliance = gameState.player.lastArcomResult || computeArcomCompliance();

    app.innerHTML = `
      ${renderMasthead("Fin de saison", "Audience Masters")}
      <div class="card">
        <div class="tape"></div>
        <div class="kicker">BILAN DE LA SAISON ${gameState.season} / ${esc(targetLabel)}</div>
        <div class="bilan-title-row">
          <h2>PART D'AUDIENCE GLOBALE</h2>
          <div class="arcom-status-pill arcom-status-${compliance.status.key}">${compliance.status.emoji} ARCOM ${compliance.status.label} — ${compliance.arcomScore}/100</div>
        </div>

        <table class="grid-table">
          <thead>
            <tr>
              <th>Rang</th>
              <th>Chaîne TV</th>
              <th>PDA Cible</th>
            </tr>
          </thead>
          <tbody>
            ${standings.map((st, idx) => `
              <tr style="${st.isPlayer ? 'font-weight: bold; background: rgba(31,58,147,0.1);' : ''}">
                <td>#${idx + 1}</td>
                <td>${esc(st.name)}</td>
                <td>${st.pda}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <h3>DERNIÈRES DÉCISIONS</h3>
        <ul style="margin: 6px 0 12px 18px; font-size: 13px;">
          ${gameState.logs.slice(-4).map(l => `<li><b>${esc(l.title)} :</b> ${esc(l.result)}</li>`).join('')}
        </ul>
      </div>

      <button class="btn block" id="btn-next-season">${gameState.renewalDue ? 'Voir le renouvellement de convention →' : `Lancer la Saison ${gameState.season + 1} →`}</button>
    `;

    document.getElementById('btn-next-season').onclick = () => {
      if (gameState.renewalDue) {
        gameState.step = 10;
        render();
      } else {
        startNewSeason();
      }
    };
    app.querySelector('.masthead').onclick = goHome;
    return;
  }

  if (gameState.step === 8) {
    const isArcom = gameState.gameOverReason === 'arcom';
    app.innerHTML = `
      ${renderMasthead("Fin de partie", "Audience Masters")}
      <div class="card">
        <div class="tape"></div>
        <div class="kicker" style="color: var(--rouge);">${isArcom ? 'AUTORISATION RETIRÉE' : 'MISE SOUS TUTELLE'}</div>
        <h2 style="color: var(--rouge);">${isArcom ? esc(gameState.player.name) + " perd son autorisation d'émettre" : esc(gameState.player.name) + " dépose le bilan"}</h2>
        <p style="margin: 12px 0;">${isArcom
          ? "L'ARCOM a refusé le renouvellement de votre convention : les manquements répétés à vos obligations éditoriales ont eu raison de votre autorisation d'émettre."
          : `La trésorerie de la chaîne est tombée à ${nf1(gameState.player.tresorerie)} M€, sous le seuil critique de ${nf1(TRESORERIE_CRITIQUE)} M€. L'Arcom place la chaîne sous tutelle administrative.`}</p>
        <ul style="margin: 8px 0 14px 18px; font-size: 14px;">
          <li><b>Saison atteinte :</b> ${gameState.season}</li>
          <li><b>Popularité finale :</b> ${Math.round(gameState.player.popularite)} / 100</li>
        </ul>
      </div>
      <button class="btn block" id="btn-restart" style="font-size: 17px; padding: 14px;">Recommencer une chaîne →</button>
    `;
    document.getElementById('btn-restart').onclick = () => {
      resetGame();
    };
    return;
  }

  if (gameState.step === 9) {
    const player = gameState.player;
    const compliance = player.lastArcomResult || computeArcomCompliance();
    const convention = ARCOM_CONVENTIONS[player.type];
    const nextEcheance = (Math.floor(gameState.season / CONVENTION_DURATION) + 1) * CONVENTION_DURATION;
    const renewal = computeRenewalScore();
    const renewalOutcome = getRenewalOutcome(renewal.renewalScore);

    app.innerHTML = `
      ${renderMasthead("Détails de votre convention", "Audience Masters")}
      <div class="card">
        <div class="tape"></div>
        <div class="kicker">CONVENTION — ${esc(convention.label).toUpperCase()}</div>
        <div class="arcom-score-row">
          <div class="arcom-score-value">${compliance.arcomScore} / 100</div>
          <div class="arcom-status-pill arcom-status-${compliance.status.key}">${compliance.status.emoji} ${compliance.status.label}</div>
        </div>
      </div>

      <div class="card">
        <div class="tape"></div>
        <h3>1. OBLIGATIONS ÉDITORIALES</h3>
        <div class="arcom-obligations-list">
          ${compliance.obligations.map(ob => `
            <div class="arcom-oblig-row">
              <span class="arcom-mini-dot ${ob.rate >= 1 ? 'ok' : (ob.rate >= 0.75 ? 'warn' : 'bad')}"></span>
              <div class="arcom-oblig-info">
                <div class="arcom-oblig-label">${esc(ob.label)}</div>
                <div class="arcom-oblig-bar-track"><div class="arcom-oblig-bar-fill ${ob.rate >= 1 ? 'ok' : (ob.rate >= 0.75 ? 'warn' : 'bad')}" style="width:${Math.min(100, ob.rate * 100).toFixed(0)}%"></div></div>
              </div>
              <div class="arcom-oblig-value">${nf1(ob.actualValue)}${ob.unit === '%' ? '%' : ''} / ${ob.minimum}${ob.unit === '%' ? '%' : ' ' + ob.unit}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="card">
        <div class="tape"></div>
        <h3>2. SANCTIONS</h3>
        <p style="font-size: 14px;">Sanctions financières cumulées : <b>${player.arcomSanctionsCount}</b></p>
      </div>

      <div class="card">
        <div class="tape"></div>
        <h3>3. RENOUVELLEMENT</h3>
        <p style="font-size: 14px;">Prochaine échéance : <b>Saison ${nextEcheance}</b></p>
        <div class="arcom-status-pill arcom-status-${renewalOutcome.key === 'refused' ? 'nonconforme' : (renewalOutcome.key === 'renewed' ? 'excellent' : 'vigilance')}" style="margin-top: 8px;">${renewalOutcome.emoji} ${renewalOutcome.key === 'renewed' ? 'RENOUVELLEMENT FAVORABLE' : renewalOutcome.title}</div>
      </div>

      <button class="btn ghost block" id="btn-arcom-back">← Retour</button>
    `;
    document.getElementById('btn-arcom-back').onclick = () => {
      gameState.step = 6;
      render();
    };
    app.querySelector('.masthead').onclick = () => { gameState.step = 1; render(); };
    return;
  }

  if (gameState.step === 10) {
    const player = gameState.player;
    const renewal = computeRenewalScore();
    const outcome = getRenewalOutcome(renewal.renewalScore);
    const calculated = getCalculatedPDAs();
    const playerCalc = calculated.find(c => c.channel === player);
    const pdaMoyenne = playerCalc.globalPda;
    const gravesRecents = player.arcomViolations.filter(v => v.severity === 'grave' && v.season > gameState.season - CONVENTION_DURATION).length;

    app.innerHTML = `
      ${renderMasthead("Renouvellement de convention", "Audience Masters")}
      <div class="card">
        <div class="tape"></div>
        <div class="kicker">⚖️ RENOUVELLEMENT DE VOTRE CONVENTION</div>
        <h2>${esc(outcome.title)}</h2>
        <p style="margin: 10px 0;">${esc(outcome.message)}</p>
        <div class="arcom-status-pill arcom-status-${outcome.key === 'refused' ? 'nonconforme' : (outcome.key === 'renewed' ? 'excellent' : 'vigilance')}">${outcome.emoji} Score de renouvellement : ${renewal.renewalScore} / 100</div>
        <ul style="margin: 14px 0 4px 18px; font-size: 13px;">
          <li>PDA moyenne : ${nf1(pdaMoyenne)}%</li>
          <li>Revenus cumulés : ${nf1(player.revenusPubCumul)} M€</li>
          <li>Score ARCOM moyen (période) : ${nf1(renewal.complianceAverage)} / 100</li>
          <li>Manquements graves récents : ${gravesRecents}</li>
          <li>Sanctions cumulées : ${player.arcomSanctionsCount}</li>
        </ul>
      </div>
      <button class="btn block" id="btn-renewal-continue" style="font-size: 17px; padding: 14px;">${outcome.key === 'refused' ? 'Voir le bilan final →' : 'Continuer →'}</button>
    `;
    document.getElementById('btn-renewal-continue').onclick = () => {
      if (outcome.key === 'refused') {
        gameState.gameOverReason = 'arcom';
        gameState.step = 8;
        render();
      } else {
        startNewSeason();
      }
    };
    return;
  }
}

render();
</script>
</body>
</html>
