<style>
:root {
  --ink: #16130e;
  --paper: #efeade;
  --paper-dark: #e4ddcc;
  --rouge: #c8102e;
  --bleu: #1f3a93;
  --gris: #8a8378;
  --vert: #2e6b3a;
  --gold: #d4af37;
  --danger: #c8102e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  background-image: repeating-linear-gradient(0deg, rgba(22, 19, 14, 0.025) 0 1px, transparent 1px 3px);
  color: var(--ink);
  font-family: 'Spectral', Georgia, serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

#app {
  max-width: 680px;
  margin: 0 auto;
  padding: 12px 14px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1, h2, h3, .display {
  font-family: 'Anton', Impact, sans-serif;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  line-height: 1.05;
}

button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }

/* ---- MASTHEAD ---- */
.masthead { text-align: center; padding: 10px 0 8px; margin-bottom: 14px; cursor: pointer; transition: opacity 0.15s; }
.masthead:hover { opacity: 0.75; }
.masthead .over { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gris); }
.header-brand { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
.header-brand .dot {
  flex-shrink: 0;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 8px var(--danger);
  animation: blink 2.2s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
.masthead h1 { font-size: clamp(32px, 8vw, 50px); }
.masthead .under { font-style: italic; font-size: 13px; margin-top: 2px; color: #4a443b; margin-bottom: 10px; }

/* ---- HUD (5 INDICATEURS) ---- */
.hud-wrap { margin: 0 0 16px; }
.hud {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  border-top: 3px solid var(--ink);
  padding: 8px 4px; background: rgba(255,255,255,0.4);
}
.hud-cell { position: relative; text-align: center; min-width: 0; padding: 0 3px; }
.hud-cell .lab {
  font-family: 'Anton', sans-serif; font-size: 8.5px; letter-spacing: 0.5px; text-transform: uppercase;
  color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; justify-content: center; gap: 3px;
}
.hud-cell .ic { font-size: 10px; }
.hud-cell .val {
  font-family: 'Anton', sans-serif; font-size: 15px; white-space: nowrap;
  font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.hud-cell.alert .val { color: var(--rouge); }
.hud-cell.alert { animation: alertPulse 1.4s ease-in-out infinite; }
@keyframes alertPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

.hud-toggle {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; box-sizing: border-box;
  border: none; border-top: 1px solid rgba(22,19,14,0.15); border-bottom: 3px solid var(--ink);
  background: rgba(255,255,255,0.25);
  padding: 5px 10px; cursor: pointer;
  font-family: 'Anton', sans-serif; font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--gris);
  transition: background 0.15s, color 0.15s;
}
.hud-toggle:hover { color: var(--ink); background: rgba(255,255,255,0.5); }
.hud-toggle.open { color: var(--ink); background: rgba(255,255,255,0.5); }
.hud-toggle .chevron {
  width: 7px; height: 7px; margin-top: -3px;
  border-right: 2px solid var(--gris); border-bottom: 2px solid var(--gris);
  transform: rotate(45deg);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.15s, margin-top 0.3s ease;
}
.hud-toggle:hover .chevron, .hud-toggle.open .chevron { border-color: var(--ink); }
.hud-toggle.open .chevron { transform: rotate(-135deg); margin-top: 3px; }

.hud-details {
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
}
.hud-details.open { max-height: 800px; opacity: 1; }
.hud-details-inner {
  background: #f7f3e8; border: 1.5px solid var(--ink); box-shadow: 4px 4px 0 rgba(22,19,14,0.85);
  padding: 12px 14px; margin-top: 8px;
}
.hud-detail-row {
  display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px;
  padding: 5px 0; border-bottom: 1px dashed rgba(22,19,14,0.15);
}
.hud-detail-row:last-of-type { border-bottom: none; }
.hud-detail-row .hdr-label {
  font-family: 'Anton', sans-serif; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
}
.hud-detail-row .hdr-value { font-family: 'Anton', sans-serif; font-size: 13px; margin-left: auto; white-space: nowrap; }
.hud-detail-row .hdr-desc { font-size: 12px; color: #5c564a; font-style: italic; flex-basis: 100%; margin-top: 2px; }
.hud-detail-subtitle {
  font-family: 'Anton', sans-serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--rouge); margin: 10px 0 6px;
}
.hud-audience-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.hud-audience-cell { text-align: center; background: var(--paper); border: 1px solid var(--ink); padding: 5px 2px; }
.hud-audience-cell .aud-lab { font-size: 9px; color: var(--gris); text-transform: uppercase; font-family: 'Anton', sans-serif; }
.hud-audience-cell .aud-val { font-family: 'Anton', sans-serif; font-size: 14px; }

/* ---- ÉCRAN DE CONSÉQUENCES ---- */
.impact-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.impact-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: 'Anton', sans-serif; font-size: 11px; letter-spacing: 0.2px; white-space: nowrap;
  padding: 3px 8px; border-radius: 3px; background: var(--paper); border: 1px solid var(--ink);
}
.impact-badge.up { color: var(--vert); border-color: var(--vert); }
.impact-badge.down { color: var(--rouge); border-color: var(--rouge); }
.impact-badge.flat { color: var(--gris); border-color: var(--gris); }

@media (max-width: 520px) {
  .hud { gap: 3px; padding: 6px 2px; }
  .hud-cell { padding: 0 1px; }
  .hud-cell .lab { font-size: 7.5px; gap: 2px; }
  .hud-cell .val { font-size: 20px; }
}

/* ---- ONBOARDING & CARDS ---- */
.kicker { font-family: 'Anton', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--rouge); margin-bottom: 6px; }
.card {
  background: #f7f3e8; border: 1.5px solid var(--ink);
  box-shadow: 4px 4px 0 rgba(22,19,14,0.85);
  padding: 16px; margin-bottom: 16px; position: relative;
}
.tape { position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-1.5deg); width: 80px; height: 20px; background: rgba(31,58,147,0.18); border: 1px dashed rgba(31,58,147,0.4); }

.optgrid { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 12px 0 20px; }
@media(min-width: 520px) { .optgrid { grid-template-columns: 1fr 1fr; } }

.opt {
  text-align: left; background: #f7f3e8; border: 1.5px solid var(--ink); padding: 12px;
  font-family: 'Spectral', serif; font-size: 14px; box-shadow: 3px 3px 0 var(--ink);
  transition: transform 0.1s, background 0.1s;
}
.opt:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.opt .ol { font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: 16px; display: block; margin-bottom: 2px; color: var(--rouge); }
.opt .od { font-style: italic; color: #5c564a; font-size: 13px; display: block; }
.opt.sel { background: var(--ink); color: var(--paper); }
.opt.sel .ol { color: #ffffff; }
.opt.sel .od { color: #cfc8b6; }

input[type=text] {
  width: 100%; font-family: 'Anton', sans-serif; font-size: 20px; text-transform: uppercase;
  padding: 10px; border: 2px solid var(--ink); background: #fff; letter-spacing: 1px;
}
label { font-family: 'Anton', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; display: block; margin: 14px 0 6px; }

.namebar { display: flex; gap: 8px; margin-bottom: 16px; }
.namebar .btn { padding: 8px 14px; font-size: 13px; white-space: nowrap; }

.btn {
  display: inline-block; background: var(--ink); color: var(--paper); border: none;
  font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 1.5px;
  font-size: 15px; padding: 12px 22px; box-shadow: 4px 4px 0 var(--rouge);
  transition: transform 0.08s, box-shadow 0.08s;
}
.btn:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--rouge); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); box-shadow: none; }
.btn.block { display: block; width: 100%; text-align: center; }

/* ---- FULLSCREEN DILEMMA VIEW & ANIMATIONS ---- */
.dilemma-container {
  flex: 1; display: flex; flex-direction: column; gap: 14px;
  will-change: transform, opacity;
}

.dilemma-container.slide-in {
  animation: slideInRight 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.dilemma-container.slide-out {
  animation: slideOutLeft 0.22s cubic-bezier(0.7, 0, 0.84, 0) forwards;
  pointer-events: none;
}

@keyframes slideInRight {
  0% { opacity: 0; transform: translateX(25px); }
  100% { opacity: 1; transform: translateX(0); }
}

@keyframes slideOutLeft {
  0% { opacity: 1; transform: translateX(0); }
  100% { opacity: 0; transform: translateX(-25px); }
}

.slide-out-up {
  animation: slideOutUp 0.22s cubic-bezier(0.7, 0, 0.84, 0) forwards;
  pointer-events: none;
}
.slide-in-up {
  animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes slideOutUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-30px); }
}
@keyframes slideInUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

.dilemma-card {
  background: #fdfbf7; border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  padding: 20px; position: relative; margin-bottom: 0;
}
.dilemma-card h2 { font-size: clamp(22px, 5.5vw, 30px); margin-bottom: 10px; color: var(--ink); }
.dilemma-card p { font-size: 16px; line-height: 1.45; }

.choices{display:flex;flex-direction:column;gap:10px}.choice{ text-align:left;background:var(--paper);border:1.5px solid var(--ink); padding:12px 14px;font-size:16px;font-family:'Spectral',serif; box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;}.choice:nth-child(odd){transform:rotate(-.4deg)}.choice:nth-child(even){transform:rotate(.4deg)}.choice:hover{transform:translate(1px,1px) rotate(0);box-shadow:1px 1px 0 var(--ink);background:#fff}.choice .cl{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:15px;letter-spacing:.5px;display:block}

.choice.selected {
  background: var(--bleu);
  color: #fff;
  border-color: var(--ink);
  transform: translate(2px, 2px);
  box-shadow: 0px 0px 0 var(--ink);
}
.choice.selected .cl { color: #fff; }
.choice.selected span { color: rgba(255,255,255,0.85) !important; }

/* ---- TABLE & AUDIENCE RESULTS ---- */
.grid-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
.grid-table th, .grid-table td { border: 1px solid var(--ink); padding: 6px 8px; text-align: left; }
.grid-table th { background: var(--paper-dark); font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; }
.grid-table tr:nth-child(even) { background: rgba(255,255,255,0.5); }

.badge { background: var(--gold); color: var(--ink); font-family: 'Anton', sans-serif; padding: 2px 8px; font-size: 12px; text-transform: uppercase; border: 1px solid var(--ink); }

@media (prefers-reduced-motion: reduce) { 
  * { transition: none !important; animation: none !important; } 
  .dilemma-container.slide-in, .dilemma-container.slide-out,
  .slide-in-up, .slide-out-up { animation: none !important; }
}
</style>
</head>

function initCompetitors() {
  const names = shuffle(FICTIONAL_CHANNEL_NAMES).slice(0, 6);
  const types = Object.keys(CHANNEL_TYPES);
  const targets = Object.keys(TARGET_STRATEGIES);

  gameState.competitors = names.map((name, i) => {
    const cType = types[i % types.length];
    let cTarget = (i < 2) ? gameState.player.target : targets[(i + 1) % targets.length];
    const basePda = { ...CHANNEL_TYPES[cType].pdaMods };

    return {
      name,
      type: cType,
      target: cTarget,
      budget: CHANNEL_TYPES[cType].baseBudget,
      pda: basePda
    };
  });
}

function getAllChannels() {
  return [gameState.player, ...gameState.competitors];

  const channels = getAllChannels();
  const demos = ['j1524', 'a2549', 's50', 'csp'];
  
  const demoTotals = {};
  demos.forEach(d => {
    demoTotals[d] = channels.reduce((sum, c) => sum + Math.max(0.1, c.pda[d]), 0);
  });

  return channels.map(c => {
    const normPda = {};
    let sumNorm = 0;
    demos.forEach(d => {
      normPda[d] = (Math.max(0.1, c.pda[d]) / demoTotals[d]) * 100;
      sumNorm += normPda[d];
    });
    
    return {
      channel: c,
      name: c.name,
      pda: normPda,
      globalPda: sumNorm / 4
    };
  });
}

function chooseDilemmaOption(choiceIndex) {
  const dilemma = gameState.dilemmaQueue[gameState.currentDilemmaIndex];
  const choice = dilemma.c[choiceIndex];
  const player = gameState.player;
  const popAvant = player.popularite;

  const pdaCibleAvant = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];

  for (const t in choice.pda) {
    let delta = choice.pda[t];
    if (popAvant < 25 && delta < 0) delta *= 1.5;
    if (popAvant > 75 && delta > 0) delta *= 1.25;
    player.pda[t] = Math.max(0.1, player.pda[t] + delta);
  }

  gameState.competitors.forEach(comp => {
    if (comp.target === player.target) {
      comp.pda[comp.target] = Math.max(1, comp.pda[comp.target] + (choice.b > 0 ? -0.5 : 1));
    } else {
      comp.pda[comp.target] = Math.max(1, comp.pda[comp.target] + (Math.random() * 1.5 - 0.5));
    }
  });

  player.tresorerie += choice.b;
  const coutGrilleDelta = choice.b < 0 ? Math.abs(choice.b) : 0;
  if (coutGrilleDelta > 0) {
    player.coutGrilleCumul += coutGrilleDelta;
  }
  player.popularite = Math.max(0, Math.min(100, player.popularite + choice.pop));

  const pdaCibleApres = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];
  const revenus = computeRevenusPub(pdaCibleApres, player.target, player.popularite);
  player.tresorerie += revenus;
  player.revenusPubCumul += revenus;

  gameState.lastConsequence = {
    titre: dilemma.titre,
    choixLabel: choice.l,
    resultat: choice.r,
    deltas: {
      tresorerie: choice.b + revenus,
      pdaCible: pdaCibleApres - pdaCibleAvant,
      coutGrille: coutGrilleDelta,
      revenusPub: revenus,
      popularite: choice.pop
    }
  };

  gameState.logs.push({
    title: dilemma.titre,
    result: choice.r
  });

  gameState.currentDilemmaIndex++;

  if (player.tresorerie < TRESORERIE_CRITIQUE) {
    gameState.pendingNextStep = 8;
  } else if (gameState.currentDilemmaIndex >= gameState.dilemmaQueue.length) {
    gameState.pendingNextStep = 7;
  } else {
    gameState.pendingNextStep = 6;
  }
  gameState.dilemmaPhase = 'result';

  render();
}

function continueAfterConsequence() {
  gameState.step = gameState.pendingNextStep;
  gameState.pendingNextStep = null;
  gameState.dilemmaPhase = 'choosing';
  render();
}

function startNewSeason() {
  gameState.season++;
  gameState.currentDilemmaIndex = 0;
  gameState.dilemmaQueue = shuffle(DILEMMA_BANK).slice(0, 4);
  gameState.dilemmaPhase = 'choosing';
  // Le coût de grille de la saison écoulée est répercuté sur la nouvelle saison (pas de remise à zéro).
  gameState.player.revenusPubCumul = 0;
  gameState.step = 6;
  render();
}

function goHome() {
  if (gameState.step === 6 || gameState.step === 7) {
    gameState.resumeStep = gameState.step;
  }
  gameState.step = 1;
  render();
}

function resetGame() {
  gameState.step = 1;
  gameState.resumeStep = null;
  gameState.player = {
    name: "",
    type: "generaliste",
    target: "a2549",
    tresorerie: 50,
    coutGrilleCumul: 0,
    revenusPubCumul: 0,
    popularite: 50,
    pda: { j1524: 0.3, a2549: 1.0, s50: 0.3, csp: 0.3 }
  };
  gameState.competitors = [];
  gameState.season = 1;
  gameState.currentDilemmaIndex = 0;
  gameState.dilemmaQueue = [];
  gameState.dilemmaPhase = 'choosing';
  gameState.logs = [];
  gameState.lastConsequence = null;
  gameState.pendingNextStep = null;
  gameState.hudExpanded = false;
  render();
}

    const currentDefaultName = gameState.player.name || GENERATED_NAMES[gameState.player.type][0];
    app.innerHTML = `
      ${renderMasthead("Étape 3/4 : Nom du nouveau entrant", "Audience Masters")}
      <div class="card">
        <div class="tape"></div>
        <div class="kicker">ÉTAPE 4 — BAPTÊME D'ANTENNE</div>
        <label for="chain-name">Nom de la chaîne TV</label>
        <div class="namebar">
          <input type="text" id="chain-name" value="${esc(currentDefaultName)}" maxlength="24">
          <button class="btn ghost" id="btn-rand">🎲 Idée</button>
        </div>
      </div>
      <button class="btn block" id="btn-next-4">Voir le Récapitulatif →</button>
    `;
    document.getElementById('btn-rand').onclick = () => {
      const randomName = pick(GENERATED_NAMES[gameState.player.type]);
      document.getElementById('chain-name').value = randomName;
    };
    document.getElementById('btn-next-4').onclick = () => {
      const val = document.getElementById('chain-name').value.trim();
      gameState.player.name = val || GENERATED_NAMES[gameState.player.type][0];
      
      gameState.player.tresorerie = CHANNEL_TYPES[gameState.player.type].baseBudget;
      gameState.player.coutGrilleCumul = 0.25 * gameState.player.tresorerie;
      gameState.player.revenusPubCumul = 0;
      gameState.player.popularite = 50;

      initCompetitors();
      
      const targetDemo = gameState.player.target;
      const demoTotals = {};
      ['j1524', 'a2549', 's50', 'csp'].forEach(d => {
        demoTotals[d] = gameState.competitors.reduce((sum, c) => sum + Math.max(1, c.pda[d]), 0);
      });
      
      gameState.player.pda = { j1524: 0.2, a2549: 0.2, s50: 0.2, csp: 0.2 };
      gameState.player.pda[targetDemo] = demoTotals[targetDemo] * 0.0101;

      gameState.resumeStep = null;
      gameState.step = 5;
      render();
    };
    app.querySelector('.masthead').onclick = goHome;
    return;
  }

  if (gameState.step === 5) {
    const typeObj = CHANNEL_TYPES[gameState.player.type];
    const targetObj = TARGET_STRATEGIES[gameState.player.target];

    app.innerHTML = `
      ${renderMasthead("Étape 4/4 : Fiche Nouveau Entrant", "Audience Masters")}
      <div class="card">
        <div class="tape"></div>
        <div class="kicker">ÉTAPE 5 — PARAMÈTRES ANNÉE 1</div>
        <h2 style="color: var(--bleu);">${esc(gameState.player.name)}</h2>
        <p><b>Format :</b> ${typeObj.label} | <b>Cible prioritaire :</b> ${targetObj.nom}</p>
        
        <hr style="margin: 10px 0; border: none; border-top: 1px dashed var(--ink);">
        
        <h3>CONDITIONS DE DÉPART</h3>
        <ul style="margin: 8px 0 14px 18px; font-size: 14px;">
          <li><b>Capital de départ :</b> ${nf1(gameState.player.tresorerie)} M€</li>
          <li><b>Audience sur cible :</b> 1,0 % (Nouveau entrant)</li>
          <li><b>Adversaires :</b> 6 chaînes établies avec de gros budgets.</li>
        </ul>

        <div class="badge">Objectif Année 1 : Passer le cap des 3% PDA</div>
      </div>
      <button class="btn block" id="btn-launch" style="font-size: 17px; padding: 14px;">🚀 DÉMARRER LA SAISON 1</button>
    `;
    document.getElementById('btn-launch').onclick = () => {
      gameState.dilemmaQueue = shuffle(DILEMMA_BANK).slice(0, 4);
      gameState.currentDilemmaIndex = 0;
      gameState.step = 6;
      render();
    };
    app.querySelector('.masthead').onclick = goHome;
    return;
  }

  if (gameState.step === 6) {
    const phase = gameState.dilemmaPhase;
    // En phase "résultat", le dilemme vient d'être résolu : l'index a déjà avancé,
    // on réaffiche donc celui qui vient d'être répondu, pas le suivant.
    const dilemmaIndex = phase === 'result' ? gameState.currentDilemmaIndex - 1 : gameState.currentDilemmaIndex;
    const dilemma = gameState.dilemmaQueue[dilemmaIndex];

    let zoneHtml;
    if (phase === 'result') {
      const cq = gameState.lastConsequence;
      const d = cq.deltas;
      const rows = [
        { icon: '💰', label: 'Trésorerie', val: d.tresorerie, decimals: 1, suffix: ' M€', invert: false },
        { icon: '🎯', label: 'PDA Cible', val: d.pdaCible, decimals: 1, suffix: ' pts', invert: false },
        { icon: '📋', label: 'Coût de grille', val: d.coutGrille, decimals: 1, suffix: ' M€', invert: true },
        { icon: '📺', label: 'Revenus pub', val: d.revenusPub, decimals: 1, suffix: ' M€', invert: false },
        { icon: '⭐', label: 'Popularité', val: d.popularite, decimals: 0, suffix: ' pts', invert: false }
      ];
      const badgesHtml = rows.map(r => {
        const signal = r.invert ? -r.val : r.val;
        const cls = signal > 0.05 ? 'up' : signal < -0.05 ? 'down' : 'flat';
        return `<span class="impact-badge ${cls}"><span class="ic">${r.icon}</span>${r.label} ${fmtDelta(r.val, r.decimals, r.suffix)}</span>`;
      }).join('');

      zoneHtml = `
        <div class="slide-in-up">
          <div class="dilemma-card">
            <p>${esc(cq.resultat)}</p>
            <div class="impact-badges">${badgesHtml}</div>
          </div>
          <button class="btn block" id="btn-continue" style="font-size: 17px; padding: 14px; margin-top: 14px;">Continuer →</button>
        </div>
      `;
    } else {
      zoneHtml = `
        <div class="choices">
          ${dilemma.c.map((choice, i) => `
            <button class="choice" data-idx="${i}">
              <span class="cl">${choice.l}</span>
              <span style="font-size: 12px; color: var(--gris);">Impact estimé : Budget ${choice.b >= 0 ? '+' : ''}${choice.b} M€</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    app.innerHTML = `
      ${renderMasthead("Saison " + gameState.season, "Audience Masters")}
      ${renderTicker()}
      <div class="dilemma-container${phase === 'choosing' ? ' slide-in' : ''}">
        <div class="dilemma-card">
          <div class="kicker">SAISON ${gameState.season}</div>
          <h2>${dilemma.titre}</h2>
          <p>${dilemma.desc}</p>
        </div>
        <div id="choice-zone">${zoneHtml}</div>
      </div>
    `;

    if (phase === 'choosing') {
      app.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => {
          const choicesEl = document.querySelector('#choice-zone .choices');
          btn.classList.add('selected');

          if (choicesEl) {
            choicesEl.classList.add('slide-out-up');
          }

          const choiceIdx = parseInt(btn.dataset.idx, 10);
          setTimeout(() => {
            chooseDilemmaOption(choiceIdx);
          }, 220);
        };
      });
    } else {
      document.getElementById('btn-continue').onclick = () => {
        continueAfterConsequence();
      };
    }
    document.getElementById('hud-toggle').onclick = () => {
      const isOpen = document.getElementById('hud-details').classList.toggle('open');
      document.getElementById('hud-toggle').classList.toggle('open', isOpen);
      gameState.hudExpanded = isOpen;
    };
    app.querySelector('.masthead').onclick = goHome;
    return;
  }

  if (gameState.step === 7) {
    const calculated = getCalculatedPDAs();
    const standings = calculated.map(item => ({
      name: item.channel === gameState.player ? item.name + " (Vous)" : item.name,
      pda: item.globalPda.toFixed(1),
      isPlayer: item.channel === gameState.player
    })).sort((a, b) => b.pda - a.pda);

    app.innerHTML = `
      ${renderMasthead("CLASSEMENT MÉDIAMÉTRIE")}
      <div class="card">
        <div class="tape"></div>
        <div class="kicker">BILAN DE LA SAISON ${gameState.season}</div>
        <h2>PART D'AUDIENCE GLOBALE</h2>
        
        <table class="grid-table">
          <thead>
            <tr>
              <th>Rang</th>
              <th>Chaîne TV</th>
              <th>PDA Totale</th>
            </tr>
          </thead>
          <tbody>
            ${standings.map((st, idx) => `
              <tr style="${st.isPlayer ? 'font-weight: bold; background: rgba(31,58,147,0.1);' : ''}">
                <td>#${idx + 1}</td>
                <td>${esc(st.name)}</td>
                <td>${st.pda}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <h3>DERNIÈRES DÉCISIONS</h3>
        <ul style="margin: 6px 0 12px 18px; font-size: 13px;">
          ${gameState.logs.slice(-4).map(l => `<li><b>${esc(l.title)} :</b> ${esc(l.result)}</li>`).join('')}
        </ul>
      </div>

      <button class="btn block" id="btn-next-season">Lancer la Saison ${gameState.season + 1} →</button>
    `;

    document.getElementById('btn-next-season').onclick = () => {
      startNewSeason();
    };
    app.querySelector('.masthead').onclick = goHome;
    return;
  }

  if (gameState.step === 8) {
    app.innerHTML = `
      ${renderMasthead("Fin de partie", "Audience Masters")}
      <div class="card">
        <div class="tape"></div>
        <div class="kicker" style="color: var(--rouge);">MISE SOUS TUTELLE</div>
        <h2 style="color: var(--rouge);">${esc(gameState.player.name)} dépose le bilan</h2>
        <p style="margin: 12px 0;">La trésorerie de la chaîne est tombée à ${nf1(gameState.player.tresorerie)} M€, sous le seuil critique de ${nf1(TRESORERIE_CRITIQUE)} M€. L'Arcom place la chaîne sous tutelle administrative.</p>
        <ul style="margin: 8px 0 14px 18px; font-size: 14px;">
          <li><b>Saison atteinte :</b> ${gameState.season}</li>
          <li><b>Popularité finale :</b> ${Math.round(gameState.player.popularite)} / 100</li>
        </ul>
      </div>
      <button class="btn block" id="btn-restart" style="font-size: 17px; padding: 14px;">Recommencer une chaîne →</button>
    `;
    document.getElementById('btn-restart').onclick = () => {
      resetGame();
    };
    return;
  }
}

render();
</script>
</body>
</html>
