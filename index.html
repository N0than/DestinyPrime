<!DOCTYPE html>
<!-- Version principale d’Audience Masters. -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUDIENCE MASTERS — Devenez le Roi de l'Audimat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #121316;
  --paper: #f7f5f0;
  --paper-dark: #efece6;
  --paper-card: #ffffff;
  --rouge: #e11d48;
  --bleu: #2563eb;
  --gris: #6b7280;
  --vert: #059669;
  --gold: #d97706;
  --danger: #e11d48;
  --border: #e2dfd7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--paper);
  background-image:
    radial-gradient(#d8d3c8 0.65px, transparent 0.65px),
    linear-gradient(to bottom, rgba(247, 245, 240, 0.96), rgba(239, 236, 230, 0.98));
  background-size: 16px 16px, 100% 100%;
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

#app {
  max-width: 680px;
  margin: 0 auto;
  padding: 12px 14px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1, h2, h3, .display {
  font-family: 'Anton', Impact, sans-serif;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  line-height: 1.05;
}

button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }

/* ---- MASTHEAD ---- */
.masthead { text-align: center; padding: 10px 0 8px; margin-bottom: 14px; cursor: pointer; transition: opacity 0.15s; }
.masthead:hover { opacity: 0.75; }
.masthead .over { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gris); }
.header-brand { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
.header-brand .dot {
  flex-shrink: 0;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 8px var(--danger);
  animation: blink 2.2s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
.masthead h1 { font-size: clamp(32px, 8vw, 50px); }
.masthead .under { font-style: italic; font-size: 13px; margin-top: 2px; color: #4a443b; margin-bottom: 10px; }

/* ---- HUD (5 INDICATEURS) ---- */
.hud-wrap { margin: 0 0 16px; }
.masthead + .hud-wrap { margin-top: -22px; }
.hud-panel {
  background: rgba(255,255,255,0.95); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 18px 18px; padding: 10px;
  box-shadow: 0 4px 20px -2px rgba(24,24,27,0.05), 0 2px 6px -1px rgba(24,24,27,0.04), inset 0 0 0 1px rgba(0,0,0,0.02);
}
.hud-panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--paper-dark);
}
.hud-panel-head-label {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.6px; color: var(--gris);
}
.hud-live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--vert); flex-shrink: 0;
  animation: hudLiveDotPulse 1.6s ease-in-out infinite;
}
@keyframes hudLiveDotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.hud {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
  align-items: stretch;
}
.hud-cell {
  position: relative; text-align: center; min-width: 0; padding: 3px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
}
.hud-cell:not(:first-child)::before {
  content: ''; position: absolute; left: 0; top: 12%; bottom: 12%; width: 1px; background: var(--paper-dark);
}
.hud-cell .lab {
  font-family: 'Space Grotesk', sans-serif; font-size: 7.5px; letter-spacing: 0.4px; text-transform: uppercase;
  color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 700;
}
.hud-cell .ic {
  font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
}
.hud-cell:nth-child(1) .ic { background: rgba(217,119,6,0.14); }
.hud-cell:nth-child(2) .ic { background: rgba(225,29,72,0.12); }
.hud-cell:nth-child(3) .ic { background: rgba(217,119,6,0.14); }
.hud-cell:nth-child(4) .ic { background: rgba(37,99,235,0.12); }
.hud-cell:nth-child(5) .ic { background: rgba(217,119,6,0.16); }
.hud-cell .val {
  font-family: 'Anton', sans-serif; font-size: 14px; white-space: nowrap;
  font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.hud-cell.alert .val { color: var(--rouge); }
.hud-cell.alert { animation: alertPulse 1.4s ease-in-out infinite; }
@keyframes alertPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

.hud-toggle {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 22px; height: 22px;
  background: var(--paper-dark); color: var(--ink); border: 1px solid var(--border);
  border-radius: 999px; padding: 0; margin: 0; box-sizing: border-box;
  cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.hud-toggle:hover { border-color: var(--ink); }
.hud-toggle:active { transform: scale(0.95); }
.hud-toggle.open { background: var(--ink); color: #fff; border-color: var(--ink); }
.hud-toggle-chevron {
  width: 11px; height: 11px; flex-shrink: 0;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.hud-toggle.open .hud-toggle-chevron { transform: rotate(180deg); }

.hud-details {
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
}
.hud-details.open { max-height: 800px; opacity: 1; }
.hud-details-inner {
  background: var(--paper-card); border: 1px solid var(--border);
  box-shadow: 0 4px 20px -2px rgba(24,24,27,0.05), 0 2px 6px -1px rgba(24,24,27,0.04), inset 0 0 0 1px rgba(0,0,0,0.02);
  border-radius: 16px; padding: 12px 14px; margin-top: 8px;
}
.eh-title {
  font-family: 'Anton', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--ink); margin: 0 0 2px;
}
.eh-subtitle { font-size: 11px; font-style: italic; color: var(--gris); margin: 0 0 10px; }
.eh-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
.eh-legend-item {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Anton', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
}
.eh-legend-item i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.eh-bar-svg { display: block; width: 100%; height: 215px; }
.spark-empty { font-size: 12px; color: var(--gris); font-style: italic; margin-top: 3px; }

.eh-slider { overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; }
.eh-slider:active { cursor: grabbing; }
.eh-slider-track { display: flex; transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1); }
.eh-slide { flex: 0 0 100%; min-width: 0; }
.eh-slider-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; }
.eh-slider-dots { display: flex; gap: 6px; }
.eh-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(22,19,14,0.22); border: none; padding: 0; cursor: pointer; }
.eh-dot.active { background: var(--ink); }

.pg-slide { display: flex; flex-direction: column; height: 100%; }
.pg-head { flex-shrink: 0; }
.pg-rows { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.pg-rows .pg-row { flex: 1; }

.pg-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 6px; border-bottom: 1px solid rgba(22,19,14,0.08);
  cursor: pointer; border-radius: 10px; transition: background 0.15s ease;
}
.pg-row:last-child { border-bottom: none; }
.pg-row:hover { background: rgba(22,19,14,0.03); }
.pg-row-key { background: rgba(225,29,72,0.05); border-radius: 12px; border-bottom-color: transparent; }
.pg-row-key:hover { background: rgba(225,29,72,0.08); }

.pg-time-pill {
  flex-shrink: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 9.5px;
  letter-spacing: 0.2px; color: var(--gris); background: var(--paper-dark);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 8px; white-space: nowrap;
}
.pg-row-key .pg-time-pill { background: var(--rouge); border-color: var(--rouge); color: #fff; }

.pg-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pg-info-title {
  display: flex; align-items: center; gap: 5px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 12.5px; color: var(--ink);
}
.pg-key-tag {
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 8px; letter-spacing: 0.4px;
  color: var(--rouge); background: rgba(225,29,72,0.12); border: 1px solid rgba(225,29,72,0.25);
  border-radius: 5px; padding: 1px 5px; text-transform: uppercase;
}
.pg-info-program {
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; color: var(--gris);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pg-info-program.pg-program-updated { color: var(--vert); font-weight: 700; }
.pg-updated-badge { font-size: 9px; margin-left: 2px; }

.pg-rank {
  flex-shrink: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 10.5px;
  color: var(--gris); white-space: nowrap;
}
.pg-rank.pg-rank-leader { color: var(--gold); }

.pg-pda-badge {
  flex-shrink: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 10.5px;
  padding: 4px 9px; border-radius: 999px; white-space: nowrap;
}
.pg-badge-vert { color: var(--vert); background: rgba(5,150,105,0.12); }
.pg-badge-bleu { color: var(--bleu); background: rgba(37,99,235,0.12); }
.pg-badge-gold { color: var(--gold); background: rgba(217,119,6,0.14); }
.pg-badge-rouge { color: var(--rouge); background: rgba(225,29,72,0.12); }
.pg-badge-gris { color: var(--gris); background: rgba(107,114,128,0.14); }

.pg-chevron { flex-shrink: 0; width: 14px; height: 14px; color: var(--gris); transition: transform 0.25s cubic-bezier(0.16,1,0.3,1); }
.pg-slot-editor[open] > summary .pg-chevron { color: var(--ink); transform: rotate(180deg); }

.ga-panel { display: flex; flex-direction: column; height: 100%; }
.ga-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
.ga-header .eh-title { margin-bottom: 0; flex-shrink: 0; }
.ga-target-switcher {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
  max-width: 60%;
}
.ga-target-switcher::-webkit-scrollbar { display: none; }
.ga-target-btn {
  flex-shrink: 0; background: transparent; border: 1px solid rgba(22,19,14,0.3); color: var(--gris);
  font-family: 'Anton', sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3px;
  padding: 4px 7px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
}
.ga-target-btn:hover { border-color: var(--ink); color: var(--ink); }
.ga-target-btn.active { background: var(--rouge); border-color: var(--rouge); color: #fff; }
.ga-headline { margin: 8px 0 10px; flex-shrink: 0; }
.ga-headline-value { font-family: 'Anton', sans-serif; font-size: 26px; color: var(--ink); line-height: 1; }
.ga-headline-label { font-size: 11px; color: var(--gris); font-style: italic; margin-top: 2px; }

.ga-rows { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ga-rows .ga-row { flex: 1; }
.ga-row { display: flex; align-items: center; gap: 6px; padding: 3.5px 0; border-bottom: 1px dashed rgba(22,19,14,0.12); }
.ga-row:last-child { border-bottom: none; }
.ga-rank { font-family: 'Anton', sans-serif; font-size: 10px; color: var(--gris); width: 16px; flex-shrink: 0; }
.ga-info { flex: 1; min-width: 0; }
.ga-name {
  font-family: 'Anton', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
  margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ga-bar-track { height: 4px; background: rgba(22,19,14,0.08); border-radius: 2px; overflow: hidden; }
.ga-bar-fill { height: 100%; background: var(--gris); border-radius: 2px; }
.ga-pct { font-family: 'Anton', sans-serif; font-size: 11px; width: 38px; text-align: right; flex-shrink: 0; }
.ga-row.ga-player .ga-name { color: var(--rouge); }
.ga-row.ga-player .ga-bar-fill { background: var(--rouge); }
.ga-row.ga-player .ga-pct { color: var(--rouge); }

.stat-list { display: flex; flex-direction: column; }
.stat-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed rgba(22,19,14,0.12); }
.stat-row:last-child { border-bottom: none; }
.stat-row-label {
  display: flex; align-items: center; gap: 5px; flex: 0 0 100px; min-width: 0;
  font-family: 'Anton', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; color: var(--ink);
}
.stat-row-stars { flex: 1; font-size: 16px; letter-spacing: 1.5px; }
.stat-row-stars .star-filled { color: var(--gold); }
.stat-row-stars .star-empty { color: rgba(22,19,14,0.2); }
.stat-row-value { font-family: 'Anton', sans-serif; font-size: 10.5px; flex-shrink: 0; width: 56px; text-align: right; color: var(--gris); }
.stat-row-value.good { color: var(--vert); }
.stat-row-value.warn { color: #8a6d1a; }
.stat-row-value.bad { color: var(--rouge); }

/* ---- CONVENTION ARCOM ---- */
.arcom-slide-wrap { display: flex; overflow: visible; }
.arcom-slide { flex: 1; height: auto; display: flex; flex-direction: column; }
.arcom-score-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0 12px; flex-wrap: wrap; }
.arcom-score-value { font-family: 'Anton', sans-serif; font-size: 28px; color: var(--ink); line-height: 1; }
.arcom-status-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Anton', sans-serif; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px;
  padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--ink);
}
.arcom-status-excellent, .arcom-status-conforme { background: rgba(46,107,58,0.12); color: var(--vert); border-color: var(--vert); }
.arcom-status-vigilance { background: rgba(212,175,55,0.16); color: #8a6d1a; border-color: var(--gold); }
.arcom-status-manquements, .arcom-status-nonconforme { background: rgba(200,16,46,0.1); color: var(--rouge); border-color: var(--rouge); }
.arcom-obligations-mini { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; margin-top: 4px; }
.arcom-mini-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px; border-bottom: 1px dashed rgba(22,19,14,0.1); }
.arcom-mini-row:last-child { border-bottom: none; }
.arcom-mini-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.arcom-mini-dot.ok { background: var(--vert); }
.arcom-mini-dot.warn { background: var(--gold); }
.arcom-mini-dot.bad { background: var(--rouge); }
.arcom-mini-label { flex: 1; min-width: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
.arcom-mini-value { font-family: 'Anton', sans-serif; font-size: 10.5px; color: var(--gris); white-space: nowrap; }
.arcom-obligations-list { display: flex; flex-direction: column; gap: 9px; margin-top: 8px; }
.arcom-oblig-row { display: flex; align-items: center; gap: 8px; }
.arcom-oblig-info { flex: 1; min-width: 0; }
.arcom-oblig-label { font-size: 12.5px; margin-bottom: 3px; }
.arcom-oblig-bar-track { height: 5px; background: rgba(22,19,14,0.08); border-radius: 3px; overflow: hidden; }
.arcom-oblig-bar-fill { height: 100%; border-radius: 3px; }
.arcom-oblig-bar-fill.ok { background: var(--vert); }
.arcom-oblig-bar-fill.warn { background: var(--gold); }
.arcom-oblig-bar-fill.bad { background: var(--rouge); }
.arcom-oblig-value { font-family: 'Anton', sans-serif; font-size: 10.5px; color: var(--gris); white-space: nowrap; flex-shrink: 0; }
.arcom-violations-list { margin: 6px 0 0 0; padding-left: 18px; font-size: 13px; }
.arcom-violations-list li { margin-bottom: 4px; }
.arcom-severity-leger { color: #8a6d1a; font-weight: bold; }
.arcom-severity-significatif { color: #c07a1f; font-weight: bold; }
.arcom-severity-grave { color: var(--rouge); font-weight: bold; }
.arcom-hist-chart { display: flex; align-items: flex-end; gap: 8px; height: 130px; margin-top: 12px; padding-top: 18px; }
.arcom-hist-bar-wrap { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.arcom-hist-bar { width: 100%; max-width: 30px; border-radius: 3px 3px 0 0; position: relative; }
.arcom-hist-val { font-family: 'Anton', sans-serif; font-size: 9px; color: var(--ink); position: absolute; top: -14px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.arcom-hist-season { font-size: 9px; font-style: italic; color: var(--gris); margin-top: 4px; }
.arcom-hist-excellent, .arcom-hist-conforme { background: var(--vert); }
.arcom-hist-vigilance { background: var(--gold); }
.arcom-hist-manquements, .arcom-hist-nonconforme { background: var(--rouge); }
.arcom-view-btn {
  display: block; width: 100%; box-sizing: border-box; text-align: center; margin-top: 10px;
  background: transparent; border: 1.5px solid var(--ink); color: var(--ink);
  font-family: 'Anton', sans-serif; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 8px; border-radius: 10px; cursor: pointer;
}
.arcom-view-btn:hover { background: var(--ink); color: var(--paper); }
.bilan-title-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 4px;
}
.bilan-title-row h2 { margin: 0; }

/* ---- BILAN ÉCONOMIQUE DE SAISON ---- */
.eco-pos { color: var(--vert); }
.eco-neg { color: var(--rouge); }
.eco-hero {
  text-align: center; padding: 14px 0 18px; margin-bottom: 4px;
  border-bottom: 1px dashed rgba(22,19,14,0.15);
}
.eco-hero-value { font-family: 'Anton', sans-serif; font-size: 42px; line-height: 1; }
.eco-hero-label {
  font-size: 11px; font-style: italic; color: var(--gris); margin-top: 4px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.eco-flow { display: flex; flex-direction: column; gap: 14px; margin: 18px 0; }
.eco-flow-row { display: flex; align-items: center; gap: 10px; }
.eco-flow-label {
  flex: 0 0 96px; display: flex; align-items: center; gap: 5px;
  font-family: 'Anton', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
  color: var(--ink);
}
.eco-flow-bar-track { flex: 1; display: flex; height: 10px; background: rgba(22,19,14,0.08); border-radius: 5px; overflow: hidden; }
.eco-flow-bar-fill { height: 100%; transition: width 0.3s ease; }
.eco-flow-bar-fill.eco-flow-programmes { background: var(--rouge); }
.eco-flow-bar-fill.eco-flow-talents { background: var(--bleu); }
.eco-flow-bar-fill.eco-flow-revenu { background: var(--vert); }
.eco-flow-value {
  flex: 0 0 74px; text-align: right;
  font-family: 'Anton', sans-serif; font-size: 13px;
}
.eco-bilan-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 12px;
  margin-top: 18px; padding-top: 16px; border-top: 1px dashed rgba(22,19,14,0.15);
}
.eco-bilan-item { display: flex; flex-direction: column; gap: 3px; text-align: center; }
.eco-bilan-label {
  display: flex; align-items: center; justify-content: center; gap: 4px;

<script>
"use strict";

const BARS = ["#EAEAEA", "#F2E33B", "#3EC6C6", "#4CBB4C", "#D648C8", "#E8392F", "#2C3BD6"];

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(seededRandom() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const nf1 = n => n.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

function fmtDelta(val, decimals, suffix) {
  const sign = val > 0 ? '+' : (val < 0 ? '' : '±');
  const formatted = val.toLocaleString('fr-FR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return `${sign}${formatted}${suffix}`;
}

function renderEvolutionChart(points) {
  if (points.length < 2) {
    return `
      <div class="eh-title">Évolution de votre chaîne</div>
      <div class="eh-subtitle">Performance des principaux indicateurs sur les 5 dernières saisons</div>
      <div class="spark-empty">Graphique disponible après la saison 1</div>
    `;
  }
  const series = [
    { key: 'coutGrille', color: 'var(--gris)', icon: '📋', label: 'Coût de grille', suffix: ' M€' },
    { key: 'revenusPub', color: 'var(--vert)', icon: '📺', label: 'Revenus pub', suffix: ' M€' }
  ];
  const recentPoints = points.slice(-5);
  const w = 280, h = 215, padTop = 16, padSide = 6;
  const baseline = h - 20;
  const chartH = baseline - padTop;
  const n = recentPoints.length;
  const groupGap = 10;
  const barGap = 3;
  const groupW = (w - padSide * 2 - groupGap * (n - 1)) / n;
  const barW = (groupW - barGap) / 2;
  const max = Math.max(...recentPoints.flatMap(pt => series.map(s => pt[s.key])), 1);

  const barsHtml = recentPoints.map((pt, i) => {
    const groupX = padSide + i * (groupW + groupGap);
    const groupBars = series.map((s, si) => {
      const v = pt[s.key];
      const x = groupX + si * (barW + barGap);
      const barH = Math.max((v / max) * chartH, 2);
      const y = baseline - barH;
      return `
        <text x="${(x + barW / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="middle" font-family="'Anton', sans-serif" font-size="7.5" fill="var(--ink)">${nf1(v)}</text>
        <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${s.color}">
          <title>Saison ${pt.season} — ${s.label} : ${nf1(v)}${s.suffix}</title>
        </rect>
      `;
    }).join('');
    const seasonLabel = `<text x="${(groupX + groupW / 2).toFixed(1)}" y="${(baseline + 12).toFixed(1)}" text-anchor="middle" font-size="9" font-style="italic" fill="var(--gris)">Saison ${pt.season}</text>`;
    return groupBars + seasonLabel;
  }).join('');

  return `
    <div class="eh-title">Évolution de votre chaîne</div>
    <div class="eh-subtitle">Performance des principaux indicateurs sur les 5 dernières saisons</div>
    <div class="eh-legend">
      ${series.map(s => `<span class="eh-legend-item"><i style="background:${s.color}"></i>${s.icon} ${s.label}</span>`).join('')}
    </div>
    <svg class="eh-bar-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">${barsHtml}</svg>
  `;
}

function renderProgramGrid(type, pdaCible, overrides) {
  const grid = PROGRAM_GRID[type];
  const targetKey = gameState.player.target;
  const calculated = getCalculatedPDAs();

  const rows = TIME_SLOTS.map(slot => {
    const slotValue = pdaCible * SLOT_AFFINITY[type][slot.key];
    const competitorValues = calculated
      .filter(c => c.channel !== gameState.player)
      .map(c => c.pda[targetKey] * SLOT_AFFINITY[c.channel.type][slot.key]);
    const rank = 1 + competitorValues.filter(v => v > slotValue + 1e-9).length;
    const isLeaderSlot = rank === 1;
    const isKeySlot = slot.key === 'prime';
    const isUpdated = !!(overrides && overrides[slot.key]);
    const programme = isUpdated ? overrides[slot.key] : grid[slot.key];
    return `
      <details class="pg-slot-editor" data-slot-editor="${slot.key}">
      <summary class="pg-row${isKeySlot ? ' pg-row-key' : ''}" aria-label="Modifier le créneau ${slot.label}">
        <span class="pg-time-pill">${slot.range}</span>
        <span class="pg-info">
          <span class="pg-info-title">${slot.label}${isKeySlot ? '<span class="pg-key-tag">Clé</span>' : ''}</span>
          <span class="pg-info-program${isUpdated ? ' pg-program-updated' : ''}">${esc(programme)}${isUpdated ? ' <span class="pg-updated-badge" title="Programme modifié par vos choix éditoriaux">🆕</span>' : ''}</span>
        </span>
        <span class="pg-rank${isLeaderSlot ? ' pg-rank-leader' : ''}"${isLeaderSlot ? ' title="Leader sur ce créneau"' : ''}>#${rank}</span>
        <span class="pg-pda-badge pg-badge-${slot.accent}">${nf1(slotValue)}% PDA</span>
        <svg class="pg-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </summary>
      ${renderProgramManager(slot.key)}
      </details>
    `;
  }).join('');
  return `
    <div class="pg-slide">
      <div class="pg-head">
        <div class="eh-title">Grille de la chaîne</div>
        <div class="eh-subtitle">Cliquez sur un créneau pour choisir son programme et son talent.</div>
      </div>
      <div class="pg-rows">${rows}</div>
    </div>
  `;
}

function renderGlobalAudienceShare() {
  const activeKey = gameState.audienceShareTarget || gameState.player.target;
  const activeTarget = AUDIENCE_TARGETS.find(t => t.key === activeKey) || AUDIENCE_TARGETS[0];

  const calculated = getCalculatedPDAs();
  const playerCalc = calculated.find(item => item.channel === gameState.player);
  const playerValue = playerCalc.pda[activeTarget.key];

  const standings = calculated.map(item => ({
    name: item.channel === gameState.player ? item.name + ' (Vous)' : item.name,
    pda: item.pda[activeTarget.key],
    isPlayer: item.channel === gameState.player
  })).sort((a, b) => b.pda - a.pda);
  const max = Math.max(...standings.map(s => s.pda), 1);

  const strategicKey = gameState.player.target;
  const orderedTargets = [
    ...AUDIENCE_TARGETS.filter(t => t.key === strategicKey),
    ...AUDIENCE_TARGETS.filter(t => t.key !== strategicKey)
  ];
  const switcherHtml = orderedTargets.map(t => `
    <button class="ga-target-btn${t.key === activeTarget.key ? ' active' : ''}" data-audience-target="${t.key}">${t.short}</button>
  `).join('');

  const rows = standings.map((s, idx) => `
    <div class="ga-row${s.isPlayer ? ' ga-player' : ''}">
      <div class="ga-rank">#${idx + 1}</div>
      <div class="ga-info">
        <div class="ga-name">${esc(s.name)}</div>
        <div class="ga-bar-track"><div class="ga-bar-fill" style="width:${(s.pda / max * 100).toFixed(1)}%"></div></div>
      </div>
      <div class="ga-pct">${nf1(s.pda)}%</div>
    </div>
  `).join('');

  return `
    <div class="ga-panel" id="ga-panel">
      <div class="ga-header">
        <div class="eh-title">Part d'audience</div>
        <div class="ga-target-switcher">${switcherHtml}</div>
      </div>
      <div class="ga-headline">
        <div class="ga-headline-value">${nf1(playerValue)}%</div>
        <div class="ga-headline-label">${activeTarget.full}</div>
      </div>
      <div class="ga-rows">${rows}</div>
    </div>
  `;
}

function starRowHtml(filled) {
  return Array.from({ length: 5 }, (_, i) => `<span class="${i < filled ? 'star-filled' : 'star-empty'}">★</span>`).join('');
}

function renderStatStars(player, pdaCible, compliance) {
  const popFilled = Math.round((player.popularite / 100) * 5);
  const popClass = player.popularite >= 60 ? 'good' : (player.popularite >= 40 ? 'warn' : 'bad');

  const lower = 50;
  const upper = Math.max(player.coutGrilleEngageSaison * 5, lower + 1);
  let tresoFilled;
  if (player.tresorerie <= lower) tresoFilled = 1;
  else if (player.tresorerie >= upper) tresoFilled = 5;
  else tresoFilled = 1 + Math.round(((player.tresorerie - lower) / (upper - lower)) * 4);
  const tresoClass = player.tresorerie < 0 ? 'bad' : (tresoFilled >= 4 ? 'good' : 'warn');

  const perfLower = 0.05, perfUpper = 0.30;
  const efficacite = pdaCible / Math.max(player.coutGrilleEngageSaison, 0.01);
  let perfFilled;
  if (efficacite <= perfLower) perfFilled = 1;
  else if (efficacite >= perfUpper) perfFilled = 5;
  else perfFilled = 1 + Math.round(((efficacite - perfLower) / (perfUpper - perfLower)) * 4);
  const perfClass = perfFilled >= 4 ? 'good' : (perfFilled >= 2 ? 'warn' : 'bad');

  const arcomFilled = Math.round((compliance.arcomScore / 100) * 5);
  const arcomClass = compliance.arcomScore >= 75 ? 'good' : (compliance.arcomScore >= 60 ? 'warn' : 'bad');

  return `
    <div class="eh-title">Indicateurs de performance</div>
    <div class="eh-subtitle">Popularité, trésorerie, efficacité et conformité éditoriale</div>
    <div class="stat-list">
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">⭐</span>Popularité</div>
        <div class="stat-row-stars">${starRowHtml(popFilled)}</div>
        <div class="stat-row-value ${popClass}">${Math.round(player.popularite)}%</div>
      </div>
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">💰</span>Trésorerie</div>
        <div class="stat-row-stars">${starRowHtml(tresoFilled)}</div>
        <div class="stat-row-value ${tresoClass}">${nf1(player.tresorerie)} M€</div>
      </div>
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">📈</span>Performance</div>
        <div class="stat-row-stars">${starRowHtml(perfFilled)}</div>
        <div class="stat-row-value ${perfClass}">${Math.round(efficacite * 100)}%</div>
      </div>
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">⚖️</span>Conformité</div>
        <div class="stat-row-stars">${starRowHtml(arcomFilled)}</div>
        <div class="stat-row-value ${arcomClass}">${compliance.arcomScore}/100</div>
      </div>
    </div>
  `;
}

function computeAttractivite(popularite) {
  return 1 + (popularite - 50) / 200;
}

function computeRevenusPubSaison(pdaMoyenneSaison, cible, popularite, puissanceCommerciale) {
  return pdaMoyenneSaison * GRP_COST[cible] * VOLUME_PUB * computeAttractivite(popularite) * puissanceCommerciale;
}

function computeNextBudgetGrille(player) {
  // baseBudget est le capital de départ de la chaîne. La grille de départ est
  // calibrée à 30 % de ce capital : conserver ce même socle évite un saut de
  // 15 M€ à 50 M€ entre les saisons 1 et 2.
  const capitalInitial = CHANNEL_TYPES[player.type].baseBudget;
  const base = capitalInitial * 0.30;
  const bonusTresorerie = Math.max(0, (player.tresorerie - capitalInitial) * 0.12);
  const bonusPerformance = Math.max(0, player.rentabiliteGrille * 0.08);
  const raw = base + bonusTresorerie + bonusPerformance;
  return Math.max(base * 0.5, Math.min(raw, base * 2.5));
}

// pour une chaîne Sport, seuls ceux-ci sont piochés parmi les dilemmes universels, en plus des
// dilemmes réservés au type 'sport'. Les autres types de chaîne continuent de voir tous les

const SPORT_RELATED_UNIVERSAL_IDS = ['d2', 'd6', 'd14', 'd20', 'd42', 'd65', 'd66', 'd72'];

function getEligibleDilemmas() {
  const type = gameState.player.type;
  return DILEMMA_BANK.filter(d => {
    if (d.types) return d.types.includes(type);
    if (type === 'sport') return SPORT_RELATED_UNIVERSAL_IDS.includes(d.id);
    return true;
  });
}

function pickDilemmaQueue() {
  const pool = getEligibleDilemmas();
  const available = pool.filter(d => !gameState.seenDilemmaIds.includes(d.id));
  let queue = shuffle(available).slice(0, 4);
  if (queue.length < 4) {
    gameState.seenDilemmaIds = [];
    const usedIds = new Set(queue.map(d => d.id));
    const remainingPool = pool.filter(d => !usedIds.has(d.id));
    queue = queue.concat(shuffle(remainingPool).slice(0, 4 - queue.length));
  }
  gameState.seenDilemmaIds.push(...queue.map(d => d.id));
  ensureCampaign();
  const event = STORY_EVENTS.find(e=>e.eligible(gameState.player)&&!gameState.player.eventsSeen.includes(e.id));
  if(event) { queue[queue.length-1]=event; gameState.player.eventsSeen.push(event.id); }
  return queue;
}

function initCompetitors() {
  const availableNames = FICTIONAL_CHANNEL_NAMES.filter(n => n.toLowerCase() !== gameState.player.name.toLowerCase());
  const names = shuffle(availableNames).slice(0, 5);
  const types = Object.keys(CHANNEL_TYPES);
  const targets = Object.keys(TARGET_STRATEGIES);

  gameState.competitors = names.map((name, i) => {
    const cType = types[i % types.length];
    let cTarget = (i < 2) ? gameState.player.target : targets[(i + 1) % targets.length];
    const basePda = { ...CHANNEL_TYPES[cType].pdaMods };

    return {
      name,
      type: cType,
      target: cTarget,
      budget: CHANNEL_TYPES[cType].baseBudget,
      pda: basePda
    };
  });
}

function getAllChannels() {
  return [gameState.player, ...gameState.competitors];
}

function getCalculatedPDAs() {
  const channels = getAllChannels();
  const demos = ['j1524', 'a2549', 's50', 'csp'];
  
  const demoTotals = {};
  demos.forEach(d => {
    demoTotals[d] = channels.reduce((sum, c) => sum + Math.max(0.1, c.pda[d] + contractBoost(c,d)), 0);
  });

  return channels.map(c => {
    const normPda = {};
    let sumNorm = 0;
    demos.forEach(d => {
      normPda[d] = (Math.max(0.1, c.pda[d] + contractBoost(c,d)) / demoTotals[d]) * 100;
      sumNorm += normPda[d];
    });
    
    return {
      channel: c,
      name: c.name,
      pda: normPda,
      globalPda: sumNorm / 4
    };
  });
}

function resetSeasonEditoMix() {
  const base = EDITO_BASE[gameState.player.type];
  gameState.player.editoMix = { ...base };

}

function applyDilemmaEditoImpact(dilemma, choiceIndex, choice) {
  const player = gameState.player;
  const tags = DILEMMA_FLAVOR[dilemma.id];
  const impact = tags ? tags[choiceIndex] : null;
  if (impact) {
    EDITO_CATEGORIES.forEach(cat => {
      if (impact[cat]) {
        player.editoMix[cat] = Math.max(0, Math.min(100, player.editoMix[cat] + impact[cat]));
      }
    });
    if (impact.discipline && !player.sportDisciplinesSeen.includes(impact.discipline)) {
      player.sportDisciplinesSeen.push(impact.discipline);
    }
  }
  const spend = choice.finance.purchase + Math.max(0, choice.finance.recurring);
  if (spend > 0) {
    player.seasonTotalSpend += spend;
    if (impact && impact.creation > 0) {
      player.seasonCreationSpend += spend;
    }
  }
}

function computeObligationActual(ob, editoMix, player) {
  const calc = ob.calc;
  if (calc.cat) {
    const val = editoMix[calc.cat] || 0;
    return calc.factor ? val * calc.factor : val;
  }
  if (calc.composite) {
    const sum = calc.composite.reduce((s, c) => s + (editoMix[c] || 0), 0);
    return sum / calc.composite.length;
  }
  if (calc.special === 'investCreation') {
    return player.seasonTotalSpend > 0 ? (player.seasonCreationSpend / player.seasonTotalSpend) * 100 : 0;
  }
  if (calc.special === 'sportDisciplines') {
    return player.sportDisciplinesSeen.length;
  }
  return 0;
}

function obligationScoreFromRate(rate) {
  if (rate >= 1) return 100;
  if (rate >= 0.9) return 80 + (rate - 0.9) / 0.1 * 20;
  if (rate >= 0.75) return 50 + (rate - 0.75) / 0.15 * 30;
  return Math.max(0, rate / 0.75 * 50);
}

function getArcomStatusMeta(score) {
  if (score >= 90) return { key: 'excellent', label: 'EXCELLENT', emoji: '🟢' };
  if (score >= 75) return { key: 'conforme', label: 'CONFORME', emoji: '🟢' };
  if (score >= 60) return { key: 'vigilance', label: 'VIGILANCE', emoji: '🟠' };
  if (score >= 40) return { key: 'manquements', label: 'MANQUEMENTS', emoji: '🔴' };
  return { key: 'nonconforme', label: 'NON-CONFORME', emoji: '⛔' };
}

function computeArcomCompliance() {
  const player = gameState.player;
  const convention = ARCOM_CONVENTIONS[player.type];
  const editoMix = player.editoMix;

  const rawValues = convention.obligations.map(ob => computeObligationActual(ob, editoMix, player));

  let weightedSum = 0, weightTotal = 0;
  const obligations = convention.obligations.map((ob, i) => {
    // Chaque obligation a son propre dénominateur (antenne, création, etc.).
    const actualValue = rawValues[i];
    const rate = ob.minimum > 0 ? actualValue / ob.minimum : 1;
    const score = obligationScoreFromRate(rate);
    weightedSum += score * ob.weight;
    weightTotal += ob.weight;
    return { ...ob, actualValue, rate, score, compliant: rate >= 1 };
  });
  const arcomScore = Math.round(weightTotal > 0 ? weightedSum / weightTotal : 100);
  return { obligations, arcomScore, status: getArcomStatusMeta(arcomScore) };
}

function pushArcomSeasonResult() {
  const player = gameState.player;
  const soldeAvant = player.tresorerie;
  const compliance = computeArcomCompliance();
  player.arcomHistory.push({
    season: gameState.season,
    score: compliance.arcomScore,
    status: compliance.status.key,
    violations: compliance.obligations.filter(o => o.rate < 1).length
  });
  compliance.obligations.forEach(ob => {
    if (ob.rate < 0.75) {
      player.arcomViolations.push({ season: gameState.season, obligation: ob.id, label: ob.label, severity: 'grave', penalty: 6, weight: ob.weight });
    } else if (ob.rate < 0.9) {
      player.arcomViolations.push({ season: gameState.season, obligation: ob.id, label: ob.label, severity: 'significatif', penalty: 3, weight: ob.weight });
    } else if (ob.rate < 1) {
      player.arcomViolations.push({ season: gameState.season, obligation: ob.id, label: ob.label, severity: 'leger', penalty: 1, weight: ob.weight });
    }
  });
  const tier = compliance.status.key;
  if (tier === 'excellent') {
    player.popularite = Math.min(100, player.popularite + 1);
    player.tresorerie += 1;
  } else if (tier === 'manquements') {
    player.tresorerie -= 3;
    player.popularite = Math.max(0, player.popularite - 2);
    player.arcomSanctionsCount++;
  } else if (tier === 'nonconforme') {
    player.tresorerie -= 8;
    player.popularite = Math.max(0, player.popularite - 5);
    player.arcomSanctionsCount++;
  }
  player.fluxArcomSaison = player.tresorerie - soldeAvant;
  player.lastArcomResult = compliance;
  return compliance;
}

function computeRenewalScore() {
  const player = gameState.player;
  const recent = player.arcomHistory.slice(-CONVENTION_DURATION);
  const complianceAverage = recent.length ? recent.reduce((s, h) => s + h.score, 0) / recent.length : 100;
  const graveWeightSum = player.arcomViolations
    .filter(v => v.severity === 'grave' && v.season > gameState.season - CONVENTION_DURATION)
    .reduce((sum, v) => sum + (v.weight || 5), 0);
  const graveWeightPerSeason = graveWeightSum / Math.max(1, recent.length);
  const violationScore = Math.max(0, 100 - graveWeightPerSeason * 8);
  const obligationsNow = player.lastArcomResult ? player.lastArcomResult.obligations : [];
  const diversityScore = obligationsNow.length ? Math.round(obligationsNow.reduce((s, o) => s + o.score, 0) / obligationsNow.length) : 100;
  const creationInvestmentScore = Math.min(100, Math.round((player.editoMix.creation || 0) / 12 * 100));
  const sanctionHistoryScore = Math.max(0, 100 - player.arcomSanctionsCount * 15);
  const renewalScore = Math.round(
    complianceAverage * 0.40 +
    violationScore * 0.25 +
    diversityScore * 0.15 +
    creationInvestmentScore * 0.10 +
    sanctionHistoryScore * 0.10
  );
  return { renewalScore, complianceAverage, violationScore, diversityScore, creationInvestmentScore, sanctionHistoryScore };
}

function getRenewalOutcome(score) {
  if (score >= 80) return { key: 'renewed', emoji: '🟢', title: 'CONVENTION RENOUVELÉE', message: "Votre chaîne respecte durablement les engagements de sa convention. L'autorisation est renouvelée." };
  if (score >= 65) return { key: 'conditional', emoji: '🟠', title: 'CONVENTION RENOUVELÉE SOUS CONDITIONS', message: "L'ARCOM renouvelle votre convention sous réserve d'un plan de redressement." };
  if (score >= 50) return { key: 'watch', emoji: '🟠', title: 'RENOUVELLEMENT SOUS SURVEILLANCE', message: "La chaîne conserve son autorisation mais fait l'objet d'un contrôle renforcé." };
  return { key: 'refused', emoji: '⛔', title: 'RENOUVELLEMENT REFUSÉ', message: "L'ARCOM refuse de renouveler votre autorisation d'émettre." };
}

function chooseDilemmaOption(choiceIndex) {
  if (gameState.step !== 6 || gameState.dilemmaPhase !== 'choosing') return;
  const dilemma = gameState.dilemmaQueue[gameState.currentDilemmaIndex];
  if (!dilemma || !Number.isInteger(choiceIndex) || !dilemma.c[choiceIndex]) return;
  const choice = dilemma.c[choiceIndex];
  ensureCampaign();
  const player = gameState.player;
  const popAvant = player.popularite;

  applyDilemmaEditoImpact(dilemma, choiceIndex, choice);

  const decisionQuote = quoteDilemma(choice);

  const pdaCibleAvant = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];

  for (const t in choice.pda) {
    let delta = choice.pda[t];
    if (popAvant < 25 && delta < 0) delta *= 1.5;
    if (popAvant > 75 && delta > 0) delta *= 1.25;
    player.pda[t] = Math.max(0.1, player.pda[t] + delta);
  }

  strategicCompetitors();

  // À partir de la saison 2, la grille est provisionnée à l'ouverture. Les choix
  // ajustent ensuite immédiatement la trésorerie ; en saison 1, seul le surcoût
  // ou l'économie lié au choix affecte le capital de lancement.
  // Les flux sont explicites. Les économies respectent les contrats actifs ;
  // un remplacement inclut l'indemnité et retire l'ancien engagement annuel.
  if (choice.grille) delete player.contracts[choice.grille.slot];
  const coutGrilleDelta = applyFinance(decisionQuote.finance);
  if (choice.grille) {
    const slot=choice.grille.slot;
    const annual=Math.max(0,choice.finance.recurring);
    player.contracts[slot]={id:'editorial-'+dilemma.id+'-'+choiceIndex, name:choice.grille.programme,
      annual, talent:'Équipe du programme', talentAnnual:0, power:0,
      target:player.target, end:gameState.season, source:'dilemma'};
    player.coutTalentsSaison=Math.max(0,player.coutTalentsSaison-decisionQuote.replacedTalent);
    player.grilleOverrides[slot]=choice.grille.programme;
  }
  player.decisionHistory.push({id:dilemma.id, choice:choiceIndex, season:gameState.season, ...decisionQuote.finance});
  const talentCost = DILEMMA_TALENT_COST[dilemma.id];
  if (talentCost) {
    player.coutTalentsSaison += talentCost[choiceIndex];
  }
  player.popularite = Math.max(0, Math.min(100, player.popularite + choice.pop));

  const pdaCibleApres = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];
  player.pdaHistorySeason.push(pdaCibleApres);
  player.pdaMoyenneSaison = player.pdaHistorySeason.reduce((s, v) => s + v, 0) / player.pdaHistorySeason.length;
  player.pdaFinSaison = pdaCibleApres;

  // Les revenus publicitaires sont réestimés à chaque dilemme à partir de la PDA moyenne de la
  // saison, et l'écart avec l'estimation précédente est immédiatement crédité à la trésorerie :
  // pas d'attente du bilan de fin de saison, l'ajustement est en temps réel.
  const revenusPubAvant = player.revenusPubPrevisionnels;
  player.revenusPubPrevisionnels = computeRevenusPubSaison(player.pdaMoyenneSaison, player.target, player.popularite, player.puissanceCommerciale);
  const revenusPubDelta = player.revenusPubPrevisionnels - revenusPubAvant;
  // Le flux net de trésorerie est bien la recette publicitaire moins la variation
  // de coût de grille : un surcoût (delta positif) réduit le solde, une économie
  // (delta négatif) l'augmente.
  const tresorerieDelta = revenusPubDelta - coutGrilleDelta - decisionQuote.finance.purchase + decisionQuote.finance.commercial;
  player.tresorerie += revenusPubDelta;

  // Rentabilité grille et coût/PDA sont recalculés en temps réel à chaque dilemme,
  // à partir des valeurs courantes de la saison (pas seulement au bilan de fin de saison).
  player.rentabiliteGrille = player.coutGrilleEngageSaison > 0 ? (player.revenusPubPrevisionnels / player.coutGrilleEngageSaison - 1) * 100 : 0;
  player.coutParPointPDA = player.pdaMoyenneSaison > 0 ? player.coutGrilleEngageSaison / player.pdaMoyenneSaison : 0;
  refreshEconomy();

  gameState.lastConsequence = {
    titre: dilemma.titre,
    choixLabel: choice.l,
    resultat: choice.r,
    deltas: {
      tresorerie: tresorerieDelta,
      pdaCible: pdaCibleApres - pdaCibleAvant,
      coutGrille: coutGrilleDelta,
      achats: decisionQuote.finance.purchase,
      commercial: choice.finance.commercial,
      revenusPub: revenusPubDelta,
      popularite: player.popularite - popAvant
    }
  };

  gameState.logs.push({
    title: dilemma.titre,
    result: choice.r
  });

  gameState.currentDilemmaIndex++;

  if (player.tresorerie < TRESORERIE_CRITIQUE) {
    gameState.pendingNextStep = 8;
    gameState.gameOverReason = 'tresorerie';
  } else if (gameState.currentDilemmaIndex >= gameState.dilemmaQueue.length) {
    // Finalisation économique de la saison : les revenus pub et les ajustements de
    // grille ont déjà été comptabilisés en temps réel ; on fige les montants ici.
    player.revenusPubFinals = player.revenusPubPrevisionnels;
    // Les recettes sont déjà encaissées au fil des réestimations ; ce compteur
    // conserve en revanche le total historique des saisons clôturées.
    player.revenusPubCumul += player.revenusPubFinals;
    player.resultatSaison = player.revenusPubFinals - player.coutGrilleEngageSaison;
    player.coutGrilleCumul += player.coutGrilleEngageSaison;
    player.rentabiliteGrille = player.coutGrilleEngageSaison > 0 ? (player.revenusPubFinals / player.coutGrilleEngageSaison - 1) * 100 : 0;
    player.coutParPointPDA = player.pdaMoyenneSaison > 0 ? player.coutGrilleEngageSaison / player.pdaMoyenneSaison : 0;

    refreshEconomy();
    if (player.pdaFinSaison > player.pdaMoyenneSaison && player.popularite >= 60) {
      player.puissanceCommerciale = Math.min(1.15, player.puissanceCommerciale + 0.01);
    } else if (player.pdaFinSaison < player.pdaMoyenneSaison * 0.9 || player.popularite < 40) {
      player.puissanceCommerciale = Math.max(0.85, player.puissanceCommerciale - 0.01);
    }

    gameState.history.push({
      season: gameState.season,
      tresorerie: player.tresorerie,
      pdaCible: pdaCibleApres,
      coutGrille: player.coutGrilleEngageSaison,
      revenusPub: player.revenusPubFinals,
      popularite: player.popularite,
      tresorerieDebut: player.tresorerieDebutSaison,
      budgetGrille: player.budgetGrilleAnnuel,
      coutGrilleSaison: player.coutGrilleEngageSaison,
      pdaMoyenne: player.pdaMoyenneSaison,
      pdaFin: player.pdaFinSaison,
      revenusPubSaison: player.revenusPubFinals,
      resultatSaison: player.resultatSaison,
      tresorerieFin: player.tresorerie,
      rentabiliteGrille: player.rentabiliteGrille
    });
    pushArcomSeasonResult();
    // Les bonus/malus ARCOM sont des flux de clôture : l'historique doit refléter
    // le solde final après leur application.
    gameState.history[gameState.history.length - 1].tresorerie = player.tresorerie;
    gameState.history[gameState.history.length - 1].tresorerieFin = player.tresorerie;
    gameState.history[gameState.history.length - 1].fluxArcom = player.fluxArcomSaison;
    gameState.history[gameState.history.length - 1].popularite = player.popularite;
    gameState.lastConsequence.deltas.tresorerie += player.fluxArcomSaison;
    gameState.lastConsequence.deltas.popularite = player.popularite - popAvant;
    closeCampaignSeason();
    gameState.renewalDue = gameState.season % CONVENTION_DURATION === 0;
    if (player.tresorerie < TRESORERIE_CRITIQUE) {
      gameState.pendingNextStep = 8;
      gameState.gameOverReason = 'tresorerie';
    } else {
      gameState.pendingNextStep = 7;
    }
  } else {
    gameState.pendingNextStep = 6;
  }
  gameState.dilemmaPhase = 'result';

  render();
}

function continueAfterConsequence() {
  if (gameState.dilemmaPhase !== 'result' || gameState.pendingNextStep === null) return;
  gameState.step = gameState.pendingNextStep;
  gameState.pendingNextStep = null;
  gameState.dilemmaPhase = 'choosing';
  render();
}

function startNewSeason() {
  if (!gameState.history.some(h => h.season === gameState.season)) return;
  const player = gameState.player;
  gameState.season++;
  expireContracts();
  gameState.currentDilemmaIndex = 0;
  gameState.dilemmaQueue = pickDilemmaQueue();
  gameState.dilemmaPhase = 'choosing';
  gameState.renewalDue = false;

  // La nouvelle saison repart du coût de grille réellement arrêté à la fin de la
  // précédente ; il n'est donc pas recalculé ni remis à un budget théorique.
  player.budgetGrilleAnnuel = player.coutGrilleEngageSaison;
  player.tresorerieDebutSaison = player.tresorerie;
  // Le budget de grille est annuel : il revient chaque saison comme coût fixe de départ,
  // que les dilemmes de la saison viendront ensuite ajuster à la hausse ou à la baisse.
  // Il n'alimente le cumul qu'une fois la saison effectivement clôturée.
  player.coutGrilleEngageSaison = player.budgetGrilleAnnuel;
  player.tresorerie -= player.coutGrilleEngageSaison;
  player.revenusPubPrevisionnels = 0;
  player.revenusPubFinals = 0;
  player.resultatSaison = 0;
  player.coutTalentsSaison = 0;
  player.fluxArcomSaison = 0;
  player.commercialSaison = 0;
  player.achatsSaison = 0;
  player.coutTalentsSaison = Object.values(player.contracts).reduce((sum,c)=>sum+c.talentAnnual,0);
  player.lastArcomResult = null;
  player.rentabiliteGrille = player.coutGrilleEngageSaison > 0 ? -100 : 0;
  const seedPdaCible = getCalculatedPDAs().find(item => item.channel === player).pda[player.target];
  player.pdaHistorySeason = [seedPdaCible];
  player.pdaMoyenneSaison = seedPdaCible;
  player.pdaFinSaison = seedPdaCible;
  // Les cumuls historiques ne sont jamais remis à zéro ; seuls les prévisionnels
  // de la nouvelle saison repartent de zéro.
  resetSeasonEditoMix();
  player.coutParPointPDA = seedPdaCible > 0 ? player.coutGrilleEngageSaison / seedPdaCible : 0;
  gameState.step = player.tresorerie < TRESORERIE_CRITIQUE ? 8 : 6;
  if (gameState.step === 8) gameState.gameOverReason = 'tresorerie';
  render();
}

function goHome() {
  if (gameState.step >= 2) {
    gameState.resumeStep = gameState.step;
  }
  gameState.step = 1;
  render();
}

function resetGame() {
  delete gameState.campaign;
  delete gameState.expiredPrograms;
  gameState.step = 1;
  gameState.resumeStep = null;
  gameState.player = {
    name: "",
    type: "generaliste",
    target: "a2549",
    tresorerie: 50,
    coutGrilleCumul: 0,
    revenusPubCumul: 0,
    popularite: 50,
    pda: { j1524: 0.3, a2549: 1.0, s50: 0.3, csp: 0.3 },
    editoMix: {},

    sportDisciplinesSeen: [],

    puissanceCommerciale: 1,
    tresorerieDebutSaison: 50,
    resultatSaison: 0,
    rentabiliteGrille: 0,
    coutParPointPDA: 0,
    coutTalentsSaison: 0
};
  gameState.competitors = [];
  gameState.season = 1;
  gameState.currentDilemmaIndex = 0;

  gameState.dilemmaPhase = 'choosing';
  gameState.logs = [];

  render();
}

}

function renderTicker() {
  const p = gameState.player;
  const calculated = getCalculatedPDAs();
  const playerCalc = calculated.find(item => item.channel === p);
  const pdaCible = playerCalc.pda[p.target];
  const open = !!gameState.hudExpanded;

  // La trésorerie du HUD reflète le cash réellement disponible : à partir de la
  // saison 2, la grille est provisionnée à l'ouverture ; les ajustements et
  // revenus pub sont comptabilisés au fil des dilemmes.
  const tresorerieLive = p.tresorerie;

  const lastHistorySeason = gameState.history.length ? gameState.history[gameState.history.length - 1].season : null;
  const currentPoint = {
    season: gameState.season, tresorerie: p.tresorerie, pdaCible,
    coutGrille: p.coutGrilleEngageSaison, revenusPub: p.revenusPubPrevisionnels,
    popularite: p.popularite

  const globalAudienceShareHtml = renderGlobalAudienceShare();
  const evolutionChartHtml = renderEvolutionChart(chartPoints);
  const compliance = computeArcomCompliance();

          <div class="hud-cell">
            <div class="lab"><span class="ic">📺</span>Revenus pub</div>
            <div class="val">${nf1(p.revenusPubPrevisionnels)} M€</div>
          </div>
          <div class="hud-cell">
            <div class="lab"><span class="ic">⭐</span>Popularité</div>
            <div class="val">${Math.round(p.popularite)}%</div>

      if (e.target.closest('button, select, input, label, summary, .program-manager')) return;

      dragDeltaX = 0;
      ehTrack.style.transition = 'none';

      render();
    };

    return;
  }

  if (gameState.step === 10) {
    const player = gameState.player;
    const renewal = computeRenewalScore();
    const outcome = getRenewalOutcome(renewal.renewalScore);
    const calculated = getCalculatedPDAs();
    const playerCalc = calculated.find(c => c.channel === player);
    const pdaMoyenne = playerCalc.globalPda;
    const gravesRecents = player.arcomViolations.filter(v => v.severity === 'grave' && v.season > gameState.season - CONVENTION_DURATION).length;

    app.innerHTML = `
      ${renderMasthead("Renouvellement de convention", "Audience Masters")}
      <div class="card">

          <li>Sanctions cumulées : ${player.arcomSanctionsCount}</li>
        </ul>
      </div>
      <button class="btn block" id="btn-renewal-continue" style="font-size: 17px; padding: 14px;">${outcome.key === 'refused' ? 'Voir le bilan final →' : 'Continuer →'}</button>
    `;
    document.getElementById('btn-renewal-continue').onclick = () => {
      if (outcome.key === 'refused') {

        gameState.step = 8;
        render();
      } else {
        startNewSeason();
      }
    };
    return;
  }
}

}
function closeCampaignSeason() {
  refreshEconomy(); const p=gameState.player, h=gameState.history.at(-1);
  h.resultatSaison=p.resultatSaison; h.commercial=p.commercialSaison; h.achats=p.achatsSaison;
  h.rentabiliteGrille=p.rentabiliteGrille;
  h.contracts=JSON.parse(JSON.stringify(p.contracts));
  gameState.competitors.forEach(c=>{c.budget+=Math.max(1,c.pda[c.target]*0.4);});
  if(gameState.campaign.status==='active' && gameState.season>=gameState.campaign.deadline) {
    const authorized=getRenewalOutcome(computeRenewalScore().renewalScore).key!=='refused';
    gameState.campaign.status=campaignProgress().filter(x=>x.done).length>=2 && authorized && p.tresorerie>=TRESORERIE_CRITIQUE?'won':'lost';
  }
}
function renderProgramManager(slot) {
  ensureCampaign(); const p=gameState.player;
  const editable=gameState.step===6&&gameState.dilemmaPhase==='choosing'&&gameState.currentDilemmaIndex===0;
  const c=p.contracts[slot];
  const programOpts=availablePrograms(p.type,slot).map(x=>({
    id:x.id,
    label:`${x.name} — ${nf1(x.annual)} M€/an + ${nf1(x.rights)} M€ droits · ${nf1(x.power)} pts PDA · ${x.years} saison(s)`,
    selected:c?.id===x.id
  }));
  const talentOpts=TALENT_CATALOG.map(x=>({id:x.id,label:`${x.name} — ${nf1(x.annual)} M€/an`,selected:c?.talent===x.name}));
  const selectedProgram=programOpts.find(o=>o.selected)||programOpts[0];
  const selectedTalent=talentOpts.find(o=>o.selected)||talentOpts[0];
  return `<section class="program-manager" aria-label="Modifier la programmation">
    ${c?`<div class="program-manager-contract-row">
      <p class="program-manager-contract">${esc(c.name)} · ${esc(c.talent)} · ${nf1(c.annual)} M€/an · jusqu’à la saison ${c.end}.</p>
      <span class="pg-pda-badge pg-badge-rouge program-manager-penalty" data-program-penalty aria-live="polite" hidden></span>
    </div>`:''}
    ${editable?`
    <div class="program-manager-row" data-program-editor="${slot}">
      <label class="program-manager-field programme">
        <span class="program-manager-field-label">Programme</span>
        <select id="program-${slot}">${programOpts.map(o=>`<option value="${o.id}" ${o.selected?'selected':''}>${esc(o.label)}</option>`).join('')}</select>
        <button type="button" class="program-manager-field-trigger" data-picker-trigger="program-${slot}" data-picker-title="Choisir un programme">
          <span class="program-manager-field-trigger-text">${esc(selectedProgram.label)}</span>
          <svg class="pg-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </label>
      <div class="program-manager-combo">
        <label class="program-manager-field talent">
          <span class="program-manager-field-label">Talent</span>
          <select id="talent-${slot}">${talentOpts.map(o=>`<option value="${o.id}" ${o.selected?'selected':''}>${esc(o.label)}</option>`).join('')}</select>
          <button type="button" class="program-manager-field-trigger" data-picker-trigger="talent-${slot}" data-picker-title="Choisir un talent">
            <span class="program-manager-field-trigger-text">${esc(selectedTalent.label)}</span>
            <svg class="pg-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </label>
        <div class="program-manager-actions" aria-label="Valider ou annuler">
          <span class="program-manager-field-label program-manager-actions-spacer" aria-hidden="true">&nbsp;</span>
          <div class="program-manager-actions-buttons">
            <button type="button" class="program-manager-box cancel" data-program-cancel>Annuler</button>
            <button type="button" class="program-manager-box confirm" data-program-confirm title="Valider la combinaison programme et talent">Valider</button>
          </div>
        </div>
      </div>
    </div>
    <span class="program-manager-feedback" aria-live="polite"></span>`:'<p class="program-manager-note">Modifications disponibles au début de la prochaine saison, avant le premier dilemme.</p>'}
    </section>`;
}
function renderCampaignPanel() {
  return '';
}
function ensureMobilePickerSheet() {
  let sheet=document.getElementById('mobile-picker-sheet');
  if(sheet) return sheet;
  sheet=document.createElement('div');
  sheet.id='mobile-picker-sheet';
  sheet.className='mobile-picker-sheet';
  sheet.setAttribute('aria-hidden','true');
  sheet.innerHTML=`
    <div class="mobile-picker-backdrop" data-picker-close></div>
    <div class="mobile-picker-panel" role="dialog" aria-modal="true">
      <div class="mobile-picker-handle"></div>
      <div class="mobile-picker-header">
        <span class="mobile-picker-title"></span>
        <button type="button" class="mobile-picker-close" data-picker-close aria-label="Fermer">✕</button>
      </div>
      <div class="mobile-picker-list"></div>
    </div>`;
  document.body.appendChild(sheet);
  sheet.querySelectorAll('[data-picker-close]').forEach(el=>el.addEventListener('click', closeMobilePicker));
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMobilePicker(); });
  return sheet;
}
function openMobilePicker(select, trigger, title) {
  const sheet=ensureMobilePickerSheet();
  sheet.querySelector('.mobile-picker-title').textContent=title||'';
  const list=sheet.querySelector('.mobile-picker-list');
  list.innerHTML='';
  Array.from(select.options).forEach(opt=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='mobile-picker-option'+(opt.value===select.value?' selected':'');
    btn.innerHTML=`<span>${esc(opt.textContent)}</span><svg class="mobile-picker-option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    btn.onclick=()=>{
      select.value=opt.value;
      select.dispatchEvent(new Event('change', {bubbles:true}));
      const textEl=trigger.querySelector('.program-manager-field-trigger-text');
      if(textEl) textEl.textContent=opt.textContent;
      closeMobilePicker();
    };
    list.appendChild(btn);
  });
  sheet.classList.add('open');
  sheet.setAttribute('aria-hidden','false');
  document.body.classList.add('mobile-picker-lock');
}
function closeMobilePicker() {
  const sheet=document.getElementById('mobile-picker-sheet');
  if(!sheet) return;
  sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden','true');
  document.body.classList.remove('mobile-picker-lock');
}
function bindCampaignPanel(app) {
  app.querySelectorAll('[data-picker-trigger]').forEach(trigger=>{
    trigger.onclick=()=>{
      const select=document.getElementById(trigger.dataset.pickerTrigger);
      if(select) openMobilePicker(select, trigger, trigger.dataset.pickerTitle);
    };
  });
  app.querySelectorAll('[data-program-editor]').forEach(editor=>{
    const slot=editor.dataset.programEditor;
    const manager=editor.closest('.program-manager');
    const feedback=manager.querySelector('.program-manager-feedback');
    const updateValidation=()=>{
      const q=quoteProgram(slot,document.getElementById('program-'+slot).value,document.getElementById('talent-'+slot).value);
      const confirm=editor.querySelector('[data-program-confirm]');
      confirm.disabled=!q?.allowed;
      const penalty=manager.querySelector('[data-program-penalty]');
      const replacing=!!q && !q.unchanged && !!gameState.player.contracts[slot];
      if(penalty) {
        penalty.hidden=!replacing;
        penalty.textContent=replacing?`Pénalité de remplacement : ${nf1(q.termination)} M€`:'';
      }
    };
    editor.querySelectorAll('select').forEach(select=>select.onchange=()=>{
      feedback.textContent=''; updateValidation();
    });
    updateValidation();
    editor.querySelector('[data-program-confirm]').onclick=()=>{
      feedback.textContent='';
      if(!signProgram(slot,document.getElementById('program-'+slot).value,document.getElementById('talent-'+slot).value)) {
        feedback.textContent='Validation impossible : budget insuffisant ou contrat inchangé.';
      }
    };
    editor.querySelector('[data-program-cancel]').onclick=()=>{
      feedback.textContent='';
      const details=editor.closest('.pg-slot-editor');
      if(details) details.open=false;
    };
  });
}
</script>
