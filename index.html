// Métadonnées de simulation : les titres génériques ont une origine non précisée.
// Une acquisition de catalogue ne constitue pas un investissement de création.
function programEditorialProfile(program) {
  const name = program.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const type = program.channelType;
  let genre = ({fiction:'fiction',documentaire:'culture',animation:'jeunesse',sport:'sport',
    divertissement:'diverti',jeu:'diverti',magazine:'diverti'})[program.format]
    || ({cinema:'fiction',culture:'culture',jeunesse:'jeunesse',sport:'sport',info:'info'})[type] || 'diverti';
  if (/serie|film|fiction|sitcom|feuilleton|thriller|comedie|saga/.test(name)) genre='fiction';
  if (/documentaire|patrimoine|theatre|opera|concert|ballet|archeologie|sciences|beaux-arts|musique classique/.test(name)) genre='culture';
  if (/magazine|making-of|coulisses|portrait|interview|debat|entretien/.test(name)) genre=type==='cinema'||type==='culture'?'culture':type==='sport'?'sport':'info';
  if (/jeu|quiz|dating|realite|show|concours/.test(name)) genre='diverti';
  if (type==='info' || /matinale info|journal|actualite|reportage|enquete/.test(name)) genre='info';
  if (type==='jeunesse' && !/adulte|satirique/.test(name)) genre='jeunesse';
  if (type==='sport') genre='sport';
  const archive = /archives|catalogue|rediffusion|classique|culte|patrimoni|legende|boucle/.test(name);
  const foreign = /japon|manga|anime|\bus\b|international|blockbuster|super-heros|les experts/.test(name);
  const french = !foreign && (/francais/.test(name) ||
    ((genre==='info'||genre==='diverti') && !archive));
  const origin = foreign?'international':french?'FR':/europe/.test(name)?'EU':'non_precisee';
  const original = !archive && (genre==='fiction'||genre==='jeunesse'||genre==='culture') && origin==='FR';
  const live = !archive && (/direct|live|matinale|journal|breaking|fil d.actualite/.test(name) ||
    (type==='sport' && program.slot==='prime'));
  const disciplines = [];
  if(type==='sport') for(const [pattern,discipline] of [
    [/football|telefoot|mercato/,'football'],[/rugby/,'rugby'],[/basket/,'basket'],
    [/handball/,'handball'],[/davis|tennis/,'tennis'],[/biathlon/,'biathlon'],
    [/cyclisme/,'cyclisme'],[/surf/,'surf'],[/combat/,'combat'],[/f1|mecanique/,'automobile']
  ]) if(pattern.test(name)) disciplines.push(discipline);
  const mix = Object.fromEntries(EDITO_CATEGORIES.map(key=>[key,0]));
  mix[genre]=100;
  mix.prodFR=origin==='FR'?100:0;
  mix.prodEU=origin==='FR'||origin==='EU'?100:0;
  mix.creation=original?100:0;
  mix.inedit=archive?0:100;
  mix.direct=live?100:0;
  mix.debat=/debat|entretien|interview|dispute/.test(name)?100:0;
  // Un achat ne prouve ni le pluralisme ni la protection : conserver le socle.
  mix.pluralisme=EDITO_BASE[type].pluralisme;
  mix.protection=EDITO_BASE[type].protection;
  return {genre,origin,original,creationShare:original?1:0,disciplines,mix};
}

function gridEditorialMix(player) {
  const base=EDITO_BASE[player.type];
  const mix={...base};
  for(const origin of ['prodFR','prodEU']) mix['fiction_'+origin]=base.fiction*base[origin]/100;
  for(const {key:slot} of TIME_SLOTS) {
    const profile=activeContract(player,slot)?.editorial;
    if(!profile) continue;
    const weight=SLOT_HOURS[slot]/24;
    for(const key of EDITO_CATEGORIES) mix[key]+=weight*(profile.mix[key]-base[key]);
    for(const origin of ['prodFR','prodEU']) {
      mix['fiction_'+origin]+=weight*(profile.mix.fiction*profile.mix[origin]/100-base.fiction*base[origin]/100);
    }
  }
  // Les effets des dilemmes restent distincts des contrats, sans cumul à la signature.
  for(const key of EDITO_CATEGORIES) mix[key]=Math.max(0,Math.min(100,mix[key]+(player.editoMix?.[key]??base[key])-base[key]));
  for(const origin of ['prodFR','prodEU']) {
    const editorialDelta=(player.editoMix?.fiction??base.fiction)*(player.editoMix?.[origin]??base[origin])/100-base.fiction*base[origin]/100;
    mix['fiction_'+origin]=Math.max(0,Math.min(mix.fiction,mix[origin],mix['fiction_'+origin]+editorialDelta));
  }
  return mix;
}

function gridCreationInvestment(player) {
  let programTotal=0, creation=player.seasonCreationSpend||0, annualTotal=0;
  for(const {key} of TIME_SLOTS) {
    const c=activeContract(player,key);
    if(!c) continue;
    annualTotal+=c.annual;
    const spend=Math.max(0,c.annual-(c.talentAnnual||0))+(c.rights||0)/Math.max(1,c.years||1);
    programTotal+=spend;
    creation+=spend*(c.editorial?.creationShare||0);
  }
  const baseBudget=Math.max(0,(player.coutGrilleEngageSaison||0)-annualTotal);
  const total=baseBudget+programTotal+(player.seasonTotalSpend||0);
  return {creation:Math.min(total,creation),total};
}

function refreshEconomy() {

function validateFinance(f) {
  if(!f || !Number.isFinite(f.recurring) || !Number.isFinite(f.purchase) ||
    !Number.isFinite(f.commercial) || f.purchase<0 || f.commercial<0) throw Error('Flux financier invalide');
}
function quoteFinance(f, excludedSlot=null) {
  validateFinance(f);
  const p=gameState.player;
  const floor=Object.entries(p.contracts||{}).reduce((sum,[slot,c])=>sum+(slot===excludedSlot?0:c.annual),0);
  const grille=Math.max(floor,p.coutGrilleEngageSaison+f.recurring);
  const recurring=grille-p.coutGrilleEngageSaison;
  return {grille,recurring,immediate:recurring+f.purchase-f.commercial,
    cash:p.tresorerie-recurring-f.purchase+f.commercial};
}
function quoteDilemma(choice) {
  const previous=choice.grille ? gameState.player.contracts?.[choice.grille.slot] : null;
  const termination=previous?previous.annual*Math.max(0,previous.end-gameState.season+1):0;
  const finance={...choice.finance, recurring:choice.finance.recurring-(previous?.annual||0),
    purchase:choice.finance.purchase+termination};
  return {...quoteFinance(finance,choice.grille?.slot),finance,termination,replacedTalent:previous?.talentAnnual||0};
}
function quoteCareerDilemma(choice) {
  const slot = gameState.dilemmaQueue[gameState.currentDilemmaIndex]?.careerSlot;
  return {...quoteFinance(choice.finance, choice.careerAction==='stop'?slot:null), finance:{...choice.finance}, termination:0, replacedTalent:0};
}
function quoteProgram(slot,programId,talentId) {
  const p=gameState.player;
  const program=PROGRAM_CATALOG.find(x=>x.id===programId),talent=TALENT_CATALOG.find(x=>x.id===talentId);
  if(!program || !talent || !TIME_SLOTS.some(x=>x.key===slot) ||
    program.channelType!==p.type || program.slot!==slot) return null;
  const previous=p.contracts?.[slot];
  const annual=program.annual+talent.annual;
  const termination=previous?previous.annual*Math.max(0,previous.end-gameState.season+1):0;
  // Programme diffusé par un concurrent : rachat des droits en plus du contrat.
  const holder=sameProgram(previous,program)?null:programHolder(program);
  const buyout=holder?exclusivityFee(program,holder):0;
  const finance={recurring:annual-(previous?.annual||0),purchase:program.rights+termination+buyout,commercial:0};
  const quote=quoteFinance(finance,slot);
  const unchanged=previous?.id===programId && previous.talent===talent.name;
  return {...quote,program,talent,annual,termination,finance,unchanged,holder,buyout,
    allowed:!unchanged && quote.cash>=TRESORERIE_CRITIQUE};
}
function generateSeasonKickoffProposal() {
  const p = gameState.player;
  const slotKeys = TIME_SLOTS.map(s => s.key).sort(() => Math.random() - 0.5);
  for (const slot of slotKeys) {
    const currentId = p.contracts?.[slot]?.id;
    const pool = PROGRAM_CATALOG.filter(x => x.channelType === p.type && x.slot === slot && x.id !== currentId && !programHolder(x));
    if (pool.length < 2) continue;
    const affordable = pool.filter(x => quoteProgram(slot, x.id, 'interne')?.allowed);
    const source = affordable.length >= 2 ? affordable : pool;
    const options = [...source].sort(() => Math.random() - 0.5).slice(0, 2);
    if (options.length === 2) return { slot, options };
  }
  return null;
}

  const passHtml = `
    <button class="choice" data-mercato-offer="none" ${m.result ? 'disabled' : ''}>

  app.innerHTML = `

function launchConfetti() {
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#e11d48', '#2563eb', '#f59e0b', '#10b981', '#8b5cf6', '#06b6d4', '#facc15'];
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  layer.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < 90; i++) {
    const piece = document.createElement('span');
    piece.className = 'confetti-piece' + (i % 3 === 0 ? ' round' : '');
    const drift = (Math.random() - 0.5) * 220;
    piece.style.cssText = `left:${Math.random() * 100}%;background:${colors[i % colors.length]};`
      + `--drift:${drift}px;--spin:${(Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 540)}deg;`
      + `animation-duration:${2.2 + Math.random() * 1.6}s;animation-delay:${Math.random() * 0.5}s;`
      + `width:${6 + Math.random() * 5}px;height:${8 + Math.random() * 8}px;`;
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 4600);
}

function nextSeasonCommitment() {
  const p=gameState.player;
  const expired=Object.values(p.contracts||{}).filter(c=>c.end<=gameState.season).reduce((sum,c)=>sum+c.annual,0);
  const annual=Math.max(0,p.coutGrilleEngageSaison-expired);
  return {annual,expired,cash:p.tresorerie-annual};
}
function applyFinance(f, excludedSlot=null) {
  ensureCampaign(); const p=gameState.player;
  const quote=quoteFinance(f, excludedSlot);
  p.coutGrilleEngageSaison=quote.grille;
  const recurring=quote.recurring;
  p.achatsSaison+=f.purchase; p.commercialSaison+=f.commercial;
  p.tresorerie+=f.commercial-f.purchase-recurring;
  return recurring;
}
function signProgram(slot, programId, talentId) {
  ensureCampaign(); const p=gameState.player;
  if(gameState.step!==6 || gameState.dilemmaPhase!=='choosing' || gameState.currentDilemmaIndex!==0) return false;
  const quote=quoteProgram(slot,programId,talentId);
  if(!quote || !quote.allowed) return false;
  const {program,talent,annual,holder,buyout}=quote;
  const previous=p.contracts[slot];
  delete p.contracts[slot];
  applyFinance(quote.finance);
  p.contracts[slot]={...program, annual, talent:talent.name, talentAnnual:talent.annual,
    power:program.power+talent.bonus*SLOT_AFFINITY[p.type][slot], end:gameState.season+program.years-1,
    career:createProgramCareer(program, slot)};
  if(holder) {
    p.contracts[slot].acquiredFrom=holder.competitor.name;
    p.contracts[slot].buyout=buyout;
    const released=releaseCompetitorProgram(holder.competitor,holder.slot,buyout);
    gameState.exclusivityNotice={slot,season:gameState.season,
      text:`« ${program.name} » racheté à ${holder.competitor.name} (${nf1(buyout)} M€). La chaîne le déprogramme et lance « ${released.program.name} » ${TIME_SLOTS.find(t=>t.key===holder.slot)?.daypart||''}.`};
  }
  p.coutTalentsSaison+=talent.annual-(previous?.talentAnnual||0);
  p.grilleOverrides[slot]=program.name+' — '+talent.name;
  const audience=getCalculatedPDAs().find(c=>c.channel===p).pda[p.target];
  p.pdaHistorySeason=[audience]; p.pdaMoyenneSaison=audience; p.pdaFinSaison=audience;
  // Le nouveau programme modifie l'audience : les recettes pub sont réestimées tout de
  // suite (seul l'écart est appliqué), et non au dilemme suivant.
  reevaluateAdRevenue();
  refreshEconomy(); render(); return true;
}
function expireContracts() {
  ensureCampaign(); const p=gameState.player;
  gameState.expiredPrograms=[];
  for(const [slot,c] of Object.entries(p.contracts)) if(c.end<gameState.season) {
    p.coutGrilleEngageSaison=Math.max(0,p.coutGrilleEngageSaison-c.annual);
    delete p.contracts[slot]; delete p.grilleOverrides[slot];
    gameState.expiredPrograms.push(c.name);
  }
}
function strategicCompetitors() {
  const before = getCalculatedPDAs();
  const player = gameState.player;
  const playerRow = before.find(row => row.channel === player);
  const events = [];
  gameState.competitors.forEach((competitor, index) => {
    migrateCompetitorStrategy(competitor, index);
    const profile = GAME_BALANCE.competitors.profiles[competitor.strategy];
    const target = profile.targetPriority;
    const competitorRow = before.find(row => row.channel === competitor);
    const threats = TIME_SLOTS.map(({key}) => {
      const rivals = before.filter(row => row.channel !== player).map(row => row.slots[key][target]);
      const playerLeading = playerRow.slots[key][target] >= Math.max(...rivals);
      return { slot:key, gap:playerRow.slots[key][target] - competitorRow.slots[key][target], playerLeading };
    }).filter(x => x.playerLeading && x.gap >= GAME_BALANCE.competitors.reactionThreshold)
      .sort((a,b) => (b.gap + (b.slot === 'prime' ? 1 : 0)) - (a.gap + (a.slot === 'prime' ? 1 : 0)));
    const threat = threats[0];
    if (!threat) { competitor.lastAction = 'Observe le marché'; return; }
    const probability = Math.min(0.9, profile.reactionStrength * (0.35 + Math.min(1, threat.gap / 5)));
    if (seededRandom() > probability || competitor.budget < 0.5) {
      competitor.lastAction = profile.label === 'Rentable' ? 'Préserve sa rentabilité' : 'N’engage pas de riposte';
      return;
    }
    let action = 'contre-programmation';
    if (competitor.strategy === 'offensive' && seededRandom() < profile.eventPreference) action = 'événement majeur';
    else if (competitor.strategy === 'jeune') action = 'offensive jeunes';
    else if (competitor.strategy === 'premium') action = 'investissement premium';
    else if (competitor.strategy === 'rentable' && threat.gap > 4) action = 'retrait stratégique';
    const destination = action === 'retrait stratégique'
      ? TIME_SLOTS.map(s=>s.key).find(key => key !== threat.slot && competitorRow.slots[key][target] >= playerRow.slots[key][target]) || 'matin'
      : threat.slot;
    const spend = Math.min(competitor.budget, 0.6 + profile.budgetAggressiveness * 1.8);
    const power = Math.min(GAME_BALANCE.competitors.maxPressurePower, spend * profile.reactionStrength);
    competitor.budget -= spend;
    competitor.slotInvestments[destination] = { targets: {
      [target]: power,
      ...(competitor.strategy === 'jeune' ? { a2549: power * 0.55 } : {})
    }, expires: gameState.season + GAME_BALANCE.competitors.eventDuration - 1, action };
    competitor.lastAction = action;
    const event = { season:gameState.season, channel:competitor.name, strategy:competitor.strategy,
      target, trigger:`Leadership joueur ${threat.slot}`, action, slot:destination, power };
    competitor.strategyHistory.push(event); events.push(event);
  });
  gameState.competitorEvents = events;
  return events;
}

function migrateCompetitorStrategy(competitor, index=0) {
  const aliases = { prudent:'rentable', specialiste:'jeune' };
  competitor.strategy = aliases[competitor.strategy] || competitor.strategy
    || Object.keys(GAME_BALANCE.competitors.profiles)[index % 4];
  if (!GAME_BALANCE.competitors.profiles[competitor.strategy]) competitor.strategy = 'rentable';
  competitor.slotInvestments ??= {}; competitor.strategyHistory ??= [];
  competitor.budget ??= CHANNEL_TYPES[competitor.type]?.baseBudget || 20;
  competitor.contracts ??= {}; competitor.talents ??= []; competitor.plan ??= null;
  return competitor;
}

// ---------------------------------------------------------------------------
// MARCHÉ CONCURRENTIEL — programmation saisonnière des chaînes IA
// ---------------------------------------------------------------------------
// Chaque concurrent signe de vrais programmes du catalogue (competitor.contracts),
// pris en compte par getCalculatedPDAs comme ceux du joueur. Le plan de saison
// (competitor.plan) mémorise les décisions et ce qui en a été annoncé.

const GENRE_LABELS = { fiction: 'Fiction', diverti: 'Divertissement', sport: 'Sport', info: 'Information',
  culture: 'Culture', jeunesse: 'Jeunesse' };
const STRATEGY_TAGS = {
  maintien: { label: 'Maintien', accent: 'gris' },
  nouveaute: { label: 'Nouveauté', accent: 'bleu' },
  offensive: { label: 'Offensive', accent: 'rouge' },
  economie: { label: 'Économie', accent: 'vert' },
  renforcement: { label: 'Renforcement', accent: 'gold' },
  franchise: { label: 'Franchise', accent: 'gold' },
  riposte: { label: 'Riposte', accent: 'rouge' }
};

// ---- Exclusivité des programmes ----
// Un même programme (même fiche ou même intitulé) ne peut être à l'antenne que sur
// une seule chaîne à la fois.
function programKey(name) {
  return String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

function sameProgram(a, b) {
  return !!a && !!b && (a.id === b.id || programKey(a.name) === programKey(b.name));
}

// Chaîne concurrente qui diffuse actuellement ce programme (tous créneaux confondus).
function programHolder(program) {
  for (const competitor of gameState.competitors || []) {
    for (const { key: slot } of TIME_SLOTS) {
      const contract = activeContract(competitor, slot);
      if (sameProgram(contract, program)) return { competitor, slot, contract };
    }
  }
  return null;
}

// Programme déjà pris par une autre chaîne que `channel` (joueur compris).
function isProgramTaken(program, channel) {
  const channels = [gameState.player, ...(gameState.competitors || [])].filter(c => c && c !== channel);
  return channels.some(c => TIME_SLOTS.some(({ key }) => {
    const contract = c === gameState.player ? activeContract(c, key) : c.contracts?.[key];
    return sameProgram(contract, program);
  }));
}

function exclusivityFee(program, holder) {
  const ex = GAME_BALANCE.exclusivity;
  const remaining = Math.max(1, (holder.contract.end ?? gameState.season) - gameState.season + 1);
  const level = contractInvestLevel(holder.contract);
  const fee = (ex.baseFee + program.rights * ex.rightsRate + program.annual * ex.annualRate * remaining) * (1 + ex.levelPremium * level);
  return Math.round(fee * 10) / 10;
}

// Le concurrent perd un programme racheté par le joueur : il est indemnisé, puis
// son IA programme un remplacement selon son profil éditorial et son budget.
function releaseCompetitorProgram(competitor, slot, fee) {
  const market = GAME_BALANCE.market;
  const profile = GAME_BALANCE.competitors.profiles[competitor.strategy];
  const lost = competitor.contracts[slot];
  competitor.budget = (competitor.budget || 0) + fee * GAME_BALANCE.exclusivity.compensationShare;
  const genre = profile.reactionStrength >= 0.5 ? lost.editorial?.genre : null;
  const program = pickCompetitorProgram(competitor, slot, { excludeId: lost.id, genre });
  let level = contractInvestLevel(lost);
  let tag = 'nouveaute';
  const step = level < 3 ? market.investCost[level + 1] - market.investCost[level] : Infinity;
  if (competitor.budget >= step && marketRandom() < profile.riskTolerance) {
    level += 1; competitor.budget -= step; tag = 'offensive';
  } else if (competitor.budget < market.investCost[level] * 0.5 && level > 0) {
    level -= 1; tag = 'economie';
  }
  competitor.contracts[slot] = makeCompetitorContract(competitor, program, slot, level, { seasonsCount: 0, tag });
  if (competitor.plan?.slots) {
    const prevLevel = competitor.plan.slots[slot]?.level ?? null;
    competitor.plan.slots[slot] = { programId: program.id, name: program.name, genre: program.editorial.genre,
      format: program.format, target: program.target, level, tag, isNew: true, prevName: lost.name, prevLevel };
    competitor.plan.announced ??= {};
    competitor.plan.announced[slot] = { level, masked: false };
  }
  competitor.strategyHistory?.push({ kind: 'loss', season: gameState.season, slot, lost: lost.name, replacement: program.name, fee });
  return { lost, program, level, tag };
}

function slotPowerAverage(type, slot) {
  const pool = availablePrograms(type, slot);
  return pool.length ? pool.reduce((s, p) => s + p.power, 0) / pool.length : 0;
}

function competitorContractPower(competitor, program, level, slot, extra = 0) {
  const market = GAME_BALANCE.market;
  return (program.power - slotPowerAverage(competitor.type, slot)) * market.programPowerScale
    + market.investPower[level] + extra;
}

// Choix d'un programme selon la personnalité éditoriale de la chaîne.
function pickCompetitorProgram(competitor, slot, { excludeId = null, genre = null } = {}) {
  let pool = availablePrograms(competitor.type, slot).filter(p => p.id !== excludeId);
  const free = pool.filter(p => !isProgramTaken(p, competitor));
  if (free.length) pool = free;
  if (genre && pool.some(p => p.editorial.genre === genre)) pool = pool.filter(p => p.editorial.genre === genre);
  if (!pool.length) return null;
  const score = p => {
    const cost = p.annual + p.rights / Math.max(1, p.years);
    const noise = marketRandom() * 0.35;
    switch (competitor.strategy) {
      case 'offensive': return p.power + (p.editorial.genre === 'diverti' || p.editorial.genre === 'sport' ? 0.3 : 0) + noise;
      case 'rentable': return p.power / (cost + 0.5) * 3 + noise;
      case 'jeune': return p.power + (p.target === 'j1524' ? 1.2 : 0) + (p.editorial.genre === 'jeunesse' || p.editorial.genre === 'diverti' ? 0.3 : 0) + noise;
      case 'premium': return p.power + (p.target === 'csp' ? 1 : 0) + (['culture', 'info', 'fiction'].includes(p.editorial.genre) ? 0.3 : 0) + noise;
      default: return p.power + noise;
    }
  };
  return pool.map(p => ({ p, s: score(p) })).sort((a, b) => b.s - a.s)[0].p;
}

function baseInvestLevel(competitor, slot) {
  const profile = GAME_BALANCE.competitors.profiles[competitor.strategy];
  const importance = GAME_BALANCE.market.strategicSlots[slot] ?? 0.4;
  const score = profile.budgetAggressiveness * importance + profile.eventPreference * (slot === 'prime' ? 0.2 : 0);
  if (score > 0.75 && profile.riskTolerance >= 0.6) return 3;
  if (score > 0.42) return 2;
  if (score > 0.16) return 1;
  return 0;
}

// Évolution de la part de créneau (cible prioritaire du profil) lors de la dernière saison.
function slotTrend(competitor, slot) {
  const results = competitor.strategyHistory.filter(e => e.kind === 'result');
  const last = results.at(-1);
  if (!last) return 0;
  const before = results.length >= 2 ? results.at(-2).slots[slot] : last.slotsStart?.[slot];
  return before === undefined ? 0 : last.slots[slot] - before;
}

function makeCompetitorContract(competitor, program, slot, level, { seasonsCount = 0, tag, extraPower = 0 } = {}) {
  return {
    ...program, slot, target: program.target, investLevel: level, strategyTag: tag,
    power: competitorContractPower(competitor, program, level, slot, extraPower),
    end: gameState.season + Math.max(1, program.years) - 1,
    career: { seasonsCount, awareness: 20 + seasonsCount * 10, loyalty: 15 + seasonsCount * 8, wear: seasonsCount * 8,
      basePotential: 0, potential: 0, history: [], historic: false, slot }
  };
}

// Plan de saison d'un concurrent : décisions par créneau, cohérentes avec son profil
// et sa mémoire (strategyHistory). Les changements de niveau sont progressifs.
function planCompetitorSeason(competitor, index) {
  migrateCompetitorStrategy(competitor, index);
  const profile = GAME_BALANCE.competitors.profiles[competitor.strategy];
  const market = GAME_BALANCE.market;
  const firstSeason = gameState.season === 1 && !competitor.plan;
  const playerContracts = gameState.player.contracts || {};
  const slots = {};
  let riposteUsed = false;

  TIME_SLOTS.forEach(({ key: slot }) => {
    const previous = competitor.contracts[slot];
    const prevLevel = previous ? contractInvestLevel(previous) : null;
    const trend = firstSeason ? 0 : slotTrend(competitor, slot);
    const success = trend >= market.successThreshold;
    const under = trend <= market.underperformThreshold;
    const expired = !previous || previous.end < gameState.season;
    let level = baseInvestLevel(competitor, slot);
    let program = null, tag = 'maintien', isNew = false, extraPower = 0, seasonsCount = 0;

    // Riposte : un programme culte du joueur attire un concurrent du même genre.
    const playerCult = playerContracts[slot]?.career?.historic ? playerContracts[slot] : null;
    if (!firstSeason && playerCult && !riposteUsed && !playerCult.career.ripostedBy
      && profile.reactionStrength >= 0.6 && marketRandom() < profile.reactionStrength) {
      const similar = pickCompetitorProgram(competitor, slot, { excludeId: previous?.id, genre: playerCult.editorial?.genre });
      if (similar && similar.editorial.genre === playerCult.editorial?.genre) {
        program = similar; tag = 'riposte'; isNew = true; level = Math.min(3, Math.max(level, 2));
        playerCult.career.ripostedBy = competitor.name; riposteUsed = true;
      }
    }

    if (!program) {
      if (firstSeason) {
        // Chaînes installées : grille existante, cycles de vie échelonnés.
        program = pickCompetitorProgram(competitor, slot);
        seasonsCount = 1 + Math.floor(marketRandom() * 4);
        tag = level >= 2 ? 'renforcement' : 'maintien';
      } else if (expired || (under && profile.riskTolerance > 0.5 && (market.strategicSlots[slot] ?? 0) >= 0.45)) {
        let renew = expired && previous && success && marketRandom() > profile.riskTolerance * 0.6;
        const renewed = renew ? PROGRAM_CATALOG.find(p => p.id === previous.id) : null;
        if (!renewed || isProgramTaken(renewed, competitor)) renew = false;
        program = renew ? renewed : pickCompetitorProgram(competitor, slot, { excludeId: previous?.id });
        isNew = !renew;
        seasonsCount = renew ? (previous.career?.seasonsCount || 0) + 1 : 0;
        level = prevLevel === null ? level : Math.max(0, Math.min(3, Math.round((level + prevLevel) / 2) + (isNew && under ? 1 : 0)));
        tag = renew ? 'maintien' : (level >= 2 && (market.strategicSlots[slot] ?? 0) >= 0.45 ? 'offensive' : 'nouveaute');
      } else {
        program = PROGRAM_CATALOG.find(p => p.id === previous.id);
        seasonsCount = (previous.career?.seasonsCount || 0) + 1;
        if (!program || isProgramTaken(program, competitor)) {
          program = pickCompetitorProgram(competitor, slot, { excludeId: previous.id }); isNew = true; seasonsCount = 0;
        }
        level = prevLevel;
        if (success && profile.riskTolerance >= 0.55 && marketRandom() < profile.riskTolerance) { level = Math.min(3, level + 1); tag = 'renforcement'; }
        else if (under && profile.riskTolerance < 0.55) { level = Math.max(0, level - 1); tag = 'economie'; }
        else if (!success && level > 0 && competitor.strategy === 'rentable' && (market.strategicSlots[slot] ?? 0) < 0.5) { level -= 1; tag = 'economie'; }
        // Franchise : un succès durable se décline plutôt que de s'essouffler.
        if (success && seasonsCount >= 3 && profile.eventPreference >= 0.6) { tag = 'franchise'; extraPower = market.franchisePower; }
      }
    }
    slots[slot] = { program, level, tag, isNew, seasonsCount, extraPower, prevName: previous?.name || null, prevLevel };
  });

  // Contrainte budgétaire : on réduit d'abord les cases les moins stratégiques.
  const cap = Math.max(1, competitor.budget * (market.budgetShare + 0.3 * profile.riskTolerance));
  const cost = () => Object.values(slots).reduce((s, d) => s + market.investCost[d.level], 0);
  const byImportance = TIME_SLOTS.map(s => s.key).sort((a, b) => (market.strategicSlots[a] ?? 0) - (market.strategicSlots[b] ?? 0));
  let guard = 0;
  while (cost() > cap && guard++ < 20) {
    const slot = byImportance.find(s => slots[s].level > 0);
    if (!slot) break;
    slots[slot].level -= 1;
    if (slots[slot].tag === 'renforcement' || slots[slot].tag === 'maintien') slots[slot].tag = 'economie';
  }
  competitor.budget = Math.max(0, competitor.budget - cost());

  // Application : la programmation confirmée est celle simulée dès l'ouverture.
  const announced = {};
  TIME_SLOTS.forEach(({ key: slot }) => {
    const d = slots[slot];
    competitor.contracts[slot] = makeCompetitorContract(competitor, d.program, slot, d.level,
      { seasonsCount: d.seasonsCount, tag: d.tag, extraPower: d.extraPower });
    if (firstSeason) competitor.contracts[slot].end = gameState.season + Math.floor(marketRandom() * 3);
    // Part d'incertitude des intentions : niveau approximatif ou projet non dévoilé.
    const noisy = marketRandom() < GAME_BALANCE.market.intentionNoise;
    announced[slot] = {
      level: noisy && !d.isNew ? Math.max(0, Math.min(3, d.level + (marketRandom() < 0.5 ? -1 : 1))) : d.level,
      masked: noisy && d.isNew
    };
  });
  competitor.plan = {
    season: gameState.season, confirmed: false, announced,
    slots: Object.fromEntries(Object.entries(slots).map(([slot, d]) => [slot, {
      programId: d.program.id, name: d.program.name, genre: d.program.editorial.genre, format: d.program.format,
      target: d.program.target, level: d.level, tag: d.tag, isNew: d.isNew, prevName: d.prevName, prevLevel: d.prevLevel
    }]))
  };
  competitor.strategyHistory.push({ kind: 'plan', season: gameState.season,
    slots: Object.fromEntries(Object.entries(competitor.plan.slots).map(([s, d]) => [s, { name: d.name, level: d.level, tag: d.tag }])) });
}

function planCompetitorSeasons() {
  ensureCampaign();
  gameState.competitors.forEach((c, i) => planCompetitorSeason(c, i));
}

// Les intentions deviennent définitives dès que la grille du joueur est figée
// (premier dilemme de la saison). Elles ne sont jamais réécrites ensuite.
function confirmCompetitorPlans() {
  gameState.competitors.forEach(c => { if (c.plan && c.plan.season === gameState.season) c.plan.confirmed = true; });
}

// Clôture : résultats constatés, mémoire des stratégies pour la saison suivante.
function recordCompetitorSeasonResults() {
  const calc = getCalculatedPDAs();
  const playerTarget = gameState.player.target;
  gameState.competitors.forEach(c => {
    const row = calc.find(r => r.channel === c);
    const profileTarget = GAME_BALANCE.competitors.profiles[c.strategy]?.targetPriority || c.target;
    c.strategyHistory.push({ kind: 'result', season: gameState.season,
      slots: Object.fromEntries(TIME_SLOTS.map(({ key }) => [key, row.slots[key][profileTarget]])),
      slotsStart: c.slotBaselineOwn ? { ...c.slotBaselineOwn } : undefined,
      pdaPlayerTarget: row.pda[playerTarget], pdaPlayerTargetStart: c.pdaSeasonBaseline });
    if (c.strategyHistory.length > 40) c.strategyHistory.splice(0, c.strategyHistory.length - 40);
  });
}

// Compatibilité : une partie entamée avant cette version reçoit un plan à la volée.
function ensureCompetitorPlans() {
  if (!gameState.competitors?.length) return;
  if (gameState.competitors.some(c => !c.plan || c.plan.season !== gameState.season)) {
    gameState.competitors.forEach((c, i) => { if (!c.plan || c.plan.season !== gameState.season) planCompetitorSeason(c, i); });
  }
}

function competitorView(competitor) {
  const plan = competitor.plan;
  const confirmed = !!plan?.confirmed;
  return TIME_SLOTS.map(({ key }) => {
    const d = plan?.slots?.[key];
    const contract = activeContract(competitor, key);
    if (!d) return { slot: key, name: contract?.name || PROGRAM_GRID[competitor.type][key], genre: null, level: 1, tag: 'maintien', masked: false };
    const a = plan.announced?.[key] || {};
    const reaction = competitor.slotInvestments?.[key];
    return { slot: key, name: d.name, genre: d.genre, format: d.format, target: d.target, tag: d.tag, isNew: d.isNew,
      prevName: d.prevName, prevLevel: d.prevLevel,
      level: confirmed ? d.level : a.level ?? d.level,
      masked: !confirmed && !!a.masked,
      reaction: reaction && reaction.expires >= gameState.season ? reaction.action : null };
  });
}

function playerSlotView(slot) {
  const p = gameState.player;
  const profile = channelSlotProfile(p, slot);
  const contract = profile.contract;
  const isNew = !!contract && (contract.career?.seasonsCount || 0) === 0;
  return { slot, name: contract?.name || p.grilleOverrides?.[slot] || PROGRAM_GRID[p.type][slot], genre: profile.genre,
    target: profile.target, level: profile.level, tag: isNew ? 'nouveaute' : 'maintien', isNew, masked: false };
}

// Libellé d'interaction entre deux programmes sur la cible du joueur.
function confrontationLabel(mine, theirs, target, slot) {
  const overlap = genreOverlap(mine.genre, theirs.genre)
    * (mine.target === target ? 1 : 0.6) * (theirs.target === target ? 1 : 0.6);
  if (overlap >= 0.85) return ['matin', 'apresmidi', 'access'].includes(slot) ? 'Bataille de fidélisation' : 'Concurrence directe';
  if (overlap >= 0.4) return 'Concurrence partielle';
  if (overlap >= 0.15) return 'Chevauchement limité';
  return 'Positionnement alternatif';
}

function investBadge(level) {
  const accents = ['gris', 'bleu', 'gold', 'rouge'];
  return `<span class="pg-pda-badge pg-badge-${accents[level] || 'gris'}">${GAME_BALANCE.market.investLabels[level] || '—'}</span>`;
}

function strategyBadge(tag) {
  const meta = STRATEGY_TAGS[tag] || STRATEGY_TAGS.maintien;
  return `<span class="pg-pda-badge pg-badge-${meta.accent}">${meta.label}</span>`;
}

// Météo concurrentielle : trois tendances maximum, calculées sur les plans.
function computeMarketWeather() {
  const p = gameState.player;
  const confirmed = gameState.competitors.every(c => c.plan?.confirmed);
  const views = gameState.competitors.map(competitorView);
  const items = [];
  const highBySlot = TIME_SLOTS.map(({ key, label, daypart }) => ({ key, label, daypart,
    high: views.filter(v => v.find(x => x.slot === key).level >= 2).length,
    total: views.reduce((s, v) => s + v.find(x => x.slot === key).level, 0) }));
  const hottest = [...highBySlot].sort((a, b) => b.high - a.high || b.total - a.total)[0];
  if (hottest && hottest.high >= 2) {
    items.push({ icon: '🔥', title: `${hottest.label} sous pression`,
      text: `${hottest.high} chaînes concurrentes ${confirmed ? 'renforcent' : 'annoncent renforcer'} leurs investissements ${hottest.daypart}.` });
  }
  const targetShort = AUDIENCE_TARGETS.find(t => t.key === p.target)?.full || p.target;
  const onTarget = gameState.competitors.filter((c, i) => {
    const prio = GAME_BALANCE.competitors.profiles[c.strategy]?.targetPriority;
    const engaged = views[i].filter(x => x.target === p.target && x.level >= 2).length;
    return engaged >= 2 || (prio === p.target && engaged >= 1);
  });
  if (onTarget.length >= 2) {
    items.push({ icon: '🎯', title: `Bataille des ${targetShort}`,
      text: `${onTarget.length} concurrents concentrent leurs efforts sur votre cible prioritaire.` });
  }
  const calmest = highBySlot.filter(s => s.high === 0).sort((a, b) => a.total - b.total
    || (GAME_BALANCE.market.strategicSlots[b.key] ?? 0) - (GAME_BALANCE.market.strategicSlots[a.key] ?? 0))[0];
  if (calmest && items.length < 3) {
    items.push({ icon: '💡', title: `Opportunité ${calmest.daypart}`,
      text: 'Les investissements concurrents restent relativement modérés sur ce créneau.' });
  }
  const newcomers = views.reduce((s, v) => s + v.filter(x => x.isNew).length, 0);
  if (items.length < 3 && newcomers >= 3) {
    items.push({ icon: '🆕', title: 'Rentrée agitée', text: `${newcomers} nouveaux programmes ${confirmed ? 'lancés' : 'annoncés'} chez la concurrence.` });
  }
  return { confirmed, items: items.slice(0, 3) };
}

// Décryptage d'une chaîne, construit à partir de ses décisions effectives.
function competitorDecryptage(competitor) {
  const view = competitorView(competitor);
  const importance = s => GAME_BALANCE.market.strategicSlots[s] ?? 0;
  const lead = [...view].sort((a, b) => b.level - a.level || importance(b.slot) - importance(a.slot))[0];
  const slotLabel = s => TIME_SLOTS.find(t => t.slot === s || t.key === s)?.label || s;
  const genre = lead.genre ? (GENRE_LABELS[lead.genre] || lead.genre).toLowerCase() : 'sa programmation';
  const verbs = { offensive: 'passe à l’offensive en', renforcement: 'renforce son', nouveaute: 'renouvelle son',
    maintien: 'maintient son', economie: 'allège son', franchise: 'décline une franchise en', riposte: 'riposte en' };
  const verb = verbs[lead.tag] || 'mise sur son';
  let sentence = `${competitor.name} ${verb} ${slotLabel(lead.slot)} avec ${lead.masked ? 'un projet encore confidentiel' : `« ${lead.name} » (${genre})`}`;
  const prio = GAME_BALANCE.competitors.profiles[competitor.strategy]?.targetPriority;
  const focused = view.filter(x => x.target === prio && x.level >= 2).length;
  const savings = view.filter(x => x.tag === 'economie');
  const kept = view.filter(x => x.tag === 'maintien' && x.slot !== lead.slot);
  if (focused >= 2) {
    sentence += ` et concentre ses investissements sur les ${AUDIENCE_TARGETS.find(t => t.key === prio)?.full || prio}.`;
  } else if (savings.length >= 2) {
    sentence += ' et réduit ses dépenses sur les cases secondaires.';
  } else if (kept.length) {
    sentence += ` et ${lead.tag === 'maintien' ? 'conserve' : 'maintient'} sa stratégie de fidélisation en ${slotLabel(kept[0].slot)}.`;
  } else {
    sentence += '.';
  }
  return sentence;
}

// Ces dilemmes traitent déjà de vedettes : ils ne sont pas tirés une saison de mercato.
const MERCATO_OVERLAP_DILEMMAS = ['d4', 'd21', 'd120'];

function isMercatoSeason() {
  return gameState.season >= 2 && gameState.season % GAME_BALANCE.mercato.every === 0;
}

function slotsMatchingGenre(channel, genre) {
  return TIME_SLOTS.filter(({ key }) => channelSlotProfile(channel, key).genre === genre).length;
}

function competitorTalentInterest(competitor, talent) {
  const profile = GAME_BALANCE.competitors.profiles[competitor.strategy];
  const fit = slotsMatchingGenre(competitor, talent.specialty) / TIME_SLOTS.length;
  const targetFit = talent.affinities[profile.targetPriority] ?? 0.5;
  const wallet = competitor.budget > 6 ? 0.05 : -0.2;
  return Math.max(0, Math.min(1, fit * 0.9 + targetFit * 0.35 * profile.budgetAggressiveness + wallet));
}

function interestLabel(value) {
  return value >= 0.75 ? 'très fort' : value >= 0.5 ? 'fort' : value >= 0.3 ? 'modéré' : 'faible';
}

// Conditions d'un profil : salaire, impact, prétendants concurrents et chances de signature.
function buildTalentOffer(t) {
  const cfg = GAME_BALANCE.mercato;
  const p = gameState.player;
  const annual = Math.round((cfg.minAnnual + marketRandom() * (cfg.maxAnnual - cfg.minAnnual)) * 10) / 10;
  const bonus = Math.round((cfg.minBonus + (annual - cfg.minAnnual) / (cfg.maxAnnual - cfg.minAnnual) * (cfg.maxBonus - cfg.minBonus)) * 100) / 100;
  const suitors = gameState.competitors.map(c => ({ name: c.name, interest: competitorTalentInterest(c, t) }))
    .filter(s => s.interest >= 0.3).sort((a, b) => b.interest - a.interest).slice(0, 3);
  const top = suitors[0]?.interest || 0;
  const chance = Math.max(0.2, Math.min(0.85, 0.78 - top * 0.45 + (p.popularite - 50) / 250));
  return { ...t, annual, bonus, suitors, chance, compatibleSlots: slotsMatchingGenre(p, t.specialty) };
}

function generateMercato() {
  const p = gameState.player;
  const used = new Set((gameState.mercatoHistory || []).flatMap(m => m.ids));
  const taken = takenTalentIds();
  let pool = MERCATO_TALENTS.filter(t => !used.has(t.id) && !taken.has(t.id));
  if (pool.length < 2) pool = MERCATO_TALENTS.filter(t => !taken.has(t.id));
  const ranked = pool.map(t => ({ t, k: marketRandom() + (slotsMatchingGenre(p, t.specialty) ? 1 : 0) }))
    .sort((a, b) => b.k - a.k).map(x => x.t);
  const picks = [ranked[0], ranked.find(t => t.specialty !== ranked[0].specialty) || ranked[1]];
  const offers = picks.map(buildTalentOffer);
  gameState.mercatoHistory = [...(gameState.mercatoHistory || []), { season: gameState.season, ids: picks.map(t => t.id) }];
  return { season: gameState.season, offers, result: null };
}

function resolveMercato(offerIndex) {
  const m = gameState.mercato;
  if (!m || m.result) return;
  const p = gameState.player;
  const until = gameState.season + GAME_BALANCE.mercato.duration - 1;
  const lines = [];
  const outcomes = [];
  m.offers.forEach((offer, i) => {
    const signed = { id: offer.id, name: offer.name, specialty: offer.specialty, role: offer.role,
      annual: offer.annual, bonus: offer.bonus, until, since: gameState.season, affinities: offer.affinities };
    if (i === offerIndex) {
      const slot = firstFreeTalentSlot();
      const affordable = slot >= 0 && quoteFinance({ recurring: offer.annual, purchase: 0, commercial: 0 }).cash >= TRESORERIE_CRITIQUE;
      if (affordable && marketRandom() < offer.chance) {
        signed.slot = slot;
        applyFinance({ recurring: offer.annual, purchase: 0, commercial: 0 });
        p.talents = [...(p.talents || []), signed];
        p.coutTalentsSaison += offer.annual;
        lines.push({ won: true, text: `${offer.name} rejoint votre antenne pour ${GAME_BALANCE.mercato.duration} saisons (${nf1(offer.annual)} M€/an).` });
        outcomes[i] = { status: 'signed' };
        return;
      }
      lines.push({ won: false, text: affordable ? `Votre offre pour ${offer.name} n’a pas convaincu.`
        : slot < 0 ? `Offre impossible : vos ${TALENT_SLOTS} places de talent sont occupées.`
        : `Offre impossible : votre trésorerie ne permet pas d’accueillir ${offer.name}.` });
      outcomes[i] = { status: affordable ? 'refused' : 'unaffordable' };
    }
    const suitor = offer.suitors[0] && gameState.competitors.find(c => c.name === offer.suitors[0].name);
    if (suitor) {
      suitor.talents = [...(suitor.talents || []), signed];
      suitor.budget = Math.max(0, suitor.budget - offer.annual);
      suitor.strategyHistory.push({ kind: 'talent', season: gameState.season, name: offer.name, specialty: offer.specialty });
      lines.push({ won: false, text: `${suitor.name} recrute ${offer.name} (${(GENRE_LABELS[offer.specialty] || offer.specialty).toLowerCase()}).` });
      outcomes[i] = { ...(outcomes[i] || {}), rival: suitor.name };
    } else {
      lines.push({ won: false, text: `${offer.name} reste libre cette saison.` });
      outcomes[i] = { ...(outcomes[i] || {}), free: true };
    }
  });
  // Les talents modifient les audiences : seul l'écart de recettes est réestimé.
  reevaluateAdRevenue();
  const audience = getCalculatedPDAs().find(c => c.channel === p).pda[p.target];
  p.pdaHistorySeason = [audience]; p.pdaMoyenneSaison = audience; p.pdaFinSaison = audience;
  refreshEconomy();
  m.result = lines;
  m.outcomes = outcomes;
  m.chosen = offerIndex;
}

function expireTalents() {
  const p = gameState.player;
  gameState.talentScouting = null;
  (p.talents || []).forEach(t => {
    if (t.nextAnnual == null || gameState.season < t.nextAnnualFrom || t.until < gameState.season) return;
    p.coutGrilleEngageSaison += t.nextAnnual - t.annual;
    t.annual = t.nextAnnual;
    delete t.nextAnnual;
    delete t.nextAnnualFrom;
  });
  (p.talents || []).filter(t => t.until < gameState.season)
    .forEach(t => { p.coutGrilleEngageSaison = Math.max(0, p.coutGrilleEngageSaison - t.annual); });
  p.talents = (p.talents || []).filter(t => t.until >= gameState.season);
  gameState.competitors.forEach(c => { c.talents = (c.talents || []).filter(t => t.until >= gameState.season); });
}

function regieOpportunityEligible() {
  const p = gameState.player;
  if (gameState.season < 2 || p.popularite < 40) return false;
  if ((p.lastRegieOpportunity ?? -99) > gameState.season - GAME_BALANCE.regie.cooldown) return false;
  const last = gameState.history.at(-1);
  if (!last) return false;
  const growth = last.pdaCible - (last.pdaDebut ?? last.pdaCible);
  const declines = gameState.competitors.filter(c => {
    const r = c.strategyHistory?.filter(e => e.kind === 'result').at(-1);
    return r && r.pdaPlayerTargetStart !== undefined && r.pdaPlayerTarget < r.pdaPlayerTargetStart - 0.05;
  }).length;
  return (growth >= 0.15 && declines >= 2) || growth >= 0.4;
}

function createRegieOpportunityDilemma() {
  const p = gameState.player;
  const cfg = GAME_BALANCE.regie;
  const targetLabel = AUDIENCE_TARGETS.find(t => t.key === p.target)?.full || p.target;
  // Base hors accélérateurs régie : la sécurisation porte sur le CA lié à l'audience.
  const pdaCible = getCalculatedPDAs().find(item => item.channel === p).pda[p.target];
  const reference = computeRevenusPub(pdaCible, p.target, p.popularite, p.puissanceCommerciale);
  const secured = Math.round(Math.max(0.5, reference * cfg.secureShare) * 10) / 10;
  const zeroPda = { j1524: 0, a2549: 0, s50: 0, csp: 0 };
  return {
    id: `regie-oppo-${gameState.season}`, isRegieOpportunity: true,
    titre: 'Votre régie veut revoir sa copie',
    desc: `Votre régie constate que votre chaîne gagne du terrain sur les ${targetLabel}. Elle propose de revoir sa stratégie de commercialisation.`,
    c: [
      { l: 'Revaloriser les espaces publicitaires', regie: { delta: cfg.revalueDelta, volatile: true },
        pda: { ...zeroPda }, audienceImpacts: [], pop: 0, pillLabel: 'Tarifs +6 %',
        finance: { recurring: 0, purchase: 0, commercial: 0, category: 'N' },
        r: 'Les tarifs grimpent : vos recettes publicitaires progressent, mais un recul d’audience cette saison serait sanctionné par les annonceurs.' },
      { l: 'Sécuriser les accords annonceurs', regie: { delta: cfg.secureDelta, floor: true },
        pda: { ...zeroPda }, audienceImpacts: [], pop: 0,
        finance: { recurring: 0, purchase: 0, commercial: secured, category: 'C' },
        r: 'Des engagements pluriannuels sécurisent vos recettes : moins de potentiel de hausse, mais une protection en cas de saison difficile.' }
    ]
  };
}

function applyRegieDecision(regie) {
  const p = gameState.player;
  const cfg = GAME_BALANCE.regie;
  p.puissanceCommerciale = Math.min(cfg.cap, Math.max(0.85, p.puissanceCommerciale + regie.delta));
  if (regie.volatile) p.regieVolatileSeason = gameState.season;
  if (regie.floor) p.regieFloorUntil = gameState.season + 1;
}

function fitTalentCards() {
  document.querySelectorAll('.tl-card:not(.tl-card-ghost) .tl-front').forEach(card => {
    const programs = card.querySelector('.tl-programs');
    if (!programs) return;
    programs.style.webkitLineClamp = '';
    programs.style.maxHeight = '';
    let lines = parseInt(getComputedStyle(programs).webkitLineClamp, 10) || 2;
    while (card.scrollHeight > card.clientHeight && lines > 1) {
      lines--;
      programs.style.webkitLineClamp = String(lines);
      programs.style.maxHeight = `${lines * 1.25}em`;
    }
  });

// Bilan : lecture des mouvements concurrentiels réellement simulés pendant la saison.
function computeChannelBattle() {
  const p = gameState.player;
  const target = p.target;
  const targetFull = AUDIENCE_TARGETS.find(t => t.key === target)?.full || target;
  const calc = getCalculatedPDAs();
  const playerRow = calc.find(x => x.channel === p);
  const rankOf = (values, own) => 1 + values.filter(v => v > own + 1e-9).length;
  const nowValues = calc.map(r => r.pda[target]);
  const startValues = calc.map(r => r.channel.pdaSeasonBaseline ?? r.pda[target]);
  const rankNow = rankOf(nowValues, playerRow.pda[target]);
  const rankStart = rankOf(startValues, p.pdaSeasonBaseline ?? playerRow.pda[target]);
  const competitors = gameState.competitors.map(c => {
    const row = calc.find(x => x.channel === c);
    const slotGains = TIME_SLOTS.map(({ key }) => ({ key, gain: c.slotBaseline ? row.slots[key][target] - c.slotBaseline[key] : 0 }));
    return { c, delta: c.pdaSeasonBaseline !== undefined ? row.pda[target] - c.pdaSeasonBaseline : 0,
      bestSlot: [...slotGains].sort((a, b) => b.gain - a.gain)[0] };
  });
  const topMover = [...competitors].sort((a, b) => b.delta - a.delta)[0];
  const slots = TIME_SLOTS.map(({ key, label, daypart }) => {
    const strong = gameState.competitors.filter(c => (c.plan?.slots?.[key]?.level || 0) >= 2);
    return { key, label, daypart, strong,
      penalty: playerRow.pressure[key][target]?.penalty || 0,
      score: (playerRow.pressure[key][target]?.penalty || 0) * 10 + gameState.competitors.reduce((s, c) => s + (c.plan?.slots?.[key]?.level || 0), 0),
      playerDelta: p.slotBaseline ? playerRow.slots[key][target] - p.slotBaseline[key] : 0 };
  });
  const hottest = [...slots].sort((a, b) => b.score - a.score)[0];
  const tagWeight = { riposte: 5, offensive: 4, franchise: 3, nouveaute: 2, renforcement: 1 };
  const moves = gameState.competitors.flatMap(c => TIME_SLOTS.map(({ key }) => {
    const d = c.plan?.season === gameState.season ? c.plan.slots[key] : null;
    return d && tagWeight[d.tag] ? { c, key, d, w: tagWeight[d.tag] * 10 + d.level } : null;
  }).filter(Boolean)).sort((a, b) => b.w - a.w).slice(0, 3);

  const best = [...slots].sort((a, b) => b.playerDelta - a.playerDelta)[0];
  const worst = [...slots].sort((a, b) => a.playerDelta - b.playerDelta)[0];
  const sentences = [];
  if (best.playerDelta > 0.05) {
    const rival = best.strong.sort((a, b) => b.plan.slots[best.key].level - a.plan.slots[best.key].level)[0];
    sentences.push(`Votre chaîne progresse ${best.daypart}${rival ? ` malgré les investissements ${rival.plan.slots[best.key].tag === 'offensive' ? 'offensifs' : 'soutenus'} de ${rival.name}` : ''}.`);
  } else {
    sentences.push(`Votre chaîne peine à gagner du terrain sur les ${targetFull} cette saison.`);
  }
  if (topMover && topMover.delta > 0.05) {
    const where = TIME_SLOTS.find(s => s.key === topMover.bestSlot.key);
    const hurt = worst.playerDelta < -0.05 && worst.key === topMover.bestSlot.key;
    sentences.push(`${best.playerDelta > 0.05 ? 'En revanche, ' : ''}${topMover.c.name} renforce sa position ${where.daypart}${hurt ? ` et réduit votre potentiel sur les ${targetFull}` : ''}.`);
  } else {
    sentences.push(`Aucun concurrent ne progresse nettement sur les ${targetFull} : le marché reste ouvert.`);
  }
  if (hottest.penalty >= 0.05 && hottest.strong.length >= 2) {
    sentences.push(`Le créneau ${hottest.label} reste le plus disputé : ${hottest.strong.length} chaînes y ont fortement investi.`);
  }
  return { rankNow, rankStart, topMover, hottest, moves, sentences: sentences.slice(0, 3) };
}

function renderChannelBattle() {

  const b = computeChannelBattle();

  const tagVerb = { riposte: 'riposte avec', offensive: 'lance une offensive avec', franchise: 'décline la franchise', nouveaute: 'lance', renforcement: 'renforce' };
  return `<div class="card bilan-card">

function campaignProgress() {
  ensureCampaign(); const p=gameState.player;
  const audience=getCalculatedPDAs().find(c=>c.channel===p).pda[p.target];
  const profitable=gameState.history.filter(h=>h.resultatSaison>=0).length;
  return [
    {name:'Atteindre 15 % de PDA sur cible', done:audience>=15, value:nf1(audience)+' %'},
    {name:'Clôturer deux saisons rentables',done:profitable>=2,value:profitable+'/2'},
    {name:'Conformité ≥ 75 et trésorerie positive',done:computeArcomCompliance().arcomScore>=75&&p.tresorerie>=0,value:computeArcomCompliance().arcomScore+'/100'}
  ];
}
function closeCampaignSeason() {
  refreshEconomy(); const p=gameState.player, h=gameState.history.at(-1);
  h.resultatSaison=p.resultatSaison; h.commercial=p.commercialSaison; h.achats=p.achatsSaison;
  h.rentabiliteGrille=p.rentabiliteGrille;
  h.contracts=JSON.parse(JSON.stringify(p.contracts));
  recordCompetitorSeasonResults();
  // Revalorisation régie : une saison qui recule sur la cible déçoit les annonceurs.
  if(p.regieVolatileSeason===gameState.season && p.pdaFinSaison < (p.pdaSeasonBaseline ?? p.pdaFinSaison)) {
    p.puissanceCommerciale=Math.max(0.85,p.puissanceCommerciale-GAME_BALANCE.regie.backlash);
    h.regieBacklash=true;
  }
  gameState.competitors.forEach(c=>{c.budget+=Math.max(1,c.pda[c.target]*0.4);});
  if(gameState.campaign.status==='active' && gameState.season>=gameState.campaign.deadline) {
    const authorized=getRenewalOutcome(computeRenewalScore().renewalScore).key!=='refused';
    gameState.campaign.status=campaignProgress().filter(x=>x.done).length>=2 && authorized && p.tresorerie>=TRESORERIE_CRITIQUE?'won':'lost';
  }
}

function ensureMobilePickerSheet() {
  let sheet=document.getElementById('mobile-picker-sheet');
  if(sheet) return sheet;
  sheet=document.createElement('div');
  sheet.id='mobile-picker-sheet';
  sheet.className='mobile-picker-sheet';
  sheet.setAttribute('aria-hidden','true');
  sheet.innerHTML=`
    <div class="mobile-picker-backdrop" data-picker-close></div>
    <div class="mobile-picker-panel" role="dialog" aria-modal="true">
      <div class="mobile-picker-handle"></div>
      <div class="mobile-picker-header">
        <span class="mobile-picker-title"></span>
        <button type="button" class="mobile-picker-close" data-picker-close aria-label="Fermer">✕</button>
      </div>
      <div class="mobile-picker-list"></div>
    </div>`;
  document.body.appendChild(sheet);
  sheet.querySelectorAll('[data-picker-close]').forEach(el=>el.addEventListener('click', closeMobilePicker));
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMobilePicker(); });
  return sheet;
}
function openMobilePicker(select, trigger, title) {
  const sheet=ensureMobilePickerSheet();
  sheet.querySelector('.mobile-picker-title').textContent=title||'';
  const list=sheet.querySelector('.mobile-picker-list');
  list.innerHTML='';
  Array.from(select.options).forEach(opt=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='mobile-picker-option'+(opt.value===select.value?' selected':'');
    btn.innerHTML=`<span>${esc(opt.textContent)}</span><svg class="mobile-picker-option-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    btn.onclick=()=>{
      select.value=opt.value;
      select.dispatchEvent(new Event('change', {bubbles:true}));
      const textEl=trigger.querySelector('.program-manager-field-trigger-text');
      if(textEl) textEl.textContent=opt.textContent;
      closeMobilePicker();
    };
    list.appendChild(btn);
  });
  sheet.classList.add('open');
  sheet.setAttribute('aria-hidden','false');
  document.body.classList.add('mobile-picker-lock');
}
function closeMobilePicker() {
  const sheet=document.getElementById('mobile-picker-sheet');
  if(!sheet) return;
  sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden','true');
  document.body.classList.remove('mobile-picker-lock');
}
function bindCampaignPanel(app) {
  app.querySelectorAll('[data-picker-trigger]').forEach(trigger=>{
    trigger.onclick=()=>{
      const select=document.getElementById(trigger.dataset.pickerTrigger);
      if(select) openMobilePicker(select, trigger, trigger.dataset.pickerTitle);
    };
  });
  app.querySelectorAll('[data-program-editor]').forEach(editor=>{
    const slot=editor.dataset.programEditor;
    const manager=editor.closest('.program-manager');
    const feedback=manager.querySelector('.program-manager-feedback');
    const updateValidation=()=>{
      const q=quoteProgram(slot,document.getElementById('program-'+slot).value,document.getElementById('talent-'+slot).value);
      const confirm=editor.querySelector('[data-program-confirm]');
      confirm.disabled=!q?.allowed;
      const penalty=manager.querySelector('[data-program-penalty]');
      const replacing=!!q && !q.unchanged && !!gameState.player.contracts[slot];
      if(penalty) {
        penalty.hidden=!replacing;
        penalty.textContent=replacing?`Pénalité de remplacement : ${nf1(q.termination)} M€`:'';
      }
      const exclusivity=manager.querySelector('[data-program-exclusivity]');
      if(exclusivity) exclusivity.textContent=q?.holder
        ?`Programme à l'antenne sur ${q.holder.competitor.name} : rachat des droits ${nf1(q.buyout)} M€. ${q.holder.competitor.name} devra le déprogrammer.`
        :'';
    };
    editor.querySelectorAll('select').forEach(select=>select.onchange=()=>{
      feedback.textContent=''; updateValidation();
    });
    updateValidation();
    editor.querySelector('[data-program-confirm]').onclick=()=>{
      feedback.textContent='';
      const bought=!!quoteProgram(slot,document.getElementById('program-'+slot).value,document.getElementById('talent-'+slot).value)?.holder;
      if(!signProgram(slot,document.getElementById('program-'+slot).value,document.getElementById('talent-'+slot).value)) {
        feedback.textContent='Validation impossible : budget insuffisant ou contrat inchangé.';
      } else if(bought) {
        // Rachat à un concurrent : on garde le créneau ouvert pour afficher la conséquence.
        const details=document.querySelector(`.programming-slide [data-slot-editor="${slot}"]`);
        if(details) details.open=true;
      }
    };
    editor.querySelector('[data-program-cancel]').onclick=()=>{
      feedback.textContent='';
      const details=editor.closest('.pg-slot-editor');
      if(details) details.open=false;
    };
  });
}

=\"-8\" y=\"-12\" width=\"17\" height=\"11\" rx=\"1.5\" fill=\"$ink\"/><path d=\"M-8 -12l16-5 1.5 4-16 5z\" fill=\"$light\"/><path d=\"M-4 -13.5l2 3.6M1 -15l2 3.6M5.5 -16.4l2 3.6\" stroke=\"$ink\" stroke-width=\"1.6\"/></g>"},"script":{"tags":["genre:drame","genre:magazine"],"svg":"<g transform=\"translate(52 60)\"><rect x=\"-5\" y=\"-17\" width=\"13\" height=\"17\" rx=\"1.5\" fill=\"$light\" transform=\"rotate(-8)\"/><path d=\"M-2 -13h7M-2 -10h7M-2 -7h5M-2 -4h7\" stroke=\"$ink\" stroke-opacity=\"0.3\" stroke-width=\"1\" transform=\"rotate(-8)\"/></g>"},"balloon":{"tags":["genre:jeunesse","genre:divertissement"],"svg":"<g transform=\"translate(52 58)\"><path d=\"M0 0q-3 -10 1 -18\" stroke=\"$ink\" stroke-opacity=\"0.5\" stroke-width=\"0.8\" fill=\"none\"/><ellipse cx=\"1\" cy=\"-26\" rx=\"7\" ry=\"8.5\" fill=\"$accentAlt\"/><path d=\"M-2 -30q1-3 4-3\" stroke=\"$light\" stroke-opacity=\"0.7\" stroke-width=\"1.4\" fill=\"none\" stroke-linecap=\"round\"/></g>"},"lollipop":{"tags":["genre:jeunesse"],"svg":"<g transform=\"translate(52 58)\"><rect x=\"-1\" y=\"-6\" width=\"2\" height=\"14\" fill=\"$light\"/><circle cx=\"0\" cy=\"-12\" r=\"7\" fill=\"$accent\"/><path d=\"M0 -12m-4 0a4 4 0 1 1 4 4\" stroke=\"$accentAlt\" stroke-width=\"2\" fill=\"none\"/></g>"},"mug":{"tags":["genre:magazine","genre:info","genre:generique"],"svg":"<g transform=\"translate(52 60)\"><rect x=\"-5\" y=\"-12\" width=\"10\" height=\"11\" rx=\"2\" fill=\"$accent\"/><path d=\"M5 -9q4 0 4 3t-4 3\" stroke=\"$accent\" stroke-width=\"2\" fill=\"none\"/><path d=\"M-2 -15q1-2 0-4M2 -15q1-2 0-4\" stroke=\"$ink\" stroke-opacity=\"0.25\" stroke-width=\"1\" fill=\"none\" stroke-linecap=\"round\"/></g>"},"buzzer":{"tags":["genre:jeu"],"svg":"<g transform=\"translate(52 60)\"><rect x=\"-7\" y=\"-6\" width=\"14\" height=\"6\" rx=\"2\" fill=\"$ink\"/><path d=\"M-5 -6q0-6 5-6t5 6z\" fill=\"$accentAlt\"/></g>"}}}},"colors":{"sky":{"values":["#cfeefa"]},"skyAlt":{"values":["#eef9fd"]},"ground":{"values":["#9bd48a"]},"groundAlt":{"values":["#74bb6c"]},"accent":{"values":["#ffb547"]},"accentAlt":{"values":["#ff7a59"]},"ink":{"values":["#263238"]},"light":{"values":["#ffffff"]},"skin":{"values":["#f8d5b5","#e8b48e","#c68a63","#8d5a3b","#5c3a28","#f1c9a0"]},"skin2":{"values":["#f8d5b5","#e8b48e","#c68a63","#8d5a3b","#5c3a28","#f1c9a0"]},"hair":{"values":["#2b1d16","#5a3825","#a0522d","#e5b766","#1e2a3a","#b8b8c4","#c0392b"]},"hair2":{"values":["#2b1d16","#5a3825","#a0522d","#e5b766","#1e2a3a","#b8b8c4","#c0392b"],"notEqualTo":["hair"]},"top":{"values":["#4d96ff","#ff6b6b","#ffd166","#06d6a0","#8e7dff","#ff9f68","#2ec4b6","#f15bb5"],"notEqualTo":["accent","accentAlt"]},"top2":{"values":["#4d96ff","#ff6b6b","#ffd166","#06d6a0","#8e7dff","#ff9f68","#2ec4b6","#f15bb5"],"notEqualTo":["top","accent","accentAlt"]},"bottom":{"values":["#263859","#3d405b","#5c4b51","#2f4858","#6c757d","#1d3557"],"notEqualTo":["top"]},"bottom2":{"values":["#263859","#3d405b","#5c4b51","#2f4858","#6c757d","#1d3557"],"notEqualTo":["bottom","top2"]}}};</script>
<script>;/*
 * tv-programs — moteur d'illustrations de programmes TV (style DiceBear personnalisé).
 *
 * Ce fichier est autonome et s'exécute dans le navigateur (ou dans une VM Node pour les
 * tests). Il attend deux globales injectées par le build :
 *   - DiceBearCore            : le runtime @dicebear/core (Style, Avatar)
 *   - TV_PROGRAMS_LIBRARY     : la bibliothèque compacte de composants SVG
 *
 * API exposée sous `TvPrograms` :
 *   TvPrograms.definition()                       → StyleDefinition DiceBear du style `tv-programs`
 *   TvPrograms.svg({ seed, genre, subgenre, backgroundColor, palette, size })
 *   TvPrograms.dataUri(options)                   → data URI mise en cache
 *   TvPrograms.classify(program)                  → { genre, subgenre }
 *   TvPrograms.forProgram(program, options)       → data URI de l'illustration du programme
 *   TvPrograms.pitch(program, exclude)            → pitch éditorial déterministe (hors `exclude`)
 *   TvPrograms.GENRES / TvPrograms.SUBGENRES / TvPrograms.PALETTES
 */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------------------
  // Hachage déterministe (FNV-1a 32 bits) : palettes, pitchs, choix stables.
  // ---------------------------------------------------------------------------
  function hash(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }
  const pick = (list, seed, salt) => list[hash(`${seed}|${salt}`) % list.length];

  // ---------------------------------------------------------------------------
  // Genres éditoriaux et ambiances chromatiques autorisées.
  // ---------------------------------------------------------------------------
  const GENRES = {
    aventure:      { label: "Jeu d'aventure",     palettes: ['jour', 'tropical', 'aube', 'menthe'] },
    jeu:           { label: 'Jeu de plateau',     palettes: ['studio', 'neon', 'cobalt'] },
    divertissement:{ label: 'Divertissement',     palettes: ['studio', 'neon', 'corail', 'cobalt'] },
    telerealite:   { label: 'Télé-réalité',       palettes: ['tropical', 'corail', 'jour', 'aube'] },
    dating:        { label: 'Dating',             palettes: ['aube', 'corail', 'pastel', 'nuit'] },
    cuisine:       { label: 'Cuisine',            palettes: ['menthe', 'corail', 'jour', 'pastel'] },
    talent:        { label: 'Talent show',        palettes: ['neon', 'studio', 'nuit'] },
    policier:      { label: 'Fiction policière',  palettes: ['nuit', 'cobalt', 'aube'] },
    drame:         { label: 'Fiction dramatique', palettes: ['aube', 'nuit', 'pastel', 'cobalt'] },
    sport:         { label: 'Sport',              palettes: ['jour', 'cobalt', 'menthe', 'nuit'] },
    documentaire:  { label: 'Documentaire',       palettes: ['jour', 'aube', 'menthe', 'tropical'] },
    magazine:      { label: 'Magazine',           palettes: ['pastel', 'menthe', 'corail', 'jour'] },
    info:          { label: 'Information',        palettes: ['cobalt', 'jour', 'nuit'] },
    humour:        { label: 'Humour',             palettes: ['neon', 'corail', 'studio'] },
    jeunesse:      { label: 'Jeunesse',           palettes: ['pastel', 'jour', 'corail', 'menthe'] },
    generique:     { label: 'Programme',          palettes: ['jour', 'pastel', 'cobalt', 'corail'] }
  };

  // Sous-genres reconnus : ils affinent décor, objets et accessoires. Un sous-genre
  // inconnu est ignoré (le genre seul s'applique) pour ne jamais vider un calque.
  const SUBGENRES = {
    aventure: ['survie', 'montagne'],
    sport: ['football', 'rugby', 'basket', 'handball', 'tennis', 'auto', 'velo', 'surf', 'combat', 'ski', 'fitness'],
    documentaire: ['nature', 'histoire', 'science', 'culture']
  };

  // Palettes de scène : chaque couleur alimente une couleur nommée du style.
  const PALETTES = {
    jour:     { sky: '#cfeefa', skyAlt: '#eef9fd', ground: '#9bd48a', groundAlt: '#74bb6c', accent: '#ffb547', accentAlt: '#ff7a59', ink: '#263238', light: '#ffffff' },
    aube:     { sky: '#ffd2b8', skyAlt: '#ffeadb', ground: '#e9b48a', groundAlt: '#d39468', accent: '#ff8a65', accentAlt: '#7e57c2', ink: '#3e2a3c', light: '#fff8f2' },
    nuit:     { sky: '#2f3b6e', skyAlt: '#45528f', ground: '#3a4766', groundAlt: '#28324d', accent: '#ffd166', accentAlt: '#ef476f', ink: '#151b2e', light: '#f3f5ff' },
    studio:   { sky: '#3b2d8f', skyAlt: '#5a48c4', ground: '#271d63', groundAlt: '#1c1549', accent: '#ff4fa3', accentAlt: '#3ec5f2', ink: '#140f33', light: '#fdf6ff' },
    neon:     { sky: '#1f1446', skyAlt: '#3a2276', ground: '#2a1b5c', groundAlt: '#170f38', accent: '#ffd400', accentAlt: '#ff3d7f', ink: '#0d0820', light: '#fff9e8' },
    pastel:   { sky: '#fde4ef', skyAlt: '#fff4f8', ground: '#cdeadf', groundAlt: '#a9d8c6', accent: '#ff8fb1', accentAlt: '#7cc6fe', ink: '#3a3352', light: '#ffffff' },
    menthe:   { sky: '#d6f3ec', skyAlt: '#effbf8', ground: '#a5dcc4', groundAlt: '#7cc5a8', accent: '#ff9f68', accentAlt: '#2bb3a3', ink: '#1f3b3a', light: '#ffffff' },
    corail:   { sky: '#ffe0d6', skyAlt: '#fff2ec', ground: '#f6c2a8', groundAlt: '#ee9f80', accent: '#ff6b6b', accentAlt: '#4d96ff', ink: '#3b2626', light: '#ffffff' },
    cobalt:   { sky: '#d9e6ff', skyAlt: '#f0f5ff', ground: '#b4c8ee', groundAlt: '#8fa9dc', accent: '#3d6bff', accentAlt: '#ffb020', ink: '#1b2440', light: '#ffffff' },
    tropical: { sky: '#bdeef0', skyAlt: '#e6fafa', ground: '#f3dca2', groundAlt: '#e3c27a', accent: '#ff7b54', accentAlt: '#00a6a6', ink: '#203a43', light: '#ffffff' }
  };

  // ---------------------------------------------------------------------------
  // Conversion de la bibliothèque compacte (chaînes SVG) en StyleDefinition DiceBear.
  //   - un attribut valant "$nom" devient une référence de couleur { type: 'color', name }
  //   - <c name="x" transform="…"/> devient un élément { type: 'component', name: 'x' }
  // ---------------------------------------------------------------------------
  function parseSvg(src) {
    const rootEl = { children: [] };
    const stack = [rootEl];
    const re = /<(\/?)([a-zA-Z][\w-]*)((?:\s+[\w:-]+="[^"]*")*)\s*(\/?)>/g;
    let m;
    while ((m = re.exec(src))) {
      const [, closing, name, attrStr, selfClosing] = m;
      if (closing) { if (stack.length > 1) stack.pop(); continue; }
      const attributes = {};
      attrStr.replace(/([\w:-]+)="([^"]*)"/g, (_, k, v) => {
        attributes[k] = v[0] === '$' ? { type: 'color', name: v.slice(1) } : v;
        return '';
      });
      let el;
      if (name === 'c') {
        const ref = attributes.name;
        delete attributes.name;
        el = { type: 'component', name: ref };
        if (Object.keys(attributes).length) el.attributes = attributes;
        stack[stack.length - 1].children.push(el);
        continue;
      }
      el = { type: 'element', name };
      if (Object.keys(attributes).length) el.attributes = attributes;
      stack[stack.length - 1].children.push(el);
      if (!selfClosing) { el.children = []; stack.push(el); }
    }
    const clean = list => list.map(el => {
      if (el.children) {
        if (el.children.length) el.children = clean(el.children); else delete el.children;
      }
      return el;
    });
    return clean(rootEl.children);
  }

  let cachedDefinition = null;
  function definition() {
    if (cachedDefinition) return cachedDefinition;
    const lib = root.TV_PROGRAMS_LIBRARY;
    const components = {};
    for (const [name, comp] of Object.entries(lib.components)) {
      const variants = {};
      for (const [vName, v] of Object.entries(comp.variants)) {
        const variant = { elements: parseSvg(v.svg) };
        if (v.tags && v.tags.length) variant.tags = v.tags;
        if (v.weight) variant.weight = v.weight;
        variants[vName] = variant;
      }
      const c = { width: comp.width, height: comp.height, variants };
      if (comp.probability !== undefined) c.probability = comp.probability;
      components[name] = c;
    }
    cachedDefinition = {
      $comment: 'tv-programs — style DiceBear personnalisé pour Audience Masters.',
      meta: lib.meta,
      canvas: { width: lib.canvas.width, height: lib.canvas.height, elements: parseSvg(lib.canvas.svg) },
      components,
      colors: lib.colors
    };
    return cachedDefinition;
  }

  let cachedStyle = null;
  function style() {
    if (!cachedStyle) cachedStyle = new root.DiceBearCore.Style(definition());
    return cachedStyle;
  }

  // ---------------------------------------------------------------------------
  // Rendu
  // ---------------------------------------------------------------------------
  const tagSafe = v => String(v || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');

  function resolvePalette(seed, genre, palette) {
    if (palette && typeof palette === 'object') return palette;
    if (palette && PALETTES[palette]) return PALETTES[palette];
    const allowed = (GENRES[genre] || GENRES.generique).palettes;
    return PALETTES[pick(allowed, seed, 'palette')];
  }

  function svg(options = {}) {
    const seed = String(options.seed ?? 'tv-programs');
    const genre = GENRES[options.genre] ? options.genre : 'generique';
    const subgenre = (SUBGENRES[genre] || []).includes(tagSafe(options.subgenre)) ? tagSafe(options.subgenre) : '';
    const pal = resolvePalette(seed, genre, options.palette);
    const opts = { seed: `${genre}:${seed}`, tags: [`genre:${genre}`] };
    if (subgenre) opts.tags.push(`sub:${subgenre}`);
    for (const [k, v] of Object.entries(pal)) opts[`${k}Color`] = [v.replace('#', '')];
    if (options.backgroundColor) opts.backgroundColor = [String(options.backgroundColor).replace('#', '')];
    let out = new root.DiceBearCore.Avatar(style(), opts).toString();
    // DiceBear produit un SVG carré lorsque `size` est fourni : on conserve le 16:9.
    if (options.size) {
      const w = Math.round(options.size);
      const h = Math.round(w * root.TV_PROGRAMS_LIBRARY.canvas.height / root.TV_PROGRAMS_LIBRARY.canvas.width);
      out = out.replace('<svg ', `<svg width="${w}" height="${h}" `);
    }
    return out;
  }

  const FALLBACK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><rect width="320" height="180" fill="#e8eefc"/>'
    + '<rect x="104" y="40" width="112" height="76" rx="12" fill="#3d6bff"/><rect x="114" y="50" width="92" height="56" rx="6" fill="#cfe0ff"/>'
    + '<rect x="150" y="116" width="20" height="14" fill="#3d6bff"/><rect x="128" y="130" width="64" height="8" rx="4" fill="#1b2440"/></svg>';

  const cache = new Map();
  const toDataUri = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);

  function dataUri(options = {}) {
    const key = JSON.stringify([options.seed, options.genre, options.subgenre, options.palette, options.backgroundColor, options.size]);
    if (cache.has(key)) return cache.get(key);
    let uri;
    try {
      uri = toDataUri(svg(options));
    } catch (err) {
      try { uri = toDataUri(svg({ ...options, genre: 'generique', subgenre: '' })); }
      catch (err2) { uri = toDataUri(FALLBACK_SVG); }
    }
    cache.set(key, uri);
    return uri;
  }

  // ---------------------------------------------------------------------------
  // Association programme → famille graphique
  // ---------------------------------------------------------------------------
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  // Règles ordonnées : la première correspondance sur le titre/pitch l'emporte.
  const RULES = [
    [/science-fiction|acteurs/, 'drame'],
    [/conso/, 'magazine'],
    [/koh|aventur|expedition|survie|ile deserte|jungle|destination express|pekin|fort boyard/, 'aventure', 'survie'],

  // Règles propres à certaines antennes : sur une chaîne sport, tout reste du sport ;
  // sur une chaîne jeunesse, l'univers enfant prime sauf jeu, sport ou nature explicites.
  const SPORT_RULES = RULES.filter(([, genre]) => genre === 'sport');
  const JEUNESSE_RULES = [
    [/quiz|\bjeux?\b/, 'jeu'],
    [/sport|gaming|e-sport|esport/, 'sport'],
    [/satiri/, 'humour'],
    [/nature|animaux/, 'documentaire', 'nature']
  ];

  function classify(program = {}) {
    if (program.genre && GENRES[program.genre]) return { genre: program.genre, subgenre: tagSafe(program.subgenre) };
    const text = norm(`${program.title || program.name || ''} ${program.pitch || ''}`);
    const match = rules => {
      for (const [re, genre, subgenre] of rules) if (re.test(text)) return { genre, subgenre: subgenre || '' };
      return null;
    };
    if (program.channelType === 'sport') return match(SPORT_RULES) || { genre: 'sport', subgenre: '' };
    if (program.channelType === 'jeunesse') return match(JEUNESSE_RULES) || { genre: 'jeunesse', subgenre: '' };
    const found = match(RULES);
    if (found) {
      // Une « enquête » sur une chaîne d'info ou de culture relève du journalisme, pas du polar.
      if (found.genre === 'policier' && program.channelType === 'info') return { genre: 'info', subgenre: '' };
      if (found.genre === 'policier' && program.channelType === 'culture') return { genre: 'documentaire', subgenre: 'culture' };
      return found;
    }
    const byFormat = FORMAT_FALLBACK[program.format];
    if (byFormat) return { genre: byFormat, subgenre: '' };
    const byChannel = { sport: 'sport', info: 'info', jeunesse: 'jeunesse', culture: 'documentaire', cinema: 'drame' }[program.channelType];
    return { genre: byChannel || 'generique', subgenre: '' };
  }

  function forProgram(program, options = {}) {
    const { genre, subgenre } = classify(program);
    return dataUri({ seed: program.id || program.title || program.name, genre, subgenre, ...options });
  }

  // `exclude` : pitchs déjà affichés à côté (ex. deux cartes d'un même genre) ; on
  // prend alors le suivant dans la liste, ce qui reste déterministe.
  function pitch(program = {}, exclude = []) {
    if (program.pitch) return program.pitch;
    const list = PITCHS[classify(program).genre] || PITCHS.generique;
    const start = hash(`${program.id || program.name || ''}|pitch`) % list.length;
    for (let i = 0; i < list.length; i++) {
      const candidate = list[(start + i) % list.length];
      if (!exclude.includes(candidate)) return candidate;
    }
    return list[start];
  }
