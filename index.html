<!DOCTYPE html>
<!-- Version principale d’Audience Masters. -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUDIENCE MASTERS — Devenez le Roi de l'Audimat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #121316;
  --paper: #f7f5f0;
  --paper-dark: #efece6;
  --paper-card: #ffffff;
  --rouge: #e11d48;
  --bleu: #2563eb;
  --gris: #6b7280;
  --vert: #059669;
  --gold: #d97706;
  --danger: #e11d48;
  --border: #e2dfd7;
  --violet: #7c3aed;
  --cyan: #0891b2;
  --pink: #db2777;
  --amber: #f59e0b;
  --crimson: #dc2626;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 25%, #f8fafc 55%, #e0f2fe 100%);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
/* Halos d'ambiance en fixed (et non absolute) pour rester calés sur la
   fenêtre même quand la page défile au-delà de 100vh. */
body::before {
  content: ''; position: fixed; top: -10%; left: -20%;
  width: 140%; height: 60%;
  background: radial-gradient(circle at center, rgba(147,197,253,0.45) 0%, rgba(219,234,254,0.2) 50%, transparent 80%);
  filter: blur(60px);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: ''; position: fixed; bottom: -10%; right: -10%;
  width: 120%; height: 50%;
  background: radial-gradient(circle at center, rgba(186,230,253,0.35) 0%, transparent 70%);
  filter: blur(50px);
  pointer-events: none;
  z-index: 0;
}

#app {
  max-width: 680px;
  margin: 0 auto;
  padding: 12px 14px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}
.step-body-container { position: relative; overflow: hidden; }
.step-body-container.resizing { transition: height 0.34s cubic-bezier(0.16, 1, 0.3, 1); }
.step-slide-old {
  display: flex; flex-direction: column;
  width: 100%;
  transform: translateX(0);
  transition: transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
}
.step-slide-old.leaving { transform: translateX(-100%); }
.step-slide-new {
  display: flex; flex-direction: column;
  position: absolute; top: 0; left: 0; right: 0; box-sizing: border-box;
  transform: translateX(100%);
  transition: transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
}
.step-slide-new.entering { transform: translateX(0); }

h1, h2, h3, .display {
  font-family: 'Anton', Impact, sans-serif;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  line-height: 1.05;
}

button { font-family: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }

/* ---- MASTHEAD ---- */
.masthead { text-align: center; padding: 10px 0 8px; margin-bottom: 14px; cursor: pointer; transition: opacity 0.15s; }
.masthead:hover { opacity: 0.75; }
.masthead .over { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gris); }
.header-brand { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
.header-brand .dot {
  flex-shrink: 0;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 8px var(--danger);
  animation: blink 2.2s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}
.masthead h1 { font-size: clamp(32px, 8vw, 50px); }
.masthead .under { font-style: italic; font-size: 13px; margin-top: 2px; color: #4a443b; margin-bottom: 10px; }
/* Même hauteur qu'en jeu : les textes longs ne repoussent plus la barre. */
.masthead .over { height: 16.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.masthead h1 { height: 1.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.masthead .under { height: 19.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- HUD (5 INDICATEURS) ---- */
/* Toujours précédé du masthead dans le rendu final ; règle non conditionnée à
   l'adjacence DOM réelle (celle-ci est rompue pendant l'animation de transition
   entre écrans, où le hud-wrap se retrouve temporairement premier enfant d'un
   wrapper interne au lieu de suivre directement le masthead). */
.hud-wrap { margin: -22px 0 16px; }
.hud-panel {
  background: rgba(255,255,255,0.65); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.85);
  border-radius: 0 0 14px 14px; padding: 10px;
  box-shadow: 0 25px 50px -12px rgba(15,23,42,0.12), 0 0 0 1px rgba(255,255,255,0.8) inset;
}
.hud-panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-bottom: 7px; margin-bottom: 7px; border-bottom: none;
  background-image: linear-gradient(90deg, transparent, rgba(148,163,184,0.4) 15%, rgba(148,163,184,0.4) 85%, transparent);
  background-position: bottom; background-size: 100% 1px; background-repeat: no-repeat;
  box-shadow: 0 1px 1px rgba(255,255,255,0.7);
}
.hud-panel-head-label {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.6px; color: var(--gris);
}
.hud-live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--vert); flex-shrink: 0;
  animation: hudLiveDotPulse 1.6s ease-in-out infinite;
}
.hud-panel-head-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.hud-type-badge {
  flex-shrink: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 10.5px;
  padding: 4px 9px; border-radius: 999px; white-space: nowrap;
  color: #334155; background: rgba(255,255,255,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 12px rgba(15,23,42,0.06);
}
@keyframes hudLiveDotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.hud-panel-head-right { gap: 6px; }
/* Écrans étroits : la cible rejoint le format de chaîne, le libellé « Tableau de
   bord » s'efface pour laisser la place aux deux badges (le point vert reste). */
.hud-panel { container-type: inline-size; }
@container (max-width: 330px) { .hud-panel-head-text { display: none; } }
@media (max-width: 420px) {
  .hud-panel-head-right .hud-type-badge { font-size: 9.5px; padding: 3px 7px; }
}
.hud {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
  align-items: stretch;
}
.hud-cell {
  position: relative; text-align: center; min-width: 0; padding: 3px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
}
.hud-cell:not(:first-child)::before {
  content: ''; position: absolute; left: 0; top: 15%; bottom: 15%; width: 1.5px; border-radius: 999px;
  background: linear-gradient(180deg, rgba(148,163,184,0) 0%, rgba(148,163,184,0.35) 50%, rgba(148,163,184,0) 100%);
  box-shadow: 0.5px 0 0.5px rgba(255,255,255,0.7);
}
.hud-cell .lab {
  font-family: 'Space Grotesk', sans-serif; font-size: 7.5px; letter-spacing: 0.4px; text-transform: uppercase;
  color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 700;
}
.hud-cell .ic {
  font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
}
.hud-cell:nth-child(1) .ic { background: rgba(217,119,6,0.14); }
.hud-cell:nth-child(2) .ic { background: rgba(225,29,72,0.12); }
.hud-cell:nth-child(3) .ic { background: rgba(217,119,6,0.14); }
.hud-cell:nth-child(4) .ic { background: rgba(37,99,235,0.12); }
.hud-cell:nth-child(5) .ic { background: rgba(217,119,6,0.16); }
.hud-cell .val {
  font-family: 'Anton', sans-serif; font-size: 14px; white-space: nowrap;
  font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.hud-cell.alert .val { color: var(--rouge); }
.hud-cell.alert { animation: alertPulse 1.4s ease-in-out infinite; }
@keyframes alertPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

.hud-toggle {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 42px; height: 24px; position: relative;
  background: var(--paper-dark); color: transparent; border: 0;
  border-radius: 999px; padding: 0; margin: 0; box-sizing: border-box;
  cursor: pointer; box-shadow: inset 0 1px 3px rgba(0,0,0,.1);
  transition: background 0.15s ease, transform 0.1s ease;
}
.hud-toggle:hover { filter: brightness(0.97); }
.hud-toggle:active { transform: scale(0.97); }
.hud-toggle.open { background: var(--ink); border-color: var(--ink); color: transparent; }
.hud-toggle::after {
  content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18);
  transition: transform 0.22s ease;
}
.hud-toggle.open::after { transform: translateX(18px); }
.hud-toggle-chevron { display: none; }

.hud-details {
  max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
}
.hud-details.open { max-height: 2400px; opacity: 1; }
.hud-details-inner {
  background: rgba(255,255,255,0.65); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.85);
  box-shadow: 0 25px 50px -12px rgba(15,23,42,0.12), 0 0 0 1px rgba(255,255,255,0.8) inset;
  border-radius: 16px; padding: 12px 14px; margin-top: 8px;
}
.eh-title {
  font-family: 'Anton', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--ink); margin: 0 0 2px;
}
.eh-subtitle { font-size: 11px; font-style: italic; color: var(--gris); margin: 0 0 10px; }
.eh-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
.eh-legend-item {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Anton', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
}
.eh-legend-item i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.eh-bar-svg { display: block; width: 100%; height: 215px; }
.spark-empty { font-size: 12px; color: var(--gris); font-style: italic; margin-top: 3px; }

.eh-slider { overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; }
.eh-slider:active { cursor: grabbing; }
.eh-slider-track { display: flex; transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1); }
.eh-slide { flex: 0 0 100%; min-width: 0; }
.eh-slider-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; }
.eh-slider-dots { display: flex; gap: 6px; }
.eh-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(22,19,14,0.22); border: none; padding: 0; cursor: pointer; }
.eh-dot.active { background: var(--ink); }
.eh-slider-nav.nav-locked .eh-dot { opacity: 0.35; pointer-events: none; cursor: default; }

.pg-slide { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.pg-head { flex-shrink: 0; }
.pg-rows { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.pg-rows .pg-row { flex: 1; }

.pg-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 6px; border-bottom: 1px solid rgba(22,19,14,0.08);
  cursor: pointer; border-radius: 10px; transition: background 0.15s ease;
}
.pg-row:last-child { border-bottom: none; }
.pg-row:hover { background: rgba(22,19,14,0.03); }
.pg-row-key { background: rgba(225,29,72,0.05); border-radius: 12px; border-bottom-color: transparent; }
.pg-row-key:hover { background: rgba(225,29,72,0.08); }

.pg-time-pill {
  flex-shrink: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 9.5px;
  letter-spacing: 0.2px; color: var(--gris); background: var(--paper-dark);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 8px; white-space: nowrap;
}
.pg-row-key .pg-time-pill { background: var(--rouge); border-color: var(--rouge); color: #fff; }

.pg-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pg-info-title {
  display: flex; align-items: center; gap: 5px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 12.5px; color: var(--ink);
}
.pg-key-tag {
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 8px; letter-spacing: 0.4px;
  color: var(--rouge); background: rgba(225,29,72,0.12); border: 1px solid rgba(225,29,72,0.25);
  border-radius: 5px; padding: 1px 5px; text-transform: uppercase;
}
.pg-info-program {
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; color: var(--gris);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pg-info-program.pg-program-updated { color: var(--vert); font-weight: 700; }
.pg-updated-badge { font-size: 9px; margin-left: 2px; }

.pg-rank {
  flex-shrink: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 10.5px;
  color: var(--gris); white-space: nowrap;
}
.pg-rank.pg-rank-leader { color: var(--gold); }

.pg-pda-badge {
  flex-shrink: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 10.5px;
  padding: 4px 9px; border-radius: 999px; white-space: nowrap;
}
.pg-badge-vert { color: var(--vert); background: rgba(5,150,105,0.12); }
.pg-badge-bleu { color: var(--bleu); background: rgba(37,99,235,0.12); }
.pg-badge-gold { color: var(--gold); background: rgba(217,119,6,0.14); }
.pg-badge-rouge { color: var(--rouge); background: rgba(225,29,72,0.12); }
.pg-badge-gris { color: var(--gris); background: rgba(107,114,128,0.14); }

.career-stats-badges { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---- RADAR CONCURRENCE ---- */
.pg-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.radar-toggle {
  flex-shrink: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.4px; color: #334155; cursor: pointer; white-space: nowrap;
  background: rgba(255,255,255,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 12px rgba(15,23,42,0.06);
  border-radius: 999px; padding: 0 10px; transition: background 0.15s ease, transform 0.15s ease;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 26px; line-height: 1; box-sizing: border-box;
}
.radar-toggle:hover { background: rgba(255,255,255,0.85); }
.radar-toggle:active { transform: scale(0.97); }
.radar-toggle.active { background: #0f172a; border-color: #0f172a; color: #fff; }
.programming-slide { position: relative; }
.pg-slide.radar-mode { display: flex; flex-direction: column; min-height: 0; }
.radar-mode .pg-head { flex-shrink: 0; }
.radar-panel, .radar-sheet { display: flex; flex-direction: column; gap: 8px; animation: pg-pushdown .24s cubic-bezier(.16,1,.3,1); }
.radar-mode .radar-panel { flex: 1; min-height: 0; }
.radar-mode .radar-sheet { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
.radar-head-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.radar-mode .pg-head.sheet-open { margin-bottom: 10px; }
.radar-slots { flex-shrink: 0; }
.radar-slots .ga-target-btn { flex: 1 1 0; min-width: 0; padding: 5px 4px; text-align: center; }
.radar-scroll {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 8px; padding: 2px 2px 4px 0;
  scrollbar-width: thin; scrollbar-color: rgba(148,163,184,0.5) transparent;
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent);
}
.radar-card .career-stats-badges { flex-wrap: nowrap; overflow: hidden; }
.radar-card .career-stats-badges > * { flex-shrink: 0; }
.radar-weather { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.radar-weather-item {
  display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 12px;
  background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.85);
}
.radar-weather-title {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.3px; color: var(--ink);
}
.radar-weather-text { font-size: 11px; color: var(--gris); }
.radar-slots { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.radar-slots::-webkit-scrollbar { display: none; }
.radar-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; flex-shrink: 0; }
@media (min-width: 720px) { .radar-cards { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.radar-card {
  display: flex; flex-direction: column; gap: 4px; width: 100%; min-width: 0; text-align: left; padding: 8px 10px;
  border-radius: 14px; background: rgba(255,255,255,0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 8px 20px -8px rgba(15,23,42,0.08);
  font-family: 'Plus Jakarta Sans', sans-serif; color: var(--ink); cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
button.radar-card:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -8px rgba(15,23,42,0.14); }
.radar-card-player { background: rgba(37,99,235,0.08); border-color: rgba(37,99,235,0.3); cursor: default; }
.radar-card-head { display: flex; align-items: center; gap: 6px; }
.radar-rank { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 10px; color: var(--gris); }
.radar-name { flex: 1; min-width: 0; font-weight: 800; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.radar-you {
  display: inline-block; margin-left: 5px; font-size: 8.5px; font-weight: 800; text-transform: uppercase;
  color: #fff; background: var(--bleu); border-radius: 999px; padding: 2px 6px; vertical-align: 1px;
}
.radar-share { font-weight: 800; font-size: 12px; }
.radar-program { display: flex; align-items: baseline; gap: 5px; min-width: 0; font-size: 12px; font-weight: 700; white-space: nowrap; }
.radar-format { flex-shrink: 0; font-size: 10.5px; font-weight: 500; color: var(--gris); }
.radar-format::after { content: '|'; margin-left: 5px; color: rgba(148,163,184,0.7); }
.radar-program-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.radar-genre { flex-shrink: 0; font-weight: 500; color: var(--gris); }
.radar-card .career-stats-badges, .radar-grid-row { gap: 4px; }
.radar-card .pg-pda-badge, .radar-grid-row .pg-pda-badge { font-size: 9.5px; padding: 3px 7px; }
.radar-section-title {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 0.4px; color: var(--gris); margin-bottom: 4px;
}
.radar-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.radar-stat {
  padding: 8px 6px; border-radius: 12px; text-align: center;
  background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.85);
}
.radar-stat-value { font-family: 'Anton', sans-serif; font-size: 16px; line-height: 1.1; }
.radar-stat-label { font-size: 9px; color: var(--gris); text-transform: uppercase; letter-spacing: 0.3px; margin-top: 2px; }
.radar-grid-row { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(148,163,184,0.25); font-size: 11.5px; }
.radar-grid-row:last-child { border-bottom: none; }
.radar-grid-slot { width: 70px; flex-shrink: 0; font-weight: 800; font-size: 10.5px; }

.tl-card { container-type: inline-size; position: relative; min-width: 0; min-height: 0; perspective: 900px; border-radius: 14px; }
.tl-panel { --tl-dash: rgba(148,163,184,0.35); --tl-dash-hover: rgba(148,163,184,0.7); }

/* Carte retournable : recto (fiche) / verso (actions) */
.tl-flip {
  position: absolute; inset: 0; transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.2,.75,.25,1.15);
}
.tl-card.flipped .tl-flip { transform: rotateY(180deg); }
.tl-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 10px 7px 8px; text-align: center; overflow: hidden;
  background: rgba(255,255,255,0.65); border: 1px solid rgba(255,255,255,0.85); border-radius: 14px;
  box-shadow: 0 12px 28px -12px rgba(15,23,42,0.18), 0 0 0 1px rgba(255,255,255,0.8) inset;
}
.tl-front > .tl-avatar-wrap { margin-top: auto; }

.tl-front { cursor: pointer; transition: box-shadow .2s ease, border-color .2s ease; }
.tl-front:hover { border-color: rgba(225,29,72,0.35); }
.tl-front:focus-visible, .tl-back button:focus-visible { outline: 2px solid var(--rouge); outline-offset: 2px; }
.tl-back { transform: rotateY(180deg); justify-content: center; gap: 5px; background: rgba(255,255,255,0.88); }
.tl-flip-hint {
  position: absolute; top: 6px; right: 7px; font-size: 11px; line-height: 1; color: var(--gris); opacity: 0.7; transition: transform .3s ease, opacity .2s ease;
}
.tl-front:hover .tl-flip-hint { opacity: 1; transform: rotate(180deg); }
.tl-back-close {
  position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(22,19,14,0.15);
  background: rgba(255,255,255,0.8); color: var(--ink); font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
}
.mercato-avatar.tl-back-avatar { width: 36px; height: 36px; flex-shrink: 0; }
.mercato-avatar.tl-back-avatar img { width: 32px; height: 32px; }
.tl-back-sub { font-size: 9.5px; color: var(--gris); line-height: 1.25; margin-bottom: 2px; }
.tl-back-role { font-weight: 700; color: var(--ink); }
.tl-action {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px; border-radius: 12px; cursor: pointer;
  font-family: inherit; transition: background .15s ease, color .15s ease, transform .1s ease;
}
.tl-action:active:not(:disabled) { transform: scale(0.97); }
.tl-action:disabled { opacity: 0.4; cursor: default; }

.tl-action-extend:hover:not(:disabled) { background: #047857; color: #fff; }
.tl-action-fire { border: 1px solid rgba(225,29,72,0.4); background: rgba(225,29,72,0.06); color: var(--rouge); }
.tl-action-fire:hover:not(:disabled) { background: var(--rouge); color: #fff; }
.tl-action-note { font-size: 8.5px; font-style: italic; color: var(--gris); line-height: 1.25; }
/* Place libre : « + » au centre de la carte en pointillés */
.tl-slot-add {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px;
  background: transparent; font-family: inherit; cursor: pointer; color: var(--gris);
  transition: border-color .2s ease, background .2s ease;
}
.tl-slot-add:hover:not(:disabled) { border-color: var(--tl-dash-hover); }
.tl-slot-add:focus-visible { outline: 2px solid var(--tl-dash-hover); outline-offset: 2px; }
.tl-slot-add:disabled { cursor: default; opacity: 0.6; }
/* « + » dessiné en CSS : deux barres centrées géométriquement dans le rond */
.tl-plus {
  position: relative; flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
  border: 1px dashed var(--tl-dash); color: var(--tl-dash);
  transition: transform .25s cubic-bezier(.2,.75,.25,1.3), border-color .2s ease, color .2s ease;
}
.tl-plus::before, .tl-plus::after {
  content: ''; position: absolute; left: 50%; top: 50%; border-radius: 1px; background: currentColor;
  transform: translate(-50%, -50%);
}
.tl-plus::before { width: 18px; height: 2px; }
.tl-plus::after { width: 2px; height: 18px; }
.tl-slot-add:hover:not(:disabled) .tl-plus { transform: rotate(90deg); border-color: var(--tl-dash-hover); color: var(--tl-dash-hover); }
.tl-plus-label { font-size: 9.5px; font-weight: 700; line-height: 1.25; text-align: center; color: var(--gris); }
.tl-none { display: flex; align-items: center; justify-content: center; padding: 8px; }
/* Profils proposés : distribution, attente, verdict */
.tl-cand.deal { animation: tl-deal .45s cubic-bezier(.2,.75,.25,1.15) both; animation-delay: calc(var(--i) * 90ms); }
@keyframes tl-deal { from { opacity: 0; transform: translateY(14px) rotate(-3deg) scale(.94); } to { opacity: 1; transform: none; } }
.tl-cand { transition: opacity .35s ease, transform .35s ease, filter .35s ease; }
.tl-cand.dimmed { opacity: 0.4; transform: scale(0.96); filter: saturate(0.5); pointer-events: none; }
.tl-cand.leaving { opacity: 0; transform: scale(0.9) translateY(8px); pointer-events: none; }
.tl-cand.waiting .tl-face { border-color: rgba(225,29,72,0.55); animation: tl-wait 1.1s ease-in-out infinite; }
@keyframes tl-wait { 0%, 100% { box-shadow: 0 0 0 0 rgba(225,29,72,0.28); } 50% { box-shadow: 0 0 0 6px rgba(225,29,72,0); } }
.tl-cand.accepted .tl-face { border-color: rgba(4,120,87,0.6); box-shadow: 0 0 0 3px rgba(16,185,129,0.25); animation: tl-pop .45s ease both; }
.tl-cand.declined .tl-face { filter: grayscale(0.7); opacity: 0.75; }
.tl-cand.shake .tl-face { animation: tl-shake .45s ease both; }
@keyframes tl-shake { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
.tl-cand-face > .tl-avatar-wrap { margin-top: auto; }

.tl-cand-status {

  text-transform: uppercase; letter-spacing: 0.3px; line-height: 1.2;
}
.tl-cand-status.waiting { color: var(--rouge); background: rgba(225,29,72,0.06); }

.tl-dots { display: inline-flex; gap: 2px; margin-left: 3px; vertical-align: middle; }
.tl-dots i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; animation: tl-dot 1s ease-in-out infinite; }
.tl-dots i:nth-child(2) { animation-delay: .15s; }
.tl-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes tl-dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
/* Nouvelle recrue posée dans sa place, retour de l'effectif après une recherche */
.tl-card.tl-pop { animation: tl-pop .55s cubic-bezier(.2,.75,.25,1.3) both; }
@keyframes tl-pop { 0% { opacity: 0; transform: scale(.85); } 60% { opacity: 1; transform: scale(1.04); } 100% { transform: none; } }
.tl-card.tl-return { animation: tl-return .35s ease both; }
@keyframes tl-return { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .tl-flip { transition: none; }
  .tl-cand, .tl-cand.deal, .tl-cand .tl-face, .tl-card.tl-pop, .tl-card.tl-return, .tl-dots i { animation: none !important; transition: none; }
}

/* ---- FULLSCREEN DILEMMA VIEW & ANIMATIONS ---- */
.dilemma-container {
  flex: 1; display: flex; flex-direction: column; gap: 14px;
  will-change: transform, opacity;
}

.dilemma-container.slide-in {
  animation: slideInRight 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.dilemma-container.slide-out {
  animation: slideOutLeft 0.22s cubic-bezier(0.7, 0, 0.84, 0) forwards;
  pointer-events: none;
}

@keyframes slideInRight {
  0% { opacity: 0; transform: translateX(25px); }
  100% { opacity: 1; transform: translateX(0); }
}

@keyframes slideOutLeft {
  0% { opacity: 1; transform: translateX(0); }
  100% { opacity: 0; transform: translateX(-25px); }
}

.slide-out-up {
  animation: slideOutUp 0.22s cubic-bezier(0.7, 0, 0.84, 0) forwards;
  pointer-events: none;
}
.slide-in-up {
  animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes slideOutUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-30px); }
}
@keyframes slideInUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

.dilemma-card {
  background: rgba(255,255,255,0.65); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);

.dilemma-card::after {

/* ---- DILEMMES : en-tête encadré et carte de conséquences ----
   Même langage que la Conférence de rentrée : un en-tête léger et centré,

.dilemma-card.dilemma-hero {

  box-shadow: 0 10px 24px -14px rgba(15,23,42,0.12), 0 0 0 1px rgba(255,255,255,0.6) inset;

<body>
<div id="app"></div>

<script>
"use strict";

const BARS = ["#EAEAEA", "#F2E33B", "#3EC6C6", "#4CBB4C", "#D648C8", "#E8392F", "#2C3BD6"];

function renderMire(h = 8) {
  return `
    <div style="display: flex; height: ${h}px; border-radius: 2px; overflow: hidden;" aria-hidden="true">
      ${BARS.map(b => `<div style="flex: 1; background: ${b};"></div>`).join('')}
    </div>
  `;
}

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(seededRandom() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const GRP_COST = { j1524: 0.8, a2549: 1.2, s50: 0.7, csp: 1.5 };
const VOLUME_PUB = 2; // M€ par point de PDA moyenne de saison (base annuelle, calibrée pour que les revenus restent proportionnés au budget de grille)
const TRESORERIE_CRITIQUE = -60; // seuil de mise sous tutelle (M€)

const nf1 = n => n.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

function fmtDelta(val, decimals, suffix) {
  const sign = val > 0 ? '+' : (val < 0 ? '' : '±');
  const formatted = val.toLocaleString('fr-FR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return `${sign}${formatted}${suffix}`;
}

function renderEvolutionChart(points) {
  if (points.length < 2) {
    return `
      <div class="eh-title">Évolution de votre chaîne</div>
      <div class="eh-subtitle">Performance des principaux indicateurs sur les 5 dernières saisons</div>
      <div class="spark-empty">Graphique disponible après la saison 1</div>
    `;
  }
  const series = [
    { key: 'coutGrille', color: 'var(--gris)', icon: '📋', label: 'Coût de grille', suffix: ' M€' },
    { key: 'revenusPub', color: 'var(--vert)', icon: '📺', label: 'Revenus pub', suffix: ' M€' }
  ];
  const recentPoints = points.slice(-5);
  const w = 280, h = 215, padTop = 16, padSide = 6;
  const baseline = h - 20;
  const chartH = baseline - padTop;
  const n = recentPoints.length;
  const groupGap = 10;
  const barGap = 3;
  const groupW = (w - padSide * 2 - groupGap * (n - 1)) / n;
  const barW = (groupW - barGap) / 2;
  const max = Math.max(...recentPoints.flatMap(pt => series.map(s => pt[s.key])), 1);

  const barsHtml = recentPoints.map((pt, i) => {
    const groupX = padSide + i * (groupW + groupGap);
    const groupBars = series.map((s, si) => {
      const v = pt[s.key];
      const x = groupX + si * (barW + barGap);
      const barH = Math.max((v / max) * chartH, 2);
      const y = baseline - barH;
      return `
        <text x="${(x + barW / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="middle" font-family="'Anton', sans-serif" font-size="7.5" fill="var(--ink)">${nf1(v)}</text>
        <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${s.color}">
          <title>Saison ${pt.season} — ${s.label} : ${nf1(v)}${s.suffix}</title>
        </rect>
      `;
    }).join('');
    const seasonLabel = `<text x="${(groupX + groupW / 2).toFixed(1)}" y="${(baseline + 12).toFixed(1)}" text-anchor="middle" font-size="9" font-style="italic" fill="var(--gris)">Saison ${pt.season}</text>`;
    return groupBars + seasonLabel;
  }).join('');

  return `
    <div class="eh-title">Évolution de votre chaîne</div>
    <div class="eh-subtitle">Performance des principaux indicateurs sur les 5 dernières saisons</div>
    <div class="eh-legend">
      ${series.map(s => `<span class="eh-legend-item"><i style="background:${s.color}"></i>${s.icon} ${s.label}</span>`).join('')}
    </div>
    <svg class="eh-bar-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">${barsHtml}</svg>
  `;
}

function renderProgramGrid(type, pdaCible, overrides) {
  if (radarState().open && gameState.competitors?.length) {
    const sheetOpen = radarState().sheet !== null && !!gameState.competitors[radarState().sheet];
    return `
      <div class="pg-slide radar-mode">
        <div class="pg-head pg-head-row${sheetOpen ? ' sheet-open' : ''}">
          <div>
            <div class="eh-title">${sheetOpen ? esc(gameState.competitors[radarState().sheet].name) : 'Concurrence'}</div>
            ${sheetOpen ? '' : '<div class="eh-subtitle">Cliquez sur une chaîne pour découvrir sa stratégie.</div>'}
          </div>
          <div class="radar-head-actions">
            ${sheetOpen ? '<button type="button" class="radar-toggle" data-radar-action="back">← Retour</button>' : ''}
            <button type="button" class="radar-toggle active" data-radar-action="toggle">⚔️ Ma grille</button>
          </div>
        </div>
        ${renderRadarPanel()}
      </div>
    `;
  }
  const grid = PROGRAM_GRID[type];
  const targetKey = gameState.player.target;
  const calculated = getCalculatedPDAs();

  const rows = TIME_SLOTS.map(slot => {
    const playerCalculation = calculated.find(c => c.channel === gameState.player);
    const slotValue = playerCalculation.slots[slot.key][targetKey];
    const leadIn = playerCalculation.leadIns[slot.key][targetKey] || 0;
    const career = gameState.player.contracts?.[slot.key]?.career;
    const competitorPressure = gameState.competitors.some(c => c.slotInvestments?.[slot.key]?.expires >= gameState.season);
    const indicators = `${leadIn > 0.05 ? '🔥' : leadIn < -0.05 ? '↘️' : ''}${career?.wear >= 50 ? '⚠️' : ''}${competitorPressure ? '⚔️' : ''}${career?.historic ? '⭐' : ''}`;
    const competitorValues = calculated
      .filter(c => c.channel !== gameState.player)
      .map(c => c.slots[slot.key][targetKey]);
    const rank = 1 + competitorValues.filter(v => v > slotValue + 1e-9).length;
    const isLeaderSlot = rank === 1;
    const isKeySlot = slot.key === 'prime';
    const isUpdated = !!(overrides && overrides[slot.key]);
    const programme = isUpdated ? overrides[slot.key] : grid[slot.key];
    return `
      <details class="pg-slot-editor" data-slot-editor="${slot.key}">
      <summary class="pg-row${isKeySlot ? ' pg-row-key' : ''}" aria-label="Modifier le créneau ${slot.label}">
        <span class="pg-time-pill">${slot.range}</span>
        <span class="pg-info">
          <span class="pg-info-title">${slot.label}${isKeySlot ? '<span class="pg-key-tag">Clé</span>' : ''}${indicators ? ` <span title="Locomotive, usure, concurrence ou franchise">${indicators}</span>` : ''}</span>
          <span class="pg-info-program${isUpdated ? ' pg-program-updated' : ''}">${esc(programme)}${isUpdated ? ' <span class="pg-updated-badge" title="Programme modifié par vos choix éditoriaux">🆕</span>' : ''}</span>
        </span>
        <span class="pg-rank${isLeaderSlot ? ' pg-rank-leader' : ''}"${isLeaderSlot ? ' title="Leader sur ce créneau"' : ''}>#${rank}</span>
        <span class="pg-pda-badge pg-badge-${slot.accent}">${nf1(slotValue)}% PDA</span>
        <svg class="pg-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </summary>
      ${renderProgramManager(slot.key)}
      </details>
    `;
  }).join('');
  return `
    <div class="pg-slide">
      <div class="pg-head pg-head-row">
        <div>
          <div class="eh-title">Grille de la chaîne</div>
          <div class="eh-subtitle">Cliquez sur un créneau pour choisir son programme et sa production.</div>
        </div>
        <button type="button" class="radar-toggle" data-radar-action="toggle">⚔️ Voir la concurrence</button>
      </div>
      <div class="pg-rows">${rows}</div>
    </div>
  `;
}

function renderGlobalAudienceShare() {
  const activeKey = gameState.audienceShareTarget || gameState.player.target;
  const activeTarget = AUDIENCE_TARGETS.find(t => t.key === activeKey) || AUDIENCE_TARGETS[0];

  const calculated = getCalculatedPDAs();
  const playerCalc = calculated.find(item => item.channel === gameState.player);
  const playerValue = playerCalc.pda[activeTarget.key];

  const standings = calculated.map(item => ({
    name: item.channel === gameState.player ? item.name + ' (Vous)' : item.name,
    pda: item.pda[activeTarget.key],
    isPlayer: item.channel === gameState.player
  })).sort((a, b) => b.pda - a.pda);
  const max = Math.max(...standings.map(s => s.pda), 1);

  const strategicKey = gameState.player.target;
  const orderedTargets = [
    ...AUDIENCE_TARGETS.filter(t => t.key === strategicKey),
    ...AUDIENCE_TARGETS.filter(t => t.key !== strategicKey)
  ];
  const switcherHtml = orderedTargets.map(t => `
    <button class="ga-target-btn${t.key === activeTarget.key ? ' active' : ''}" data-audience-target="${t.key}">${t.short}</button>
  `).join('');

  const rows = standings.map((s, idx) => `
    <div class="ga-row${s.isPlayer ? ' ga-player' : ''}">
      <div class="ga-rank">#${idx + 1}</div>
      <div class="ga-info">
        <div class="ga-name">${esc(s.name)}</div>
        <div class="ga-bar-track"><div class="ga-bar-fill" style="width:${(s.pda / max * 100).toFixed(1)}%"></div></div>
      </div>
      <div class="ga-pct">${nf1(s.pda)}%</div>
    </div>
  `).join('');

  return `
    <div class="ga-panel" id="ga-panel">
      <div class="ga-header">
        <div class="eh-title">Part d'audience</div>
        <div class="ga-target-switcher">${switcherHtml}</div>
      </div>
      <div class="ga-headline">
        <div class="ga-headline-value">${nf1(playerValue)}%</div>
        <div class="ga-headline-label">${activeTarget.full}</div>
      </div>
      <div class="ga-rows">${rows}</div>
    </div>
  `;
}

// ---------------------------------------------------------------------------
// TALENTS — effectif sous contrat (source unique : gameState.player.talents)
// ---------------------------------------------------------------------------
// Trois places de talent : chaque talent occupe la place où il a été recruté.
const TALENT_SLOTS = 3;
// Recrutement à tout moment : délai de réponse du profil, puis affichage du verdict.
const TALENT_WAIT_MS = 1800;
const TALENT_REVEAL_MS = 1100;

function activePlayerTalents() {
  return (gameState.player.talents || []).filter(t => t.until >= gameState.season);
}

// Saison de signature : enregistrée au recrutement, sinon déduite de la durée du contrat.
function talentSince(t) {
  return t.since ?? (t.until - GAME_BALANCE.mercato.duration + 1);
}

// Rôle affiché sur les cartes : version courte quand la carte est étroite (mobile).
function talentRoleHtml(t) {
  const short = t.shortRole || MERCATO_TALENTS.find(x => x.id === t.id)?.shortRole;
  return short && short !== t.role
    ? `<span class="tl-long">${esc(t.role)}</span><span class="tl-short">${esc(short)}</span>`
    : esc(t.role);
}

// Répartition des talents actifs dans les places ; un talent sans place (ou en
// conflit) reçoit la première place libre.
function talentSlotLayout() {
  const slots = Array(TALENT_SLOTS).fill(null);
  const rest = [];
  activePlayerTalents().forEach(t => {
    if (Number.isInteger(t.slot) && t.slot >= 0 && t.slot < TALENT_SLOTS && !slots[t.slot]) slots[t.slot] = t;
    else rest.push(t);
  });
  rest.forEach(t => {
    const i = slots.indexOf(null);
    if (i >= 0) { slots[i] = t; t.slot = i; }
  });
  return slots;
}

function firstFreeTalentSlot() {
  return talentSlotLayout().indexOf(null);
}

// Talents indisponibles : sous contrat chez le joueur ou chez un concurrent.
function takenTalentIds() {
  const rivals = gameState.competitors.flatMap(c => (c.talents || []).filter(t => t.until >= gameState.season));
  return new Set([...activePlayerTalents(), ...rivals].map(t => t.id));
}

// Profils proposés pendant la saison : trois au plus, renouvelés quand l'un est
// recruté ; un profil qui a décliné reste affiché (et indisponible) jusqu'à la
// saison suivante.
function talentMarket() {
  let market = gameState.talentMarket;
  if (!market || market.season !== gameState.season) {
    market = gameState.talentMarket = { season: gameState.season, offers: [], refused: [] };
  }
  const taken = takenTalentIds();
  market.offers = market.offers.filter(o => !taken.has(o.id));
  const need = TALENT_SLOTS - market.offers.length;
  if (need > 0) {
    const p = gameState.player;
    const shown = new Set([...market.offers.map(o => o.id), ...market.refused]);
    // Les profils du mercato en cours ne sont pas proposés deux fois.
    if (gameState.mercato && !gameState.mercato.result) gameState.mercato.offers.forEach(o => shown.add(o.id));
    const ranked = MERCATO_TALENTS.filter(t => !taken.has(t.id) && !shown.has(t.id))
      .map(t => ({ t, k: marketRandom() + (slotsMatchingGenre(p, t.specialty) ? 1 : 0) }))
      .sort((a, b) => b.k - a.k).map(x => x.t);
    // Des genres variés d'abord, puis le reste du classement.
    const picks = [];
    ranked.forEach(t => { if (picks.length < need && !picks.some(x => x.specialty === t.specialty)) picks.push(t); });
    ranked.forEach(t => { if (picks.length < need && !picks.includes(t)) picks.push(t); });
    market.offers.push(...picks.map(buildTalentOffer));
  }
  return market;
}

function openTalentScouting(slot) {
  if (gameState.step !== 6 || talentSlotLayout()[slot] || gameState.talentScouting?.pending) return false;
  talentMarket();
  gameState.talentFlipped = null;
  gameState.talentScouting = { slot, pending: null, dealt: false };
  return true;
}

function closeTalentScouting() {
  const sc = gameState.talentScouting;
  if (!sc || sc.pending) return false;
  gameState.talentScouting = null;
  gameState.talentsReturn = true;
  return true;
}

// Signature d'un talent dans une place : salaire ajouté aux dépenses récurrentes,
// audience et recettes pub réestimées (comme au mercato).
function signTalent(offer, slot) {
  const p = gameState.player;
  applyFinance({ recurring: offer.annual, purchase: 0, commercial: 0 });
  p.talents = [...(p.talents || []), {
    id: offer.id, name: offer.name, specialty: offer.specialty, role: offer.role,
    annual: offer.annual, bonus: offer.bonus, until: gameState.season + GAME_BALANCE.mercato.duration - 1,
    since: gameState.season, affinities: offer.affinities, slot
  }];
  p.coutTalentsSaison += offer.annual;
  reevaluateAdRevenue();
  const audience = getCalculatedPDAs().find(c => c.channel === p).pda[p.target];
  p.pdaHistorySeason = [audience]; p.pdaMoyenneSaison = audience; p.pdaFinSaison = audience;
  refreshEconomy();
}

function talentOfferAffordable(offer) {
  return quoteFinance({ recurring: offer.annual, purchase: 0, commercial: 0 }).cash >= TRESORERIE_CRITIQUE;
}

// Offre à un profil : la réponse est tirée tout de suite (et la signature
// comptabilisée), mais révélée après un temps d'attente.
function makeTalentOffer(idx) {
  const sc = gameState.talentScouting;
  const market = gameState.talentMarket;
  if (!sc || sc.pending || gameState.step !== 6 || !market) return false;
  const offer = market.offers[idx];
  if (!offer || market.refused.includes(offer.id) || talentSlotLayout()[sc.slot] || !talentOfferAffordable(offer)) return false;
  const accepted = marketRandom() < offer.chance;
  if (accepted) signTalent(offer, sc.slot);
  else market.refused.push(offer.id);
  sc.pending = { idx, id: offer.id, accepted, phase: 'waiting' };
  refreshTalentsPanel();
  setTimeout(() => {
    if (gameState.talentScouting !== sc) return;
    sc.pending.phase = 'reveal';
    refreshTalentsPanel();
    setTimeout(() => {
      if (gameState.talentScouting !== sc) return;
      if (accepted) {
        gameState.talentScouting = null;
        gameState.talentJustSigned = offer.id;
        render();
      } else {
        sc.pending = null;
        refreshTalentsPanel();
      }
    }, TALENT_REVEAL_MS);
  }, TALENT_WAIT_MS);
  return true;
}

function refreshTalentsPanel() {
  const panel = document.getElementById('tl-panel');
  if (!panel) return;
  panel.outerHTML = renderTalentsSlide();
  fitTalentCards();
}

// Cases de la grille dont le genre correspond à la spécialité du talent.
function talentPrograms(t) {
  const p = gameState.player;
  return TIME_SLOTS.filter(({ key }) => channelSlotProfile(p, key).genre === t.specialty).map(({ key, label }) => ({
    slot: key, label,
    name: activeContract(p, key)?.name || p.grilleOverrides?.[key] || PROGRAM_GRID[p.type][key]
  }));
}

// Effet réel du talent : écart de PDA sur la cible de la chaîne avec et sans lui.
function talentAudienceEffect(t) {
  const p = gameState.player;
  const all = p.talents;
  const withTalent = getCalculatedPDAs().find(r => r.channel === p).pda[p.target];
  try {
    p.talents = all.filter(x => x !== t);
    return withTalent - getCalculatedPDAs().find(r => r.channel === p).pda[p.target];
  } finally {
    p.talents = all;
  }
}

// Règle de rupture des contrats (identique à celle des programmes remplacés) : le
// salaire est dû pour chaque saison restante, saison en cours comprise ; la part
// de la saison en cours, déjà versée, est restituée avec le retrait du salaire.
// Une prolongation revalorise le salaire à partir de la saison suivante : les
// saisons ajoutées sont dues au nouveau salaire.
function talentIndemnity(t) {
  const remaining = Math.max(0, t.until - gameState.season + 1);
  const later = Math.max(0, remaining - 1) * (t.nextAnnual ?? t.annual);
  return { remaining, indemnity: Math.round((Math.min(1, remaining) * t.annual + later) * 100) / 100 };
}

function quoteTalentDismissal(t) {
  const { remaining, indemnity } = talentIndemnity(t);
  const finance = { recurring: -t.annual, purchase: indemnity, commercial: 0 };
  // Sans le talent, l'audience baisse : les recettes pub sont réestimées comme
  // le fera reevaluateAdRevenue au licenciement.
  const p = gameState.player;
  const all = p.talents;
  let adDelta = 0;
  try {
    p.talents = all.filter(x => x !== t);
    const pda = getCalculatedPDAs().find(r => r.channel === p).pda[p.target];
    adDelta = computeRevenusPub(pda, p.target, p.popularite, p.puissanceCommerciale) + regieRevenueTotal(p) - p.revenusPubPrevisionnels;
  } finally {
    p.talents = all;
  }
  const net = indemnity - t.annual;
  const cashDelta = adDelta - net;
  return { remaining, indemnity, finance, net, adDelta, cashDelta, allowed: p.tresorerie + cashDelta >= TRESORERIE_CRITIQUE };
}

// Prolongation : possible pendant la dernière saison du contrat, pour la durée
// d'un contrat de mercato, avec une revalorisation du salaire dès la saison suivante.
const TALENT_EXTENSION_RAISE = 0.1;

function quoteTalentExtension(t) {
  const seasons = GAME_BALANCE.mercato.duration;
  const remaining = t.until - gameState.season + 1;
  const newAnnual = Math.round(t.annual * (1 + TALENT_EXTENSION_RAISE) * 10) / 10;
  const lastSeason = remaining <= 1 && t.nextAnnual == null;
  return { seasons, newUntil: t.until + seasons, newAnnual, lastSeason, allowed: lastSeason && gameState.step === 6 };
}

function extendTalent(talentId) {
  const t = activePlayerTalents().find(x => x.id === talentId);
  if (!t) return false;
  const q = quoteTalentExtension(t);
  if (!q.allowed) return false;
  t.since = talentSince(t);
  t.until = q.newUntil;
  // Aucun flux immédiat : la saison en cours reste au salaire actuel.
  t.nextAnnual = q.newAnnual;
  t.nextAnnualFrom = gameState.season + 1;
  return true;
}

function dismissTalent(talentId) {
  const p = gameState.player;
  const t = activePlayerTalents().find(x => x.id === talentId);
  if (!t || gameState.step !== 6) return false;
  const { finance, indemnity, allowed } = quoteTalentDismissal(t);
  if (!allowed) return false;
  applyFinance(finance);
  // L’indemnité reste un coût de talent : le bilan la range avec les salaires.
  p.coutTalentsSaison = Math.max(0, p.coutTalentsSaison - t.annual + indemnity);
  p.talents = (p.talents || []).filter(x => x !== t);
  // Le bonus disparaît avec le talent : audience et recettes pub sont réestimées.
  reevaluateAdRevenue();
  const audience = getCalculatedPDAs().find(c => c.channel === p).pda[p.target];
  p.pdaHistorySeason = [audience]; p.pdaMoyenneSaison = audience; p.pdaFinSaison = audience;
  refreshEconomy();
  return true;
}

function renderTalentsSlide() {
  const p = gameState.player;
  const talents = activePlayerTalents();
  const slots = talentSlotLayout();
  const payroll = talents.reduce((sum, t) => sum + t.annual, 0);
  const targetShort = AUDIENCE_TARGETS.find(t => t.key === p.target)?.short || p.target;
  const inSeason = gameState.step === 6;
  const sc = inSeason ? gameState.talentScouting : null;
  const market = gameState.talentMarket;
  const seasonsTxt = n => `${n} saison${n > 1 ? 's' : ''}`;
  const justSigned = gameState.talentJustSigned;
  const returning = gameState.talentsReturn;
  gameState.talentJustSigned = null;
  gameState.talentsReturn = false;

  const card = t => {
    const remaining = t.until - gameState.season + 1;
    const programs = talentPrograms(t);
    const effect = programs.length ? talentAudienceEffect(t) : 0;
    const badges = [
      talentSince(t) === gameState.season ? '<span class="tl-badge tl-badge-new">Nouvelle recrue</span>' : '',
      remaining <= 1 ? '<span class="tl-badge tl-badge-end">Fin de contrat</span>' : ''
    ].join('');
    const effectText = `+${nf1(Math.max(0, effect))} pt de PDA ${targetShort}`;
    const programsText = programs.length
      ? programs.map(x => x.name).join(', ')

    const programsTitle = programs.length
      ? 'Programmes renforcés : ' + programs.map(x => `${x.label} · ${x.name}`).join(' ; ')
      : programsText;
    const flipped = gameState.talentFlipped === t.id;
    const ext = quoteTalentExtension(t);
    const extNote = !inSeason ? 'Actions possibles pendant la saison'
      : t.nextAnnual != null ? `Déjà prolongé · ${nf1(t.nextAnnual)} M€/saison dès la saison ${t.nextAnnualFrom}`
      : !ext.lastSeason ? 'Prolongation possible lors de la dernière saison du contrat' : '';
    return `
      <article class="tl-card${flipped ? ' flipped' : ''}${t.id === justSigned ? ' tl-pop' : returning ? ' tl-return' : ''}" data-talent-id="${esc(t.id)}">
       <div class="tl-flip">
        <div class="tl-face tl-front" role="button" tabindex="0" aria-expanded="${flipped}" aria-label="${esc(t.name)} : afficher les actions" ${flipped ? 'inert' : ''}>
        <span class="tl-flip-hint" aria-hidden="true">↻</span>
        <span class="tl-avatar-wrap">
          <span class="mercato-avatar tl-avatar"><img src="${MERCATO_AVATARS[t.id] || ''}" alt="" width="44" height="44"></span>
          ${badges ? `<span class="tl-badges">${badges}</span>` : ''}
        </span>
        <span class="tl-name">${esc(t.name)}</span>
        <span class="tl-role" title="${esc(t.role)}">${talentRoleHtml(t)}</span>
        <span class="pg-pda-badge pg-badge-bleu tl-genre">${esc(GENRE_LABELS[t.specialty] || t.specialty)}</span>
        <span class="tl-criteria">${talentCoreCriteria(t, slotsMatchingGenre(p, t.specialty)).map(c => `
          <span class="tl-criterion"><span class="tl-criterion-label" title="${esc(c.label)}"><span class="tl-long">${esc(c.label)}</span><span class="tl-short">${esc(c.short)}</span></span>${mercatoStarsHtml(c.value, c.label)}</span>`).join('')}
        </span>
        <span class="tl-chips">
          <span class="tl-chip tl-chip-pay" title="Salaire par saison">${nf1(t.annual)} M€<span class="tl-chip-unit">/saison</span></span>
          <span class="tl-chip tl-chip-term${remaining <= 1 ? ' end' : ''}" title="Durée restante du contrat, saison en cours comprise">${seasonsTxt(remaining)}</span>
        </span>
        ${programs.length ? `<span class="tl-effect">${esc(effectText)}</span>` : ''}
        <span class="tl-programs${programs.length ? '' : ' none'}" title="${esc(programsTitle)}">${esc(programsText)}</span>
        </div>
        <div class="tl-face tl-back" ${flipped ? '' : 'inert'}>
          <button type="button" class="tl-back-close" data-talent-unflip aria-label="Revenir à la carte">↺</button>
          <span class="mercato-avatar tl-avatar tl-back-avatar"><img src="${MERCATO_AVATARS[t.id] || ''}" alt="" width="44" height="44"></span>
          <span class="tl-name">${esc(t.name)}</span>
          <span class="tl-back-sub"><span class="tl-back-role">${esc(t.role)}</span><br>Contrat jusqu’à la saison ${t.until}</span>
          <button type="button" class="tl-action tl-action-extend" data-talent-extend="${esc(t.id)}" ${ext.allowed ? '' : 'disabled'}>
            <span class="tl-action-label">Prolonger</span>
            <span class="tl-action-sub">+${seasonsTxt(ext.seasons)} · ${nf1(ext.newAnnual)}\u00a0M€/saison</span>
          </button>
          <button type="button" class="tl-action tl-action-fire" data-talent-fire="${esc(t.id)}" ${inSeason ? '' : 'disabled'}>

        <span class="tl-plus-label">${inSeason ? 'Recruter un talent' : 'Recrutement pendant la saison'}</span>
      </button>`;

  // Profil proposé pendant une recherche.
  const candCard = (offer, i) => {
    const pend = sc.pending;
    const chosen = pend && pend.idx === i;
    const refused = market.refused.includes(offer.id) && !(chosen && pend.phase === 'waiting');
    const affordable = talentOfferAffordable(offer);
    let state = '';
    let footer;
    if (chosen && pend.phase === 'waiting') {
      state = ' waiting';
      footer = '<span class="tl-cand-status waiting" role="status">En attente de réponse<span class="tl-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>';
    } else if (chosen && pend.accepted) {
      state = ' accepted';
      footer = '<span class="tl-cand-status ok" role="status">✓ Offre acceptée</span>';
    } else if (refused) {
      state = chosen ? ' declined shake' : ' declined';
      footer = '<span class="tl-cand-status ko" role="status">✕ Offre déclinée</span>';
    } else {
      footer = `<button type="button" class="tl-action tl-action-offer" data-scout-offer="${i}" ${pend || !affordable ? 'disabled' : ''} title="${Math.round(offer.chance * 100)} % de chances de signature">
          <span class="tl-action-label">Recruter</span>
          ${affordable ? '' : '<span class="tl-action-sub">Trésorerie insuffisante</span>'}
        </button>`;
    }
    const fading = pend && !chosen ? (pend.accepted && pend.phase === 'reveal' ? ' leaving' : ' dimmed') : '';
    const criteria = [...talentCoreCriteria(offer, slotsMatchingGenre(p, offer.specialty)),
      { label: 'Chances de signature', short: 'Chances', value: offer.chance * 5 }];
    return `
      <article class="tl-card tl-cand${state}${fading}${sc.dealt ? '' : ' deal'}" style="--i:${i}" data-cand-id="${esc(offer.id)}">

  }

          <li><span>Salaire de la saison en cours restitué</span><b>+${nf1(t.annual)} M€</b></li>
          <li><span>Recettes pub (audience perdue)</span><b>${q.adDelta < 0 ? '−' : '+'}${nf1(Math.abs(q.adDelta))} M€</b></li>
          <li class="fire-total"><span>Impact sur la trésorerie</span><b class="${q.cashDelta < -0.05 ? 'neg' : ''}">${q.cashDelta < -0.05 ? '−' : q.cashDelta > 0.05 ? '+' : ''}${nf1(Math.abs(q.cashDelta))} M€</b></li>

      </div>
    </div>`;

function closeTalentDismissal() {
  const sheet = document.getElementById('talent-fire-sheet');
  if (!sheet) return;
  sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('mobile-picker-lock');
}

function renderStatStars(player, pdaCible, compliance) {
  const popFilled = Math.round((player.popularite / 100) * 5);
  const popClass = player.popularite >= 60 ? 'good' : (player.popularite >= 40 ? 'warn' : 'bad');

  const lower = 50;
  const upper = Math.max(player.coutGrilleEngageSaison * 5, lower + 1);
  let tresoFilled;
  if (player.tresorerie <= lower) tresoFilled = 1;
  else if (player.tresorerie >= upper) tresoFilled = 5;
  else tresoFilled = 1 + Math.round(((player.tresorerie - lower) / (upper - lower)) * 4);
  const tresoClass = player.tresorerie < 0 ? 'bad' : (tresoFilled >= 4 ? 'good' : 'warn');

  const perfLower = 0.05, perfUpper = 0.30;
  const efficacite = pdaCible / Math.max(player.coutGrilleEngageSaison, 0.01);
  let perfFilled;
  if (efficacite <= perfLower) perfFilled = 1;
  else if (efficacite >= perfUpper) perfFilled = 5;
  else perfFilled = 1 + Math.round(((efficacite - perfLower) / (perfUpper - perfLower)) * 4);
  const perfClass = perfFilled >= 4 ? 'good' : (perfFilled >= 2 ? 'warn' : 'bad');

  const arcomFilled = Math.round((compliance.arcomScore / 100) * 5);
  const arcomClass = compliance.arcomScore >= 75 ? 'good' : (compliance.arcomScore >= 60 ? 'warn' : 'bad');

  return `
    <div class="eh-title">Indicateurs de performance</div>
    <div class="eh-subtitle">Popularité, trésorerie, efficacité et conformité éditoriale</div>
    <div class="stat-list">
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">⭐</span>Popularité</div>
        <div class="stat-row-stars">${starRowHtml(popFilled)}</div>
        <div class="stat-row-value ${popClass}">${Math.round(player.popularite)}%</div>
      </div>
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">💰</span>Trésorerie</div>
        <div class="stat-row-stars">${starRowHtml(tresoFilled)}</div>
        <div class="stat-row-value ${tresoClass}">${nf1(player.tresorerie)} M€</div>
      </div>
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">📈</span>Performance</div>
        <div class="stat-row-stars">${starRowHtml(perfFilled)}</div>
        <div class="stat-row-value ${perfClass}">${Math.round(efficacite * 100)}%</div>
      </div>
      <div class="stat-row">
        <div class="stat-row-label"><span class="ic">⚖️</span>Conformité</div>
        <div class="stat-row-stars">${starRowHtml(arcomFilled)}</div>
        <div class="stat-row-value ${arcomClass}">${compliance.arcomScore}/100</div>
      </div>
    </div>
  `;
}

function computeAttractivite(popularite) {
  return 1 + (popularite - 50) / 200;
}

function computeRevenusPub(pdaGlobaleCourante, cible, popularite, puissanceCommerciale) {
  return pdaGlobaleCourante * GRP_COST[cible] * VOLUME_PUB * computeAttractivite(popularite) * puissanceCommerciale;
}

// Crédite en une fois l'intégralité des recettes publicitaires estimées, sur la base de la
// PDA globale courante, dès l'ouverture de la saison (avant même la proposition de
// programmation). Sert ensuite de référence : la proposition de programmation puis chaque
// dilemme ne créditeront plus que l'écart avec cette estimation, jamais la totalité une
// seconde fois.
// Recettes apportées par la régie (accélérateurs) : investissements reconduits chaque
// saison et opérations ponctuelles déjà encaissées sur la saison en cours. Elles restent
// acquises : les réestimations d'audience ne portent que sur le CA hors régie.
function regieRevenueTotal(p) {
  return (p.regieInvestissementsAnnuel || 0) + (p.regieRecettesSaison || 0);
}

function creditInitialAdRevenue() {
  const p = gameState.player;
  const pdaGlobaleCourante = getCalculatedPDAs().find(item => item.channel === p).pda[p.target];
  // Les investissements régie activés lors des saisons précédentes (Directeur de régie,
  // Studio Brand Content, Yield Management, etc.) reconduisent leur bénéfice chaque saison.
  // Les opérations ponctuelles, elles, ne valent que pour la saison où elles sont signées.
  p.regieRecettesSaison = 0;
  const revenusPubEstimes = computeRevenusPub(pdaGlobaleCourante, p.target, p.popularite, p.puissanceCommerciale)
    + regieRevenueTotal(p);
  p.tresorerie += revenusPubEstimes;
  p.revenusPubPrevisionnels = revenusPubEstimes;
}

// Réévalue les recettes publicitaires à partir de la PDA globale courante et n'applique
// que l'écart avec l'estimation précédente (déjà créditée) — même mécanique que pour un
// dilemme, utilisée ici après un changement de programme via la proposition de saison.
function reevaluateAdRevenue() {
  const p = gameState.player;
  const pdaGlobaleCourante = getCalculatedPDAs().find(item => item.channel === p).pda[p.target];
  const revenusPubAvant = p.revenusPubPrevisionnels;
  p.revenusPubPrevisionnels = computeRevenusPub(pdaGlobaleCourante, p.target, p.popularite, p.puissanceCommerciale)
    + regieRevenueTotal(p);
  p.tresorerie += p.revenusPubPrevisionnels - revenusPubAvant;
}

function computeNextBudgetGrille(player) {
  // baseBudget est le capital de départ de la chaîne. La grille de départ est
  // calibrée à 30 % de ce capital : conserver ce même socle évite un saut de
  // 15 M€ à 50 M€ entre les saisons 1 et 2.
  const capitalInitial = CHANNEL_TYPES[player.type].baseBudget;
  const base = capitalInitial * 0.30;
  const bonusTresorerie = Math.max(0, (player.tresorerie - capitalInitial) * 0.12);
  const bonusPerformance = Math.max(0, player.rentabiliteGrille * 0.08);
  const raw = base + bonusTresorerie + bonusPerformance;
  return Math.max(base * 0.5, Math.min(raw, base * 2.5));
}

// pour une chaîne Sport, seuls ceux-ci sont piochés parmi les dilemmes universels, en plus des

// dilemmes universels comme avant.
const SPORT_RELATED_UNIVERSAL_IDS = ['d2', 'd6', 'd14', 'd20', 'd42', 'd65', 'd66', 'd72',
  'd_pub1', 'd_pub2', 'd_pub3', 'd_pub4', 'd_pub5', 'd_pub6', 'd_pub7', 'd_pub9', 'd_pub10',

function getEligibleDilemmas() {
  const type = gameState.player.type;
  return DILEMMA_BANK.filter(d => {
    // Un dilemme lie a un programme nomme n'est propose que si celui-ci est encore
    // present dans la grille. Les donnees actuelles sont generiques, mais cette regle
    // permet aux futurs dilemmes contextualises d'utiliser programId sans contournement.
    if (d.programId && !Object.values(gameState.player.contracts || {}).some(c => c.id === d.programId)) return false;
    // Un investissement régie déjà réalisé (département, studio, technologie…) reste acquis :
    // il n'est pas reproposé, sinon sa recette annuelle serait comptée deux fois.
    if (REGIE_INVESTMENT_IDS.includes(d.id)
      && (gameState.player.decisionHistory || []).some(h => h.id === d.id && h.commercial > 0)) return false;
    if (d.types) return d.types.includes(type);
    if (type === 'sport') return SPORT_RELATED_UNIVERSAL_IDS.includes(d.id);
    return true;
  });
}

function pickDilemmaQueue() {
  const pool = getEligibleDilemmas().filter(d => !isMercatoSeason() || !MERCATO_OVERLAP_DILEMMAS.includes(d.id));
  const available = pool.filter(d => !gameState.seenDilemmaIds.includes(d.id));
  let queue = shuffle(available).slice(0, 3);
  if (queue.length < 3) {
    gameState.seenDilemmaIds = [];
    const usedIds = new Set(queue.map(d => d.id));
    const remainingPool = pool.filter(d => !usedIds.has(d.id));
    queue = queue.concat(shuffle(remainingPool).slice(0, 3 - queue.length));
  }
  gameState.seenDilemmaIds.push(...queue.map(d => d.id));
  ensureCampaign();
  const event = STORY_EVENTS.find(e=>e.eligible(gameState.player)&&!gameState.player.eventsSeen.includes(e.id));
  if(event) { queue[queue.length-1]=event; gameState.player.eventsSeen.push(event.id); }
  // Opportunité régie : prend la place d'un dilemme standard, comme les événements.
  if (queue.length >= 2 && regieOpportunityEligible()) {
    queue[1] = createRegieOpportunityDilemma();
    gameState.player.lastRegieOpportunity = gameState.season;
  }
  // Le renouvellement est une décision éditoriale à part entière : lorsqu'un programme
  // arrive à un moment clé, il remplace le dernier choix de la saison plutôt que
  // d'interrompre le bilan une fois les comptes déjà arrêtés. Si plusieurs programmes
  // sont à renouveler en même temps, leurs dilemmes s'enchaînent tous en fin de saison
  // plutôt que de n'en traiter qu'un seul et reporter les autres.
  // Plusieurs programmes à arbitrer : un premier dilemme propose de reconduire toute la
  // grille à l'identique ; en cas de refus, les arbitrages programme par programme
  // s'enchaînent ensuite comme d'habitude.
  const pendingRenewals = selectCareerDecisions()
    .filter(pending => createCareerRenewalDilemma(pending));
  if (pendingRenewals.length >= 2) {
    queue[queue.length - 1] = createGridRenewalDilemma(pendingRenewals);
    return queue;
  }
  pendingRenewals.forEach((pending, i) => {
    const careerDilemma = createCareerRenewalDilemma(pending);
    if (i === 0) queue[queue.length - 1] = careerDilemma;
    else queue.push(careerDilemma);
  });
  return queue;
}

function createGridRenewalDilemma(pendingRenewals) {
  const p = gameState.player;
  const zeroPda = { j1524: 0, a2549: 0, s50: 0, csp: 0 };
  const programs = pendingRenewals.map(pending => {
    const contract = p.contracts[pending.slot];
    const career = migrateProgramCareer(contract, pending.slot);
    return { slot: pending.slot, name: contract.name, wear: Math.round(career.wear), historic: !!career.historic };
  });
  return {
    id: `grid-renewal-${gameState.season}`, isGridRenewal: true, gridRenewals: pendingRenewals, gridPrograms: programs,
    titre: 'Reconduire la grille ?',
    desc: `Dernier arbitrage de la saison : ${programs.length} programmes arrivent à un moment clé. Vous pouvez reconduire toute la grille à l'identique, ou décider de l'avenir de chacun.`,
    c: [
      { l: 'Renouveler toute la grille à l’identique', gridRenewal: 'all', pillLabel: `${programs.length} programmes reconduits`,
        pda: { ...zeroPda }, audienceImpacts: [], pop: 0, finance: { recurring: 0, purchase: 0, commercial: 0, category: 'N' },
        r: 'La grille est reconduite telle quelle : vos programmes conservent leurs repères et leur public, mais leur usure continue.' },
      { l: 'Arbitrer programme par programme', gridRenewal: 'each', pillLabel: 'Au cas par cas',
        pda: { ...zeroPda }, audienceImpacts: [], pop: 0, finance: { recurring: 0, purchase: 0, commercial: 0, category: 'N' },
        r: 'Chaque programme passe devant la direction : renouveler, faire évoluer, relancer ou arrêter.' }
    ]
  };
}

function applyGridRenewalChoice(dilemma, choice) {
  const pendings = dilemma.gridRenewals || [];
  if (choice.gridRenewal === 'all') {
    pendings.forEach(pending => applyCareerDilemmaChoice(
      { careerSlot: pending.slot, programId: pending.programId }, { careerAction: 'renew' }));
    return;
  }
  // Arbitrage au cas par cas : les dilemmes de renouvellement s'insèrent juste après.
  const next = pendings.map(pending => createCareerRenewalDilemma(pending)).filter(Boolean);
  gameState.dilemmaQueue.splice(gameState.currentDilemmaIndex + 1, 0, ...next);
}

function initCompetitors() {
  const availableNames = FICTIONAL_CHANNEL_NAMES.filter(n => n.toLowerCase() !== gameState.player.name.toLowerCase());
  const names = shuffle(availableNames).slice(0, 5);
  const types = Object.keys(CHANNEL_TYPES);
  const targets = Object.keys(TARGET_STRATEGIES);

  const profileKeys = Object.keys(GAME_BALANCE.competitors.profiles);
  gameState.competitors = names.map((name, i) => {
    const cType = types[i % types.length];
    let cTarget = (i < 2) ? gameState.player.target : targets[(i + 1) % targets.length];
    const basePda = { ...CHANNEL_TYPES[cType].pdaMods };

    return {
      name,
      type: cType,
      target: cTarget,
      budget: CHANNEL_TYPES[cType].baseBudget,
      pda: basePda,
      strategy: profileKeys[i % profileKeys.length],
      slotInvestments: {},
      strategyHistory: []
    };
  });
}
